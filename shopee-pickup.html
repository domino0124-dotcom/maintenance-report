<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ee4d2d">
<title>蝦皮取件清單</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1d1f23;
    --muted: #6b7280;
    --line: #e5e7eb;
    --brand: #ee4d2d;
    --ok: #16a34a;
    --warn: #d97706;
    --danger: #dc2626;
    --chip: #f3f4f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111315; --card: #1b1e22; --text: #eceef1; --muted: #9aa1ab;
      --line: #2a2e34; --chip: #24282e;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--brand); color: #fff;
    padding: calc(12px + env(safe-area-inset-top)) 16px 0; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-size: 19px; margin: 0; font-weight: 700; }
  .refresh { background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 999px;
    padding: 7px 14px; font-size: 14px; font-weight: 600; }
  .tabs { display: flex; margin-top: 10px; }
  .tab { flex: 1; background: none; border: 0; color: rgba(255,255,255,.75); font-size: 15px; font-weight: 600;
    padding: 10px 0 12px; border-bottom: 3px solid transparent; }
  .tab.on { color: #fff; border-color: #fff; }
  .tab b.red { background: #7f1d1d; color: #fff; }
  .tab b { display: inline-block; min-width: 22px; padding: 0 6px; margin-left: 4px; border-radius: 999px;
    background: #fff; color: var(--brand); font-size: 12px; line-height: 20px; }
  main { padding: 12px 16px calc(90px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px;
    transition: opacity .25s, transform .25s; }
  .card.gone { opacity: 0; transform: translateX(40px); }
  .row1 { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .shop { font-weight: 700; font-size: 16px; }
  .id { color: var(--muted); font-size: 13px; margin-left: 4px; font-weight: 500; }
  .badge { flex: none; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .badge.today { background: var(--danger); color: #fff; }
  .badge.soon { background: #fde7c7; color: #92400e; }
  .badge.late { background: #fee2e2; color: var(--danger); }
  @media (prefers-color-scheme: dark) { .badge.soon { background: #4a3413; color: #fbbf77; } .badge.late { background: #3d1b1b; color: #fca5a5; } }
  .code { display: flex; align-items: center; gap: 10px; margin: 10px 0 8px; }
  .code .num { font-size: 30px; font-weight: 800; letter-spacing: 3px; font-variant-numeric: tabular-nums; }
  .copy { border: 1px solid var(--line); background: var(--chip); color: var(--text); border-radius: 8px; padding: 4px 10px; font-size: 13px; }
  .meta { color: var(--muted); font-size: 14px; }
  .meta div { margin-top: 2px; word-break: break-all; }
  .act { display: flex; gap: 8px; margin-top: 12px; }
  .btn { flex: 1; border: 0; border-radius: 10px; padding: 12px; font-size: 16px; font-weight: 700; }
  .btn.done { background: var(--ok); color: #fff; }
  .btn.undo { background: var(--chip); color: var(--text); border: 1px solid var(--line); }
  .btn:disabled { opacity: .5; }
  .empty { text-align: center; color: var(--muted); padding: 48px 0; }
  .empty .big { font-size: 40px; }
  .search { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
    color: var(--text); font-size: 16px; margin-bottom: 12px; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); max-width: 608px; margin: 0 auto;
    background: #1f2937; color: #fff; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; transform: translateY(150%); transition: transform .25s; z-index: 10; }
  .toast.show { transform: none; }
  .toast button { background: none; border: 0; color: #fca5a5; font-weight: 700; font-size: 15px; }
  .login { max-width: 360px; margin: 60px auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .login h2 { margin: 0 0 12px; font-size: 18px; }
  .login input { width: 100%; padding: 12px; font-size: 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .login .btn { width: 100%; margin-top: 12px; background: var(--brand); color: #fff; }
  .err { color: var(--danger); font-size: 14px; margin-top: 8px; min-height: 20px; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<header id="hdr" hidden>
  <div class="top">
    <h1>📦 蝦皮取件清單</h1>
    <div style="display:flex;gap:8px">
      <button class="refresh" id="scanBtn" style="background:#fff;color:var(--brand)">📷 掃描對貨</button>
      <button class="refresh" id="refresh">重新整理</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="pending">未取 <b id="cntP">0</b></button>
    <button class="tab" data-tab="late">過期 <b id="cntL" class="red">0</b></button>
    <button class="tab" data-tab="done">已取</button>
  </div>
</header>

<main id="main"><div class="loading">載入中…</div></main>

<div class="toast" id="toast"><span id="toastText"></span><button id="toastUndo">復原</button></div>

<script>
/* ====== 掃描對貨：用手機鏡頭掃包裹標籤的條碼／QR，自動對到清單 ====== */
const PkScan = (function () {
  const LIB = 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
  let libP = null, qr = null, opts = null, last = { t: '', at: 0 }, matchedIds = [];
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function loadLib() {
    if (window.Html5Qrcode) return Promise.resolve();
    if (!libP) libP = new Promise((ok, no) => { const s = document.createElement('script'); s.src = LIB; s.onload = ok; s.onerror = () => no(new Error('掃描元件載入失敗，請檢查網路')); document.head.appendChild(s); });
    return libP;
  }

  function css() {
    if (document.getElementById('pkscan-css')) return;
    const st = document.createElement('style'); st.id = 'pkscan-css';
    st.textContent = `
      #pkscan{position:fixed;inset:0;z-index:50;background:#0b0d12;color:#fff;display:flex;flex-direction:column;font-family:inherit}
      #pkscan .bar{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
      #pkscan .bar b{font-size:17px}
      #pkscan .x{background:#ffffff1f;border:0;color:#fff;border-radius:999px;padding:8px 16px;font-size:15px;font-weight:700}
      #pkscan #pkReader{width:100%;max-width:520px;margin:0 auto;background:#000;min-height:220px}
      #pkscan #pkReader video{object-fit:cover}
      #pkscan .tip{text-align:center;color:#aab;font-size:13px;padding:8px 14px}
      #pkscan .manual{display:flex;gap:8px;padding:0 14px 8px;max-width:520px;margin:0 auto;width:100%}
      #pkscan .manual input{flex:1;padding:11px 12px;border-radius:10px;border:1px solid #333;background:#161a22;color:#fff;font-size:16px;width:auto}
      #pkscan .manual button{border:0;border-radius:10px;padding:0 16px;background:#e36d3a;color:#fff;font-weight:700;font-size:15px}
      #pkscan .sum{padding:6px 14px;font-size:14px;color:#cfd3dc;max-width:520px;margin:0 auto;width:100%}
      #pkscan .log{flex:1;overflow:auto;padding:4px 14px calc(14px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;width:100%}
      #pkscan .it{border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px;line-height:1.5;display:flex;justify-content:space-between;gap:10px;align-items:center}
      #pkscan .it.ok{background:#12351f;border:1px solid #1f6b3a}
      #pkscan .it.dup{background:#1d2230;border:1px solid #333a4d}
      #pkscan .it.no{background:#3a2a10;border:1px solid #7a5418}
      #pkscan .it small{display:block;color:#aab;font-size:12px}
      #pkscan .it button{border:0;border-radius:8px;padding:6px 10px;background:#ffffff1f;color:#fff;font-size:13px;flex:none}
      #pkscan .left{background:#161a22;border-radius:12px;padding:10px 12px;margin-top:6px;font-size:13px;color:#cfd3dc;line-height:1.6}`;
    document.head.appendChild(st);
  }

  const norm = (s) => String(s || '').toUpperCase().replace(/[^0-9A-Z]/g, '');

  function find(text) {
    const s = norm(text);
    if (!s) return null;
    const all = opts.getItems();
    // 1) 掃到的字串裡含寄件編號或訂單編號
    let hit = all.find((it) => (it.track && s.includes(norm(it.track))) || (it.order && s.includes(norm(it.order))));
    if (hit) return hit;
    // 2) 手動輸入後幾碼（至少 4 碼）
    if (s.length >= 4 && s.length < 10) {
      const c = all.filter((it) => (it.track && norm(it.track).endsWith(s)) || (it.order && norm(it.order).endsWith(s)));
      if (c.length === 1) return c[0];
      if (c.length > 1) return { multi: c };
    }
    return null;
  }

  function summary() {
    const left = opts.getItems().filter((it) => it.status !== '已取件' && matchedIds.indexOf(it.id) === -1);
    document.getElementById('pkSum').textContent = `這次已對到 ${matchedIds.length} 件・清單上還有 ${left.length} 件沒掃到`;
    document.getElementById('pkLeft').innerHTML = left.length
      ? '<b>還沒掃到的（可能還在門市）：</b><br>' + left.map((it) => `#${esc(it.id)} ${esc(it.shop)}${it.track ? ' ' + esc(it.track.slice(-6)) : ''}${it.status === '逾期未取' ? '（過期）' : ''}`).join('<br>')
      : '🎉 清單上的全部都對到了';
  }

  function addLog(cls, html, undoId) {
    const log = document.getElementById('pkLog');
    const d = document.createElement('div'); d.className = 'it ' + cls;
    d.innerHTML = '<div>' + html + '</div>' + (undoId ? '<button>復原</button>' : '');
    if (undoId) d.querySelector('button').onclick = async () => {
      d.querySelector('button').disabled = true;
      try { await opts.setStatus(undoId, 'undo'); matchedIds = matchedIds.filter((x) => x !== undoId); d.remove(); summary(); }
      catch (e) { alert('復原失敗：' + e.message); d.querySelector('button').disabled = false; }
    };
    log.insertBefore(d, log.firstChild);
    if (navigator.vibrate) navigator.vibrate(cls === 'ok' ? 60 : [40, 60, 40]);
  }

  async function handle(text) {
    const now = Date.now();
    if (text === last.t && now - last.at < 4000) return;   // 同一張標籤連續掃到只算一次
    last = { t: text, at: now };
    const it = find(text);
    if (it && it.multi) { addLog('no', '後幾碼對到好幾件，請多輸入幾碼：<small>' + it.multi.map((x) => '#' + esc(x.id) + ' ' + esc(x.shop)).join('、') + '</small>'); return; }
    if (!it) { addLog('no', '⚠️ 清單沒有這件<small>' + esc(text.slice(0, 40)) + '<br>可能是買家退貨還沒同步、或別人寄給你的包裹</small>'); return; }
    if (it.status === '已取件' || matchedIds.indexOf(it.id) !== -1) { addLog('dup', '已經標過了：#' + esc(it.id) + ' ' + esc(it.shop)); return; }
    try {
      await opts.setStatus(it.id, 'done');
      matchedIds.push(it.id);
      addLog('ok', '✓ #' + esc(it.id) + ' ' + esc(it.shop) + '<small>' + esc(it.track || it.order || '') + '・已標記已拿</small>', it.id);
      summary();
    } catch (e) { addLog('no', '標記失敗：' + esc(e.message)); }
  }

  async function open(o) {
    opts = o; matchedIds = []; last = { t: '', at: 0 };
    css();
    const box = document.createElement('div'); box.id = 'pkscan';
    box.innerHTML = `
      <div class="bar"><b>📷 掃描對貨</b><button class="x" id="pkClose">完成</button></div>
      <div id="pkReader"></div>
      <div class="tip">對準包裹標籤上的<b>條碼</b>（寄件編號那條）或 QR 碼，對到會自動標記已拿</div>
      <div class="manual"><input id="pkMan" placeholder="掃不到？輸入寄件編號後 4～6 碼" autocomplete="off"><button id="pkManGo">對</button></div>
      <div class="sum" id="pkSum"></div>
      <div class="log"><div id="pkLog"></div><div class="left" id="pkLeft"></div></div>`;
    document.body.appendChild(box);
    document.body.style.overflow = 'hidden';
    summary();
    const man = () => { const v = document.getElementById('pkMan').value.trim(); if (v) { last = { t: '', at: 0 }; handle(v); document.getElementById('pkMan').value = ''; } };
    document.getElementById('pkManGo').onclick = man;
    document.getElementById('pkMan').onkeydown = (e) => { if (e.key === 'Enter') man(); };
    document.getElementById('pkClose').onclick = close;
    try {
      await loadLib();
      const F = window.Html5QrcodeSupportedFormats;
      qr = new window.Html5Qrcode('pkReader', { formatsToSupport: [F.CODE_128, F.QR_CODE, F.CODE_39, F.EAN_13], verbose: false,
        experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
      const w = Math.min(window.innerWidth - 40, 480);
      await qr.start({ facingMode: 'environment' }, { fps: 12, qrbox: { width: w, height: Math.round(w * 0.45) } }, (t) => handle(t), () => {});
    } catch (e) {
      document.getElementById('pkReader').innerHTML = '<div style="padding:30px 16px;text-align:center;color:#f5b971;font-size:14px">相機開不起來：' + esc(e.message || e) +
        '<br><br>請允許相機權限；LINE 裡打不開的話，點右上角「⋯」→ 用預設瀏覽器開啟。<br>也可以直接在下面輸入寄件編號後幾碼。</div>';
    }
  }

  async function close() {
    try { if (qr) { await qr.stop(); qr.clear(); } } catch (e) {}
    qr = null;
    const box = document.getElementById('pkscan'); if (box) box.remove();
    document.body.style.overflow = '';
    if (opts && opts.onClose) opts.onClose(matchedIds.length);
  }

  return { open };
})();

</script>
<script>
(function () {
  'use strict';
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzd7nyjqzMbGH1WUxBBNqbCrVibCmZEPAMzaGPtkuF0n8TR_Zsovu-7aYM02SGTmPV4UQ/exec?src=shopee_pickup';
  const KEY_STORE = 'shopee_pickup_key';

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let key = '';
  try { key = localStorage.getItem(KEY_STORE) || ''; } catch (e) {}
  let data = { pending: [], done: [] };
  let tab = 'pending';
  let query = '';
  let toastTimer = null;

  async function api(body) {
    const r = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ key: key }, body)) });
    const t = (await r.text()).trim();
    if (t === 'DENY') throw new Error('DENY');
    try { return JSON.parse(t); } catch (e) { throw new Error(t.slice(0, 120) || '連線失敗'); }
  }

  function showLogin(msg) {
    $('hdr').hidden = true;
    $('main').innerHTML =
      '<div class="login"><h2>🔒 輸入密碼</h2>' +
      '<input id="pw" type="password" placeholder="跟篡改猴腳本 SECRET 一樣" autocomplete="current-password">' +
      '<button class="btn" id="go">進入</button><div class="err" id="err">' + esc(msg || '') + '</div></div>';
    const go = () => { key = $('pw').value.trim(); if (!key) return; load(true); };
    $('go').onclick = go;
    $('pw').onkeydown = (e) => { if (e.key === 'Enter') go(); };
    $('pw').focus();
  }

  async function load(fromLogin) {
    if (!key) return showLogin();
    if (!fromLogin) $('main').innerHTML = '<div class="loading">載入中…</div>';
    try {
      const res = await api({ action: 'list' });
      if (!res.ok) throw new Error(res.error || '讀取失敗');
      try { localStorage.setItem(KEY_STORE, key); } catch (e) {}
      data = res;
      $('hdr').hidden = false;
      render();
    } catch (e) {
      if (e.message === 'DENY') { try { localStorage.removeItem(KEY_STORE); } catch (x) {} key = ''; return showLogin('密碼不對'); }
      if (fromLogin) { const er = $('err'); if (er) er.textContent = e.message; return; }
      $('main').innerHTML = '<div class="empty"><div class="big">⚠️</div>' + esc(e.message) + '<br><br><button class="btn undo" onclick="location.reload()">再試一次</button></div>';
    }
  }

  function badge(it) {
    if (it.status === '已取件') return '<span class="badge">已拿</span>';
    if (it.status === '逾期未取') return '<span class="badge late">' + (it.deadline ? '找客服期限 ' + it.deadline.slice(5).replace('-', '/') : '請找蝦皮客服') + '</span>';
    if (it.left == null) return '<span class="badge">無期限</span>';
    if (it.left < 0) return '<span class="badge late">過期 ' + (-it.left) + ' 天</span>';
    if (it.left === 0) return '<span class="badge today">今天到期</span>';
    if (it.left <= 2) return '<span class="badge soon">剩 ' + it.left + ' 天</span>';
    return '<span class="badge">剩 ' + it.left + ' 天</span>';
  }

  function card(it) {
    const isDone = it.status === '已取件';
    return '<div class="card" id="c' + esc(it.id) + '">' +
      '<div class="row1"><div class="shop">' + esc(it.shop || '未填賣場') + '<span class="id">#' + esc(it.id) + '</span></div>' + badge(it) + '</div>' +
      '<div class="code"><span class="num">' + esc(it.status === '逾期未取' ? '找客服' : (it.code || '帶證件')) + '</span>' +
        (it.code && it.status !== '逾期未取' ? '<button class="copy" data-copy="' + esc(it.code) + '">複製</button>' : '') + '</div>' +
      '<div class="meta">' +
        '<div>📍 ' + esc(it.store || '未填門市') + '</div>' +
        (it.deadline ? '<div>⏰ ' + (it.status === '逾期未取' ? '找客服期限 ' : '取件期限 ') + esc(it.deadline) + '</div>' : '') +
        (it.track ? '<div>🏷️ 寄件 <b style="color:var(--text)">' + esc(it.track) + '</b></div>' : '') +
        (it.order ? '<div>🧾 訂單 ' + esc(it.order) + '</div>' : '') +
        (it.phone ? '<div>📞 ' + esc(it.phone) + '</div>' : '') +
      '</div>' +
      '<div class="act">' + (isDone
        ? '<button class="btn undo" data-act="undo" data-id="' + esc(it.id) + '">改回未處理</button>'
        : '<button class="btn done" data-act="done" data-id="' + esc(it.id) + '">' + (it.status === '逾期未取' ? '✓ 客服已處理' : '✓ 已拿') + '</button>') +
      '</div></div>';
  }

  function render() {
    const isLate = (it) => it.status === '逾期未取';
    const pend = data.pending.filter((it) => !isLate(it));
    const late = data.pending.filter(isLate);
    $('cntP').textContent = pend.length;
    $('cntL').textContent = late.length;
    $('cntL').style.display = late.length ? '' : 'none';
    document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
    const list = (tab === 'pending' ? pend : tab === 'late' ? late : data.done).filter((it) => {
      if (!query) return true;
      return [it.shop, it.code, it.store, it.order, it.track, it.id].join(' ').toLowerCase().includes(query.toLowerCase());
    });
    let html = '<input class="search" id="q" placeholder="搜尋賣場 / 驗證碼 / 訂單 / 寄件編號" value="' + esc(query) + '">';
    if (!list.length) {
      const msg = { pending: ['🎉', '全部都拿了'], late: ['👍', '沒有逾期的'], done: ['📭', '還沒有已取的紀錄'] }[tab];
      html += '<div class="empty"><div class="big">' + msg[0] + '</div>' + (query ? '找不到符合的' : msg[1]) + '</div>';
    } else {
      html += list.map(card).join('');
    }
    $('main').innerHTML = html;
    const q = $('q');
    q.oninput = () => { query = q.value; const pos = q.selectionStart; render(); const n = $('q'); n.focus(); n.setSelectionRange(pos, pos); };
  }

  function toast(text, undoFn) {
    $('toastText').textContent = text;
    $('toastUndo').hidden = !undoFn;
    $('toastUndo').onclick = () => { hideToast(); undoFn && undoFn(); };
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 5000);
  }
  function hideToast() { $('toast').classList.remove('show'); }

  async function setStatus(id, action) {
    const from = action === 'done' ? data.pending : data.done;
    const to = action === 'done' ? data.done : data.pending;
    const idx = from.findIndex((x) => x.id === id);
    if (idx < 0) return;
    const it = from[idx];
    const el = $('c' + id);
    if (el) { el.querySelectorAll('button').forEach((b) => (b.disabled = true)); el.classList.add('gone'); }
    try {
      const res = await api({ action: action, id: id });
      if (!res.ok) throw new Error(res.error || '更新失敗');
      from.splice(idx, 1);
      it.status = res.status;
      if (action === 'done') to.unshift(it);
      else { to.push(it); to.sort((a, b) => ((a.deadline || '9') < (b.deadline || '9') ? -1 : 1)); }
      setTimeout(render, 220);
      if (action === 'done') toast('#' + id + ' 已處理', () => setStatus(id, 'undo'));
      else toast('#' + id + ' 已改回未處理');
    } catch (e) {
      if (el) { el.classList.remove('gone'); el.querySelectorAll('button').forEach((b) => (b.disabled = false)); }
      toast('失敗：' + e.message);
    }
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.tab) { tab = t.dataset.tab; query = ''; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.act) { setStatus(t.dataset.id, t.dataset.act); return; }
    if (t.dataset.copy) {
      const v = t.dataset.copy;
      (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(
        () => toast('已複製驗證碼 ' + v),
        () => toast('請長按驗證碼複製')
      );
    }
  });
  $('refresh').onclick = () => load();

  // 掃描對貨：掃到就直接標記已拿，關掉後重畫清單
  async function mark(id, action) {
    const res = await api({ action: action, id: id });
    if (!res.ok) throw new Error(res.error || '更新失敗');
    const all = data.pending.concat(data.done);
    const it = all.find((x) => x.id === id);
    data.pending = data.pending.filter((x) => x.id !== id);
    data.done = data.done.filter((x) => x.id !== id);
    if (it) { it.status = res.status; (res.status === '已取件' ? data.done : data.pending).unshift(it); }
  }
  $('scanBtn').onclick = () => PkScan.open({
    getItems: () => data.pending.concat(data.done),
    setStatus: mark,
    onClose: (n) => { data.pending.sort((a, b) => ((a.deadline || '9') < (b.deadline || '9') ? -1 : 1)); render(); if (n) toast('這次對到 ' + n + ' 件'); }
  });

  load();
})();
</script>
</body>
</html>
