<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>韋德機車精品｜集點卡</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#f2f3f6; --card:#fff; --ink:#151924; --ink2:#3b4252; --sub:#7a8191; --line:#e7e9ee; --line2:#d9dce3;
    --brand:#e36d3a; --brand-2:#c95726; --brand-soft:#fdf0e9;
    --blue:#3b5bdb; --blue-soft:#ebefff; --violet:#7048e8; --violet-soft:#f1edff;
    --ok:#1f9d55; --ok-soft:#e6f6ec; --red:#d9363e; --red-soft:#fdecec;
    --dark:#161a24; --dark-2:#232836;
    --r:20px; --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro TC","PingFang TC","Noto Sans TC",sans-serif;
    background:var(--bg);color:var(--ink);padding:0 0 calc(28px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;color:inherit}
  svg{display:block}
  .topbar{position:sticky;top:0;z-index:6;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.6) blur(12px);
    -webkit-backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--line)}
  .topbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 18px}
  .crumb{font-size:15px;color:var(--sub)}
  .crumb b{color:var(--ink2);font-weight:700}
  .crumb i{font-style:normal;margin:0 10px;color:var(--line2)}
  .who{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--sub)}
  .avatar{width:34px;height:34px;border-radius:10px;background:var(--brand-soft);color:var(--brand-2);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 0}
  .head{margin-bottom:16px}
  h1{font-size:28px;font-weight:800;letter-spacing:.5px;line-height:1.2}
  .subtitle{font-size:14px;color:var(--sub);margin-top:6px;line-height:1.5}
  input,select{width:100%;padding:12px 14px;border:1px solid var(--line2);border-radius:14px;font-size:16px;background:#fff;
    font-family:inherit;color:var(--ink);outline:none;transition:border-color .15s, box-shadow .15s}
  input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(227,109,58,.15)}
  input::placeholder{color:#a3a9b6}
  label{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px;font-weight:500}
  .card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:14px;border:1px solid var(--line);box-shadow:var(--shadow)}
  .card h2{font-size:17px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .hero{position:relative;overflow:hidden;background:var(--dark);color:#fff;border:0;padding:22px}
  .hero::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 52%,rgba(227,109,58,.10) 52.2%,transparent 58%),
               linear-gradient(115deg,transparent 64%,rgba(227,109,58,.08) 64.2%,transparent 72%),
               radial-gradient(120% 140% at 100% 100%,rgba(227,109,58,.22),transparent 55%)}
  .hero > *{position:relative;z-index:1}
  .hero .ttl{font-size:24px;font-weight:800;letter-spacing:.5px}
  .hero .lbl{font-size:13px;color:rgba(255,255,255,.62);margin-top:4px}
  .btn{border:0;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:700;transition:transform .08s, filter .15s;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
  .btn:active{transform:scale(.98)}
  .btn.main{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(227,109,58,.28)}
  .btn.ghost{background:var(--brand-soft);color:var(--brand-2)}
  .btn.ok{background:var(--ok);color:#fff;box-shadow:0 4px 12px rgba(31,157,85,.25)}
  .btn.gray{background:#eceef2;color:var(--ink)}
  .btn.dark{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.16)}
  .btn.block{display:flex;width:100%;margin-top:14px}
  .btn:disabled{opacity:.5}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);position:relative}
  .stat .l{font-size:14px;color:var(--ink2);font-weight:500}
  .stat .v{font-size:28px;font-weight:800;margin-top:12px;line-height:1.1}
  .stat .v small{font-size:14px;color:var(--sub);font-weight:700;margin-left:4px}
  .stat .c{font-size:12px;color:var(--sub);margin-top:6px}
  .stat .ic{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center}
  .ic.o{background:var(--brand-soft);color:var(--brand)} .ic.b{background:var(--blue-soft);color:var(--blue)}
  .ic.v{background:var(--violet-soft);color:var(--violet)} .ic.g{background:var(--ok-soft);color:var(--ok)}
  .chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
  .chip{padding:9px 15px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:15px;color:var(--ink2);white-space:nowrap}
  .chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-2);font-weight:700}
  .hint{font-size:13px;color:var(--sub);line-height:1.65}
  .err{background:var(--red-soft);color:#9b1c22;padding:13px 14px;border-radius:14px;font-size:14px;margin-bottom:12px}
  .center{text-align:center;padding:56px 0;color:var(--sub)}
  .log{display:flex;justify-content:space-between;font-size:14px;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
  .log:last-child{border-bottom:0}
  .log span:last-child{color:var(--sub);white-space:nowrap}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(8px);background:var(--dark);color:#fff;z-index:30;
    padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;
    box-shadow:0 8px 24px rgba(0,0,0,.18)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .hero small{font-size:13px;color:rgba(255,255,255,.62)}
  .hero h1{font-size:26px;margin:6px 0 2px}
  .hero .who{font-size:14px;color:rgba(255,255,255,.75)}
  .stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0 8px}
  .stamp{aspect-ratio:1;border-radius:50%;border:2px dashed rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:600;color:rgba(255,255,255,.45)}
  .stamp.on{background:var(--brand);border:2px solid var(--brand);color:#fff;font-size:20px;box-shadow:0 4px 14px rgba(227,109,58,.45)}
  .count{font-size:14px;color:rgba(255,255,255,.75);margin-top:10px}
  .count b{font-size:30px;color:#fff;font-weight:800;margin-right:2px}
  .full{background:var(--ok-soft);border:1px solid #bfe5cb}
  .full h2{color:var(--ok)}
  .qrbox{display:flex;flex-direction:column;align-items:center;gap:12px}
  #qr{padding:12px;background:#fff;border-radius:16px;border:1px solid var(--line)}
  .code{font-size:26px;font-weight:800;letter-spacing:5px}
  .hint{text-align:inherit}
  .notice{border-width:1px;animation:pop .35s ease-out}
  .notice.ok{background:var(--ok-soft);border-color:#bfe5cb}
  .notice.warn{background:#fff7e8;border-color:#f6dfb2}
  .notice .nt{font-size:22px;font-weight:800}
  .notice.ok .nt{color:var(--ok)} .notice.warn .nt{color:#b45309}
  .notice .nx{font-size:15px;color:var(--ink2);margin-top:4px}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
  details summary{font-weight:800;font-size:17px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
  details summary::-webkit-details-marker{display:none}
  details summary::after{content:"＋";color:var(--sub);font-weight:500}
  details[open] summary::after{content:"－"}
</style>
</head>
<body>
<header class="topbar"><div class="in">
  <div class="crumb">韋德機車精品<i>/</i><b>集點卡</b></div>
  <div class="who"><span id="todayLbl"></span><div class="avatar">W</div></div>
</div></header>
<div class="wrap" id="app"><div class="center">載入中…</div></div>
<div class="toast" id="toast"></div>

<script>
(()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');const el=document.getElementById('todayLbl');if(el)el.textContent=`${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}`;})();
/* ====== 設定（部署前填好）====== */
const LIFF_ID = '2010744078-Wl4rPNJ4';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzd7nyjqzMbGH1WUxBBNqbCrVibCmZEPAMzaGPtkuF0n8TR_Zsovu-7aYM02SGTmPV4UQ/exec';
/* ============================== */

let notice = null;
let idToken = '', state = null, lastPoints = null, pollCount = 0;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ms => { const d = new Date(ms); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2200); }

async function api(action, extra = {}) {
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ pt_action: action, idToken, ...extra })
  });
  const j = await res.json();
  if (!j.ok && j.error) throw new Error(j.error);
  return j;
}

function render() {
  const m = state.member, meta = state.meta;
  const stamps = Array.from({ length: meta.goal }, (_, i) =>
    `<div class="stamp ${i < m.points ? 'on' : ''}">${i < m.points ? '✓' : i + 1}</div>`).join('');
  const logs = (state.logs || []).filter(l => l.action !== '加入會員');

  $('#app').innerHTML = `
    ${notice ? `<div class="card notice ${notice.type}"><div class="nt">${esc(notice.title)}</div><div class="nx">${esc(notice.text)}</div></div>` : ''}
    <div class="card hero">
      <small>韋德機車精品 · 換機油集點卡</small>
      <h1>${m.full ? '🎉 已集滿！' : '集點卡'}</h1>
      <div class="who">${esc(m.name || m.lineName)}${m.plate ? '　' + esc(m.plate) : ''}</div>
      <div class="stamps">${stamps}</div>
      <div class="count"><b>${m.points}</b> / ${meta.goal} 點　·　換機油一次集 1 點</div>
    </div>

    ${m.full ? `
    <div class="card full">
      <h2>可兌換：${esc(meta.reward)}</h2>
      <div style="font-size:14px;line-height:1.6">下次來店換機油時，出示下方 QR 給店家，即可兌換。</div>
    </div>` : ''}

    <div class="card">
      <h2>${m.full ? '兌換時出示給店家' : '我的會員 QR'}</h2>
      <div class="qrbox">
        <div id="qr"></div>
        <div class="code">${esc(m.code)}</div>
        <div class="hint" style="text-align:center">換機油時掃店內牆上的 QR 就能集點<br>兌換或需要補點時，出示這個給店家</div>
      </div>
      <button class="btn ghost block" id="refresh">重新整理點數</button>
    </div>

    <div class="card">
      <details id="prof" ${(profOpen ?? !(m.phone || m.plate)) ? 'open' : ''}>
        <summary>我的資料（方便店家查找）</summary>
        <label>姓名</label><input id="fName" value="${esc(m.name)}" placeholder="選填">
        <label>手機</label><input id="fPhone" value="${esc(m.phone)}" inputmode="tel" placeholder="選填">
        <label>車牌</label><input id="fPlate" value="${esc(m.plate)}" placeholder="選填，例如 ABC-1234">
        <button class="btn main block" id="save">儲存</button>
      </details>
    </div>

    <div class="card">
      <h2>最近紀錄</h2>
      ${logs.length ? logs.map(l => `<div class="log"><span>${esc(l.action)}${l.delta > 0 ? ' +' + l.delta : ''}${l.action === '兌換' ? '：' + esc(l.note) : ''}</span><span>${fmt(l.time)}</span></div>`).join('')
        : '<div class="hint">還沒有紀錄，換機油時記得出示集點卡</div>'}
    </div>
  `;

  new QRCode($('#qr'), { text: 'WADEPT:' + m.code, width: 190, height: 190, correctLevel: QRCode.CorrectLevel.M });

  $('#refresh').onclick = () => load(true);
  $('#prof').ontoggle = () => { profOpen = $('#prof').open; };
  $('#save').onclick = async () => {
    const btn = $('#save'); btn.disabled = true; btn.textContent = '儲存中…';
    try {
      const j = await api('saveProfile', { name: $('#fName').value, phone: $('#fPhone').value, plate: $('#fPlate').value });
      state.member = j.member; render(); toast('已儲存');
    } catch (e) { toast(e.message); btn.disabled = false; btn.textContent = '儲存'; }
  };
}

let profOpen = null; // 記住「我的資料」有沒有展開
function editing() {
  const a = document.activeElement;
  return a && a.tagName === 'INPUT' && $('#app').contains(a);
}

async function load(manual, auto) {
  try {
    const j = await api('me');
    // 自動更新：點數沒變、或客人正在打字，就不要重畫畫面（不然鍵盤會跳掉）
    if (auto && state) {
      const same = j.member.points === state.member.points && j.member.redeemed === state.member.redeemed;
      if (same || editing()) return; // 打字中先不更新，打完下一輪再更新
    }
    if (lastPoints !== null && j.member.points > lastPoints) toast('已加 1 點！');
    if (lastPoints !== null && j.member.points < lastPoints && j.member.redeemed > state.member.redeemed) toast('兌換完成！');
    lastPoints = j.member.points;
    state = j; render();
    if (manual) toast('已更新');
  } catch (e) {
    $('#app').innerHTML = `<div class="err">${esc(e.message)}</div><button class="btn main block" onclick="location.reload()">重新載入</button>`;
  }
}

// 開啟後 2 分鐘內自動更新，讓客人看到店家剛加的點
function startPoll() {
  pollCount = 0;
  clearInterval(window._poll);
  window._poll = setInterval(() => {
    if (++pollCount > 20 || document.hidden) return clearInterval(window._poll);
    load(false, true);
  }, 6000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && state) { load(false, true); startPoll(); } });

(async () => {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) return liff.login({ redirectUri: location.href });
    idToken = liff.getIDToken();
    const q = new URLSearchParams(location.search);
    if (q.get('add') === '1') {
      // 牆上 QR：自助集點（網址參數用完就清掉，重新整理不會重複集）
      history.replaceState(null, '', location.pathname);
      const res = await fetch(GAS_URL, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ pt_action: 'selfAdd', idToken, k: q.get('k') || '' })
      }).then(r => r.json());
      notice = res.ok
        ? { type: 'ok', title: '集點成功 +1', text: `目前 ${res.member.points} / ${res.meta.goal} 點${res.member.full ? '，已集滿可以兌換了！' : '，謝謝光臨！'}` }
        : { type: res.reason === 'full' ? 'ok' : 'warn', title: res.reason === 'full' ? '已集滿 🎉' : '這次沒有加點', text: res.error || '請稍後再試' };
    }
    await load(false);
    startPoll();
  } catch (e) {
    $('#app').innerHTML = `<div class="err">開啟失敗：${esc(e.message)}<br>請從 LINE 的「集點卡」按鈕開啟。</div>`;
  }
})();
</script>
</body>
</html>
