<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>集點後台｜韋德機車精品</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --bg:#f2f3f6; --card:#fff; --ink:#151924; --ink2:#3b4252; --sub:#7a8191; --line:#e7e9ee; --line2:#d9dce3;
    --brand:#e36d3a; --brand-2:#c95726; --brand-soft:#fdf0e9;
    --blue:#3b5bdb; --blue-soft:#ebefff; --violet:#7048e8; --violet-soft:#f1edff;
    --ok:#1f9d55; --ok-soft:#e6f6ec; --red:#d9363e; --red-soft:#fdecec;
    --dark:#161a24; --dark-2:#232836;
    --r:20px; --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro TC","PingFang TC","Noto Sans TC",sans-serif;
    background:var(--bg);color:var(--ink);padding:0 0 calc(28px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;color:inherit}
  svg{display:block}
  .topbar{position:sticky;top:0;z-index:6;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.6) blur(12px);
    -webkit-backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--line)}
  .topbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 18px}
  .crumb{font-size:15px;color:var(--sub)}
  .crumb b{color:var(--ink2);font-weight:700}
  .crumb i{font-style:normal;margin:0 10px;color:var(--line2)}
  .who{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--sub)}
  .avatar{width:34px;height:34px;border-radius:10px;background:var(--brand-soft);color:var(--brand-2);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 0}
  .head{margin-bottom:16px}
  h1{font-size:28px;font-weight:800;letter-spacing:.5px;line-height:1.2}
  .subtitle{font-size:14px;color:var(--sub);margin-top:6px;line-height:1.5}
  input,select{width:100%;padding:12px 14px;border:1px solid var(--line2);border-radius:14px;font-size:16px;background:#fff;
    font-family:inherit;color:var(--ink);outline:none;transition:border-color .15s, box-shadow .15s}
  input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(227,109,58,.15)}
  input::placeholder{color:#a3a9b6}
  label{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px;font-weight:500}
  .card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:14px;border:1px solid var(--line);box-shadow:var(--shadow)}
  .card h2{font-size:17px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .hero{position:relative;overflow:hidden;background:var(--dark);color:#fff;border:0;padding:22px}
  .hero::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 52%,rgba(227,109,58,.10) 52.2%,transparent 58%),
               linear-gradient(115deg,transparent 64%,rgba(227,109,58,.08) 64.2%,transparent 72%),
               radial-gradient(120% 140% at 100% 100%,rgba(227,109,58,.22),transparent 55%)}
  .hero > *{position:relative;z-index:1}
  .hero .ttl{font-size:24px;font-weight:800;letter-spacing:.5px}
  .hero .lbl{font-size:13px;color:rgba(255,255,255,.62);margin-top:4px}
  .btn{border:0;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:700;transition:transform .08s, filter .15s;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
  .btn:active{transform:scale(.98)}
  .btn.main{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(227,109,58,.28)}
  .btn.ghost{background:var(--brand-soft);color:var(--brand-2)}
  .btn.ok{background:var(--ok);color:#fff;box-shadow:0 4px 12px rgba(31,157,85,.25)}
  .btn.gray{background:#eceef2;color:var(--ink)}
  .btn.dark{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.16)}
  .btn.block{display:flex;width:100%;margin-top:14px}
  .btn:disabled{opacity:.5}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);position:relative}
  .stat .l{font-size:14px;color:var(--ink2);font-weight:500}
  .stat .v{font-size:28px;font-weight:800;margin-top:12px;line-height:1.1}
  .stat .v small{font-size:14px;color:var(--sub);font-weight:700;margin-left:4px}
  .stat .c{font-size:12px;color:var(--sub);margin-top:6px}
  .stat .ic{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center}
  .ic.o{background:var(--brand-soft);color:var(--brand)} .ic.b{background:var(--blue-soft);color:var(--blue)}
  .ic.v{background:var(--violet-soft);color:var(--violet)} .ic.g{background:var(--ok-soft);color:var(--ok)}
  .chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
  .chip{padding:9px 15px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:15px;color:var(--ink2);white-space:nowrap}
  .chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-2);font-weight:700}
  .hint{font-size:13px;color:var(--sub);line-height:1.65}
  .err{background:var(--red-soft);color:#9b1c22;padding:13px 14px;border-radius:14px;font-size:14px;margin-bottom:12px}
  .center{text-align:center;padding:56px 0;color:var(--sub)}
  .log{display:flex;justify-content:space-between;font-size:14px;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
  .log:last-child{border-bottom:0}
  .log span:last-child{color:var(--sub);white-space:nowrap}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(8px);background:var(--dark);color:#fff;z-index:30;
    padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;
    box-shadow:0 8px 24px rgba(0,0,0,.18)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .scanbtn{width:100%;margin-top:18px;padding:17px;font-size:18px}
  .codebar{display:flex;gap:8px;margin-top:10px}
  .codebar input{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16);color:#fff}
  .codebar input::placeholder{color:rgba(255,255,255,.45)}
  .item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .item:last-child{border-bottom:0}
  .ava{width:42px;height:42px;border-radius:13px;background:#f1f2f5;color:var(--ink2);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
  .ava.full{background:var(--ok-soft);color:var(--ok)}
  .item .mid{flex:1;min-width:0}
  .item .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .meta{font-size:13px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pts{font-size:20px;font-weight:800;white-space:nowrap}
  .pts small{font-size:13px;color:var(--sub);font-weight:600}
  .badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-weight:700;margin-left:6px;vertical-align:1px}
  .sheet{position:fixed;inset:0;background:rgba(15,18,26,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .sheet.show{display:flex}
  .panel{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;
    padding:10px 16px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .grip{width:40px;height:5px;border-radius:5px;background:var(--line2);margin:0 auto 12px}
  .panel .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px}
  .panel h2{font-size:22px;font-weight:800}
  .close{background:#e4e6eb;border:0;border-radius:50%;width:36px;height:36px;font-size:16px;flex:none}
  .stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0 12px}
  .stamp{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line2);display:flex;align-items:center;justify-content:center;color:#a3a9b6;font-size:13px;font-weight:600}
  .stamp.on{background:var(--brand);border:2px solid var(--brand);color:#fff;font-size:18px;box-shadow:0 3px 8px rgba(227,109,58,.3)}
  .big{font-size:15px;color:var(--sub)}
  .big b{font-size:34px;color:var(--ink);font-weight:800;margin-right:4px}
  .fullbox{background:var(--ok-soft);color:#14532d;border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:700}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  @media (min-width: 900px){ .topbar .in,.wrap{max-width:760px} .stats{grid-template-columns:repeat(4,1fr)} }
</style>
</head>
<body>
<header class="topbar"><div class="in">
  <div class="crumb">WADE Moto<i>/</i><b>集點後台</b></div>
  <div class="who"><span id="todayLbl"></span><div class="avatar">W</div></div>
</div></header>
<div class="wrap" id="app"><div class="center">載入中…</div></div>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>

<script>
(()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');const el=document.getElementById('todayLbl');if(el)el.textContent=`${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}`;})();
/* ====== 設定（部署前填好）====== */
const LIFF_ID = '2010744078-0uIoie4v';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzd7nyjqzMbGH1WUxBBNqbCrVibCmZEPAMzaGPtkuF0n8TR_Zsovu-7aYM02SGTmPV4UQ/exec';
/* ============================== */

let recent = [];
let idToken = '', list = [], meta = { goal: 10, reward: '' }, stats = {}, filter = 'all', keyword = '', current = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ms => { if (!ms) return '—'; const d = new Date(ms); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2400); }

async function api(action, extra = {}) {
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ pt_action: action, idToken, ...extra })
  });
  return res.json();
}

/* ---------- 主畫面 ---------- */
function renderMain() {
  const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
  const kw = keyword.trim().toUpperCase();
  const shown = list.filter(m => {
    if (filter === 'full' && !m.full) return false;
    if (filter === 'month' && !(m.lastAdd >= monthStart.getTime())) return false;
    if (!kw) return true;
    return [m.code, m.name, m.lineName, m.phone, m.plate].some(v => String(v || '').toUpperCase().includes(kw));
  });

  const monthCount = list.filter(m => m.lastAdd >= monthStart.getTime()).length;
  const redeemedAll = list.reduce((a, m) => a + (m.redeemed || 0), 0);
  $('#app').innerHTML = `
    <div class="head"><h1>集點後台</h1><div class="subtitle">換機油一次 1 點，滿 ${meta.goal} 點可兌換「${esc(meta.reward)}」。</div></div>

    <div class="card hero">
      <div class="ttl">掃描集點卡</div>
      <div class="lbl">客人說要兌換或補點時：輸入車牌查，或掃他集點卡上的 QR</div>
      <button class="btn main scanbtn" id="scanBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M4 12h16"/></svg>掃描客人集點卡</button>
      <div class="codebar">
        <input id="codeIn" placeholder="輸入車牌，例如 NRR-9331" autocapitalize="characters">
        <button class="btn dark" id="codeBtn">查詢</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span class="l">會員</span><div class="ic o"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></svg></div><div class="v">${stats.total ?? 0}<small>位</small></div><div class="c">加入 LINE 集點卡</div></div>
      <div class="stat"><span class="l">可兌換</span><div class="ic g"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="5" rx="1"/><path d="M5 13v7h14v-7M12 8v12"/><path d="M12 8S10.5 3.5 8 4.5 9 8 12 8Zm0 0s1.5-4.5 4-3.5S15 8 12 8Z"/></svg></div><div class="v">${stats.full ?? 0}<small>位</small></div><div class="c">已集滿，等下次來店</div></div>
      <div class="stat"><span class="l">本月有來</span><div class="ic b"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></div><div class="v">${monthCount}<small>位</small></div><div class="c">本月有加點的客人</div></div>
      <div class="stat"><span class="l">累計兌換</span><div class="ic v"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11Z"/></svg></div><div class="v">${redeemedAll}<small>次</small></div><div class="c">免費換機油次數</div></div>
    </div>

    <div class="card">
      <h2>最近集點 <span class="hint">誰、什麼時候</span></h2>
      ${recent.length ? recent.slice(0, 8).map(r => {
        const mb = list.find(x => x.code === r.code) || {};
        const who = mb.name || mb.lineName || r.name || r.code;
        return `<div class="item" data-code="${esc(r.code)}">
          <div class="ava ${r.action === '兌換' ? 'full' : ''}">${esc(who.slice(0, 1))}</div>
          <div class="mid"><div class="nm">${esc(who)}${(r.note || '').includes('｜') ? ' <span class="hint">' + esc(r.note.split('｜')[1]) + '</span>' : (mb.plate ? ' <span class="hint">' + esc(String(mb.plate).replace(/,/g, ' / ')) + '</span>' : '')}</div>
            <div class="meta">${esc(r.action)}${r.action === '自助集點' ? '（牆上 QR）' : ''} · ${fmt(r.time)}</div></div>
          <div class="pts">${r.action === '兌換' ? '<small>兌換</small>' : '+1'}<small> → ${r.after}</small></div></div>`;
      }).join('') : '<div class="hint">還沒有人集點</div>'}
    </div>

    <div class="card">
      <h2>會員列表 <span class="hint">${shown.length} 位</span></h2>
      <div class="chips">
        <button class="chip ${filter==='all'?'on':''}" data-f="all">全部</button>
        <button class="chip ${filter==='full'?'on':''}" data-f="full">可兌換</button>
        <button class="chip ${filter==='month'?'on':''}" data-f="month">本月有加點</button>
      </div>
      <input id="kw" placeholder="搜尋姓名、電話、車牌、編號" value="${esc(keyword)}" style="margin-bottom:6px">
      <div id="listBox">
        ${shown.length ? shown.map(m => `
          <div class="item" data-code="${esc(m.code)}">
            <div class="ava ${m.full ? 'full' : ''}">${esc((m.name || m.lineName || '?').slice(0, 1))}</div>
            <div class="mid">
              <div class="nm">${esc(m.name || m.lineName || '未命名')}${m.full ? '<span class="badge">可兌換</span>' : ''}</div>
              <div class="meta">${esc(m.code)}${m.plate ? ' · ' + esc(String(m.plate).replace(/,/g, ' / ')) : ''}${m.phone ? ' · ' + esc(m.phone) : ''}</div>
              <div class="meta">最後加點 ${fmt(m.lastAdd)} · 已兌換 ${m.redeemed} 次</div>
            </div>
            <div class="pts">${m.points}<small>/${meta.goal}</small></div>
          </div>`).join('') : '<div class="center" style="padding:30px 0">沒有符合的會員</div>'}
      </div>
    </div>
    <button class="btn gray block" id="reloadBtn" style="margin-bottom:10px">重新整理</button>
  `;

  $('#scanBtn').onclick = scan;
  const findMember = () => {
    const raw = $('#codeIn').value.trim().toUpperCase();
    if (!raw) return;
    const k = raw.replace(/[^A-Z0-9]/g, '');           // 去掉 -、空白，NRR9331 也找得到
    const norm = v => String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    const hits = list.filter(m => norm(m.code) === k || String(m.plate || '').split(',').some(p => norm(p).includes(k))
      || norm(m.phone).includes(k) || String(m.name || m.lineName || '').toUpperCase().includes(raw));
    if (hits.length === 1) return openMember(hits[0].code);
    if (!hits.length) return toast('找不到：' + raw);
    keyword = raw; filter = 'all'; renderMain();            // 多筆就列在下面
    toast(`找到 ${hits.length} 位，請點選`);
  };
  $('#codeBtn').onclick = findMember;
  $('#codeIn').onkeydown = e => { if (e.key === 'Enter') findMember(); };
  $('#reloadBtn').onclick = () => loadList(true);
  document.querySelectorAll('.chip').forEach(b => b.onclick = () => { filter = b.dataset.f; renderMain(); });
  document.querySelectorAll('.item').forEach(el => el.onclick = () => openMember(el.dataset.code));
  const kwEl = $('#kw');
  kwEl.oninput = () => { keyword = kwEl.value; const pos = kwEl.selectionStart; renderMain(); const n = $('#kw'); n.focus(); n.setSelectionRange(pos, pos); };
}

async function loadList(manual) {
  const j = await api('list');
  if (j.notAdmin) { $('#app').innerHTML = `<div class="err">這個頁面只限店家使用。</div>`; return; }
  if (!j.ok) { toast(j.error || '讀取失敗'); return; }
  if (j.firstBind) toast('已將你設為集點管理員');
  list = j.members; meta = j.meta; stats = j.stats; recent = j.recent || [];
  try { localStorage.setItem('ptAdminCache', JSON.stringify({ list, meta, stats, recent })); } catch (e) {}
  renderMain();
  if (manual) toast('已更新');
}

/* ---------- 掃描 ---------- */
async function scan() {
  if (!liff.isApiAvailable('scanCodeV2')) {
    toast('這裡無法開相機，請在 LINE App 裡開啟，或手動輸入編號');
    return;
  }
  try {
    const r = await liff.scanCodeV2();
    const v = (r && r.value) || '';
    if (!/^WADEPT:/i.test(v)) { toast('這不是韋德集點卡的 QR'); return; }
    openMember(v);
  } catch (e) { toast('掃描取消'); }
}

/* ---------- 會員面板 ---------- */
async function openMember(code) {
  $('#panel').innerHTML = '<div class="center">讀取中…</div>';
  $('#sheet').classList.add('show');
  const j = await api('lookup', { code });
  if (!j.ok) { $('#panel').innerHTML = `<div class="err">${esc(j.error)}</div><button class="btn gray block" onclick="closeSheet()">關閉</button>`; return; }
  current = j; renderMember();
}

function renderMember() {
  const m = current.member, logs = current.logs || [];
  const stamps = Array.from({ length: meta.goal }, (_, i) =>
    `<div class="stamp ${i < m.points ? 'on' : ''}">${i < m.points ? '✓' : i + 1}</div>`).join('');

  $('#panel').innerHTML = `
    <div class="grip"></div>
    <div class="top">
      <div>
        <h2>${esc(m.name || m.lineName || '未命名')}</h2>
        <div class="hint">${esc(m.code)}${m.plate ? ' · ' + esc(String(m.plate).replace(/,/g, ' / ')) : ''}${m.phone ? ' · ' + esc(m.phone) : ''}</div>
        ${m.name && m.lineName ? `<div class="hint">LINE：${esc(m.lineName)}</div>` : ''}
      </div>
      <button class="close" onclick="closeSheet()">✕</button>
    </div>

    <div class="card">
      <div class="big"><b>${m.points}</b> / ${meta.goal} 點</div>
      <div class="stamps">${stamps}</div>
      <div class="hint">最後加點 ${fmt(m.lastAdd)} · 累計 ${m.total} 點 · 已兌換 ${m.redeemed} 次</div>
      ${m.full ? `<div class="fullbox">已集滿，可兌換：${esc(meta.reward)}</div>` : ''}
      ${m.full
        ? `<button class="btn ok block" id="redeemBtn" style="font-size:18px;padding:16px">✓ 兌換${esc(meta.reward)}（點數歸零）</button>`
        : `<button class="btn main block" id="addBtn" style="font-size:19px;padding:17px">＋1 點（換機油）</button>`}
      <div class="grid2" style="margin-top:8px">
        <button class="btn gray" id="adjBtn">手動調整</button>
        <button class="btn gray" onclick="closeSheet()">完成</button>
      </div>
    </div>

    <div class="card">
      <div style="font-weight:600;margin-bottom:6px">紀錄</div>
      ${logs.length ? logs.map(l => `<div class="log"><span>${esc(l.action)} ${l.delta > 0 ? '+' + l.delta : (l.delta < 0 ? l.delta : '')}${l.note ? ' · ' + esc(l.note) : ''}</span><span>${fmt(l.time)}</span></div>`).join('') : '<div class="hint">沒有紀錄</div>'}
    </div>
  `;

  if ($('#addBtn')) $('#addBtn').onclick = () => doAdd(false);
  if ($('#redeemBtn')) $('#redeemBtn').onclick = doRedeem;
  $('#adjBtn').onclick = doAdjust;
}

async function doAdd(force) {
  const btn = $('#addBtn'); if (btn) { btn.disabled = true; btn.textContent = '處理中…'; }
  const j = await api('add', { code: current.member.code, force });
  if (j.needConfirm) {
    if (confirm(j.error)) return doAdd(true);
    renderMember(); return;
  }
  if (!j.ok) { toast(j.error); if (j.member) { current.member = j.member; } renderMember(); return; }
  current = j; renderMember();
  toast(j.member.full ? `已加 1 點，集滿 ${meta.goal} 點了！` : `已加 1 點，目前 ${j.member.points} 點`);
  loadList(false);
}

async function doRedeem() {
  if (!confirm(`確認兌換「${meta.reward}」？\n點數會歸零。`)) return;
  const j = await api('redeem', { code: current.member.code });
  if (!j.ok) { toast(j.error); return; }
  current = j; renderMember(); toast('兌換完成，點數已歸零'); loadList(false);
}

async function doAdjust() {
  const d = prompt('要增減幾點？\n例如：-1（扣 1 點）或 2（加 2 點）');
  if (d === null) return;
  const n = parseInt(d, 10);
  if (!n) { toast('請輸入數字，例如 -1 或 2'); return; }
  const note = prompt('原因（選填）', '') || '';
  const j = await api('adjust', { code: current.member.code, delta: n, note });
  if (!j.ok) { toast(j.error); return; }
  current = j; renderMember(); toast(`已調整，目前 ${j.member.points} 點`); loadList(false);
}

function closeSheet() { $('#sheet').classList.remove('show'); current = null; }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });

/* ---------- 啟動 ---------- */
(async () => {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) return liff.login({ redirectUri: location.href });
    // 電腦瀏覽器會記住舊的登入憑證，過期了就自動重新登入一次
    const dec = liff.getDecodedIDToken && liff.getDecodedIDToken();
    if (!dec || dec.exp * 1000 < Date.now() + 120000) {
      let n = 0; try { n = +sessionStorage.getItem('reLogin') || 0; sessionStorage.setItem('reLogin', n + 1); } catch (e) {}
      if (n < 2) {
        if (liff.isInClient()) return location.reload();
        liff.logout(); return liff.login({ redirectUri: location.href });
      }
    }
    try { sessionStorage.removeItem('reLogin'); } catch (e) {}
    idToken = liff.getIDToken();
    // 先秀上次的資料（馬上看得到），背景再抓最新的
    try {
      const c = JSON.parse(localStorage.getItem('ptAdminCache') || 'null');
      if (c) { ({ list, meta, stats } = c); recent = c.recent || []; renderMain(); }
    } catch (e) {}
    await loadList(false);
  } catch (e) {
    $('#app').innerHTML = `<div class="err">開啟失敗：${esc(e.message)}</div><button class="btn main block" onclick="location.reload()">重新載入</button>`;
  }
})();
</script>
</body>
