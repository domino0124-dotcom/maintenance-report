<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script data-ver="ai-admin-2">
/* 自動更新：LINE 和 GitHub 會暫存舊頁面，打開時偷偷檢查有沒有新版，有就自動換成新版 */
(function () {
  var me = document.currentScript.getAttribute('data-ver');
  if (/[?&](code|liffClientId|liffRedirectUri)=/.test(location.search)) return;   // LINE 登入中，不要打斷
  try { var last = +sessionStorage.getItem('verChk') || 0; if (Date.now() - last < 20000) return; sessionStorage.setItem('verChk', Date.now()); } catch (e) {}
  fetch(location.pathname + '?nocache=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
    var m = t.match(/data-ver="([^"]+)"/);
    if (!m || m[1] === me) return;
    var q = new URLSearchParams(location.search); q.set('v', m[1]);
    location.replace(location.pathname + '?' + q.toString() + location.hash);
  }).catch(function () {});
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 客服後台｜韋德機車精品</title>
<style>
  :root{
    --bg:#f4f6f5; --card:#fff; --ink:#15211b; --sub:#6b7a72; --line:#e3e8e5;
    --green:#16a34a; --green-d:#0f3d2a; --green-dd:#0a2a1d; --green-l:#e8f6ee;
    --amber:#d97706; --amber-l:#fef3e2; --red:#dc2626; --red-l:#fdecec; --blue:#2563eb; --blue-l:#e8effd;
    --radius:16px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer}
  .wrap{max-width:980px;margin:0 auto;padding:16px 16px 96px}
  header.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
  header.top .logo{width:36px;height:36px;border-radius:10px;background:var(--green-d);display:grid;place-items:center;color:#fff;font-weight:700}
  header.top h1{font-size:20px;margin:0;line-height:1.2}
  header.top small{display:block;color:var(--sub);font-size:12px;font-weight:400}
  header.top .sp{flex:1}
  .btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;display:inline-flex;align-items:center;gap:6px;font-weight:600}
  .btn:active{transform:scale(.98)}
  .btn.pri{background:var(--green);border-color:var(--green);color:#fff}
  .btn.dark{background:#fff;color:var(--green-d);border-color:#fff}
  .btn.ghost{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
  .btn.danger{color:var(--red)}
  .btn.sm{padding:5px 10px;font-size:13px;border-radius:10px}
  .btn[disabled]{opacity:.5;pointer-events:none}

  /* hero */
  .hero{background:radial-gradient(120% 140% at 85% 0%,#1d5c40 0%,var(--green-d) 45%,var(--green-dd) 100%);color:#fff;border-radius:22px;padding:22px;display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;box-shadow:var(--shadow)}
  .hero .l{flex:1 1 260px}
  .hero .date{font-size:13px;opacity:.85;display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
  .dot.test{background:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.25)}
  .dot.off{background:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.25)}
  .hero h2{font-size:28px;margin:6px 0 2px;letter-spacing:.5px}
  .hero p{margin:0 0 14px;opacity:.85}
  .hero .acts{display:flex;gap:8px;flex-wrap:wrap}
  .hero .stats{display:flex;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:16px;overflow:hidden}
  .hero .stat{padding:12px 18px;min-width:84px}
  .hero .stat+.stat{border-left:1px solid rgba(255,255,255,.12)}
  .hero .stat small{display:block;font-size:12px;opacity:.75}
  .hero .stat b{font-size:28px}
  .hero .stat i{font-style:normal;font-size:12px;opacity:.75;margin-left:2px}

  @media (max-width:760px){.hero .stats{width:100%}.hero .stat{flex:1;min-width:0}}
  h3.sec{font-size:15px;color:var(--sub);margin:22px 4px 10px;font-weight:600}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:760px){.grid4{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
  .tile{display:block;text-align:left;border:0;width:100%}
  .tile .hd{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
  .tile .hd .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:15px}
  .tile .hd .ar{margin-left:auto;color:var(--sub);font-size:13px}
  .tile .num{font-size:30px;font-weight:700;margin:10px 0 0}
  .tile .num i{font-style:normal;font-size:13px;color:var(--sub);font-weight:400;margin-left:3px}
  .tile .ft{font-size:12px;color:var(--sub)}
  .ic.g{background:var(--green-l)} .ic.a{background:var(--amber-l)} .ic.b{background:var(--blue-l)} .ic.r{background:var(--red-l)}
  .tile.alert{outline:2px solid var(--amber)}

  .bk-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .bk-row:first-child{border-top:0}
  .bk-time{font-weight:700;min-width:52px}
  .bk-main{flex:1;min-width:0}
  .bk-main small{color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#eef1ef;color:var(--sub);white-space:nowrap}
  .chip.g{background:var(--green-l);color:var(--green)} .chip.a{background:var(--amber-l);color:var(--amber)} .chip.r{background:var(--red-l);color:var(--red)} .chip.b{background:var(--blue-l);color:var(--blue)}
  .bar{height:8px;background:#eef1ef;border-radius:99px;overflow:hidden;margin:8px 0 4px}
  .bar span{display:block;height:100%;background:var(--green);border-radius:99px}
  .bar span.a{background:var(--amber)} .bar span.r{background:var(--red)}
  .empty{color:var(--sub);text-align:center;padding:18px 0;font-size:14px}

  .rings{display:flex;justify-content:space-around;gap:10px;padding-top:6px}
  .ring{text-align:center}
  .ring svg{width:110px;height:110px}
  .ring b{display:block;font-size:13px;margin-top:4px}
  .ring small{color:var(--sub);font-size:12px}

  /* list */
  .list .item{display:flex;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer}
  .list .item:first-child{border-top:0}
  .av{width:42px;height:42px;border-radius:50%;background:var(--green-l);color:var(--green-d);display:grid;place-items:center;font-weight:700;flex:0 0 auto}
  .list .mid{flex:1;min-width:0}
  .list .mid b{display:flex;gap:6px;align-items:center}
  .list .mid small{display:block;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list .rt{text-align:right;font-size:12px;color:var(--sub);flex:0 0 auto}

  /* chat */
  .chat-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .chat-head .nm{font-weight:700;font-size:17px;flex:1}
  .msgs{display:flex;flex-direction:column;gap:8px;max-height:58vh;overflow:auto;padding:4px 2px}
  .bub{max-width:80%;padding:9px 12px;border-radius:16px;white-space:pre-wrap;word-break:break-word;font-size:14px}
  .bub small{display:block;font-size:11px;opacity:.6;margin-top:3px}
  .bub.c{align-self:flex-start;background:#eef1ef;border-bottom-left-radius:4px}
  .bub.ai{align-self:flex-end;background:var(--green-l);border-bottom-right-radius:4px}
  .bub.boss{align-self:flex-end;background:var(--green-d);color:#fff;border-bottom-right-radius:4px}
  .who{font-size:11px;color:var(--sub);margin:0 6px}
  .who.r{align-self:flex-end}
  .pcard{background:#f6f8f7;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13px}
  .pcard.none{color:var(--sub)}
  .pcard .pl{font-size:11px;word-break:break-all;user-select:all}
  .pcard .pg{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
  .pcard .pg span{display:block;font-size:11px;color:var(--sub)}
  .pcard .pg b{font-weight:600}
  .pcard .pg a{color:inherit}
  .pcard .rp{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  .pcard .rh{font-weight:700;margin-bottom:4px}
  .pcard .ri{padding:4px 0}
  .pcard .ri small{color:var(--sub)}
  .send{display:flex;gap:8px;margin-top:12px}
  .send textarea{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px;resize:none;height:46px;background:#fff}
  .hint{font-size:12px;color:var(--sub);margin-top:6px}

  /* forms */
  .field{display:block;margin:8px 0}
  .field span{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
  .field textarea{min-height:90px;resize:vertical}
  .row-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
  .todo{border-top:1px solid var(--line);padding:14px 0}
  .todo:first-child{border-top:0;padding-top:4px}
  .todo .q{font-weight:600}
  .todo .meta{font-size:12px;color:var(--sub)}
  .kb-cat{font-size:13px;color:var(--sub);font-weight:600;margin:16px 4px 8px}
  .kb{padding:12px 14px;margin-bottom:8px;cursor:pointer}
  .kb .t{font-weight:600;display:flex;gap:6px;align-items:center}
  .kb .a{font-size:13px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .kb.off{opacity:.5}
  .search{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;margin-bottom:6px}

  /* nav */
  nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
  nav.tabs .in{display:flex;max-width:980px;width:100%}
  nav.tabs button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
  nav.tabs button .e{font-size:20px;line-height:1.2;filter:grayscale(1);opacity:.6}
  nav.tabs button.on{color:var(--green-d);font-weight:700}
  nav.tabs button.on .e{filter:none;opacity:1}
  nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;min-width:16px}

  /* login */
  .login{max-width:360px;margin:12vh auto 0;text-align:center}
  .login .card{padding:26px}
  .login input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;margin:14px 0;text-align:center;font-size:16px}
  .err{color:var(--red);font-size:13px;min-height:18px}

  .toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#15211b;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  .loading{color:var(--sub);text-align:center;padding:40px 0}
  .hide{display:none!important}
  /* 嵌在店務帳裡（?embed=1）：不顯示自己的標題列，分頁改放上面 */
  body.embed header.top{display:none}
  body.embed nav.tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding-bottom:0}
  body.embed .wrap{padding-bottom:20px!important}
  body.embed .toast{bottom:24px}
</style>
</head>
<body>

<!-- 登入 -->
<div id="loginView" class="wrap hide">
  <div class="login">
    <div class="card">
      <div style="font-size:40px">🤖</div>
      <h2 style="margin:6px 0 0">AI 客服後台</h2>
      <div style="color:var(--sub);font-size:13px">韋德機車精品</div>
      <input id="pw" type="password" placeholder="輸入後台密碼" autocomplete="current-password">
      <div class="err" id="loginErr"></div>
      <button class="btn pri" style="width:100%;justify-content:center;padding:12px" onclick="doLogin()">登入</button>
    </div>
  </div>
</div>

<!-- 主畫面 -->
<div id="appView" class="hide">
  <div class="wrap">
    <header class="top">
      <div class="logo">韋</div>
      <h1><span id="pageTitle">總覽</span><small>韋德機車精品・AI 客服後台</small></h1>
      <div class="sp"></div>
      <a class="btn sm" href="https://liff.line.me/2010744078-JVmXBk98" style="text-decoration:none">📊 店務帳</a>
      <button class="btn sm" onclick="refresh()">↻</button>
    </header>
    <main id="main"><div class="loading">載入中…</div></main>
  </div>
  <nav class="tabs"><div class="in">
    <button data-tab="home" class="on" onclick="go('home')"><span class="e">📊</span>總覽</button>
    <button data-tab="inbox" onclick="go('inbox')"><span class="e">💬</span>客服<span class="badge hide" id="bdInbox"></span></button>
    <button data-tab="todo" onclick="go('todo')"><span class="e">❓</span>待補<span class="badge hide" id="bdTodo"></span></button>
    <button data-tab="notice" onclick="go('notice')"><span class="e">📢</span>公告</button>
    <button data-tab="kb" onclick="go('kb')"><span class="e">📚</span>知識庫</button>
  </div></nav>
</div>

<div class="toast" id="toast"></div>

<div id="verTag" style="text-align:center;font-size:11px;color:#9aa0ab;opacity:.7;padding:8px 0 calc(90px + env(safe-area-inset-bottom))">ai-admin v2</div>
<script>
if (new URLSearchParams(location.search).get('embed') === '1') document.addEventListener('DOMContentLoaded', () => {
  document.body.classList.add('embed');
  const nav = document.querySelector('nav.tabs'), app = document.getElementById('appView');
  if (nav && app) app.prepend(nav);   // 分頁移到最上面
});
/* ====== 設定 ====== */
const API = 'https://script.google.com/macros/s/AKfycbzd7nyjqzMbGH1WUxBBNqbCrVibCmZEPAMzaGPtkuF0n8TR_Zsovu-7aYM02SGTmPV4UQ/exec';
const PW_KEY = 'wade_ai_admin_pw';
const DEMO = new URLSearchParams(location.search).has('demo');

/* ====== 工具 ====== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k, v);}catch(e){ return null; } }
let PW = store(PW_KEY) || '';
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

async function api(type, data){
  if (DEMO) return demoApi(type, data || {});
  const res = await fetch(API, { method:'POST', body: JSON.stringify(Object.assign({ type, pw: PW }, data || {})) });
  const j = await res.json();
  if (j.auth === false) { logout(j.error); throw new Error(j.error); }
  if (!j.ok) throw new Error(j.error || '發生錯誤');
  return j;
}

/* ====== 登入 ====== */
async function doLogin(){
  PW = $('#pw').value.trim();
  $('#loginErr').textContent = '';
  if (!PW) { $('#loginErr').textContent = '請輸入密碼'; return; }
  try { await api('ai_admin_login'); store(PW_KEY, PW); showApp(); }
  catch(e){ $('#loginErr').textContent = e.message; }
}
function logout(msg){ PW=''; store(PW_KEY, null); $('#appView').classList.add('hide'); $('#loginView').classList.remove('hide'); $('#loginErr').textContent = msg || ''; }
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

/* ====== 分頁 ====== */
let TAB = 'home', CHAT_USER = null;
const TITLES = { home:'總覽', inbox:'客服', todo:'待補問題', notice:'公告與公休', kb:'知識庫' };
function showApp(){ $('#loginView').classList.add('hide'); $('#appView').classList.remove('hide'); go(location.hash.slice(1) || 'home'); }
function go(tab){
  if (!TITLES[tab]) tab = 'home';
  TAB = tab; if (tab !== 'inbox') CHAT_USER = null;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#pageTitle').textContent = TITLES[tab];
  history.replaceState(null, '', '#' + tab + (DEMO ? '' : ''));
  refresh();
}
function refresh(){
  $('#main').innerHTML = '<div class="loading">載入中…</div>';
  ({ home: renderHome, inbox: CHAT_USER ? () => openChat(CHAT_USER) : renderInbox, todo: renderTodo, notice: renderNotice, kb: renderKb })[TAB]()
    .catch(e => { $('#main').innerHTML = '<div class="card empty">⚠️ ' + esc(e.message) + '</div>'; });
}
function setBadge(id, n){ const b = $(id); b.textContent = n; b.classList.toggle('hide', !n); }

/* ====== 總覽 ====== */
function ring(used, limit, label){
  const left = limit ? Math.max(0, limit - used) : null;
  const pct = limit ? Math.min(1, used / limit) : 0;
  const color = pct > .9 ? 'var(--red)' : pct > .7 ? 'var(--amber)' : 'var(--green)';
  const C = 2 * Math.PI * 46;
  return `<div class="ring">
    <svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="46" fill="none" stroke="${left === 0 ? '#fdecec' : '#eef1ef'}" stroke-width="10"/>
      <circle cx="55" cy="55" r="46" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${C * pct}" transform="rotate(-90 55 55)"/>
      <text x="55" y="54" text-anchor="middle" font-size="24" font-weight="700" fill="${left === 0 ? '#dc2626' : '#15211b'}">${left == null ? '∞' : left}</text>
      <text x="55" y="72" text-anchor="middle" font-size="11" fill="#6b7a72">則剩餘</text></svg>
    <b>${esc(label)}</b><small>本月已用 ${used}${limit ? ' / ' + limit : ''}</small></div>`;
}

async function renderHome(){
  const d = await api('ai_admin_overview');
  setBadge('#bdInbox', d.humans.length); setBadge('#bdTodo', d.todoCount);
  const hi = d.hour < 5 ? '夜深了' : d.hour < 11 ? '早安' : d.hour < 18 ? '午安' : '晚安';
  const st = { on:['','AI 客服運作中'], test:['test','AI 測試模式（只回測試名單）'], off:['off','AI 客服已關閉'] }[d.status];
  const bk = d.booking;
  const bkCount = bk && bk.count ? bk.count : {};
  const done = (bkCount['已完成'] || 0) + (bkCount['已報到'] || 0);
  const bkTotal = bk && bk.total || 0;
  const bkList = bk && bk.list && bk.list.length
    ? bk.list.map(b => `<div class="bk-row"><div class="bk-time">${esc(b.time || '')}</div>
        <div class="bk-main"><b>${esc(b.service || '')}</b><small>${esc([b.name, b.car].filter(Boolean).join('｜') || '未留姓名')}</small></div>
        <span class="chip ${b.status==='已預約'?'b':b.status==='已完成'||b.status==='已報到'?'g':b.status==='未到'?'r':''}">${esc(b.status)}</span></div>`).join('')
    : `<div class="empty">${bk && bk.error ? '預約資料讀取失敗' : bk ? '今天還沒有預約' : '找不到預約系統'}</div>`;

  $('#main').innerHTML = `
    <section class="hero">
      <div class="l">
        <div class="date"><span class="dot ${st[0]}"></span>${esc(d.now)}・${st[1]}</div>
        <h2>${hi}，老闆</h2>
        <p>${d.humans.length ? '有 ' + d.humans.length + ' 位客人等你親自回覆' : bkTotal ? '今天有 ' + bkTotal + ' 筆預約' : '今天還沒有預約，AI 幫你顧著 👍'}</p>
        <div class="acts">
          <button class="btn dark" onclick="go('inbox')">💬 前往客服</button>
          <button class="btn ghost" onclick="toggleAi(${d.status === 'off'})">${d.status === 'off' ? '▶️ 開啟 AI' : '⏸ 關閉 AI'}</button>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><small>今日預約</small><b>${bkTotal}</b><i>筆</i></div>
        <div class="stat"><small>已完成</small><b>${done}</b><i>筆</i></div>
        <div class="stat"><small>待人工</small><b>${d.humans.length}</b><i>位</i></div>
      </div>
    </section>

// 客人車籍卡（集點會員資料＋預約＋維修紀錄）
function profileCard(p){
  if (!p) return '';
  const m = p.member;
  if (!m) return `<div class="pcard none">📝 這位客人還沒填車籍資料，可以傳連結給他：<br>
    <span class="pl">https://liff.line.me/2010744078-Wl4rPNJ4?p=profile</span></div>`;
  const row = (k, v) => v ? `<div><span>${k}</span><b>${esc(v)}</b></div>` : '';
  const bk = (p.bookings || []).map(b => `${b.date.slice(5).replace('-','/')} ${b.kind === '留車' ? '留車' : b.time} ${b.service}`).join('、');
  const rp = p.repairs && p.repairs.length ? `<div class="rp"><div class="rh">🔧 維修紀錄</div>${p.repairs.map(r =>
      `<div class="ri"><b>${esc(r.date)}</b>${r.km ? '　' + esc(r.km) + ' km' : ''}${r.amount ? '　$' + esc(r.amount) : ''}<br><small>${esc(r.items || '')}</small></div>`).join('')}</div>` : '';
  return `<div class="pcard">
    <div class="pg">
      ${row('車號', m.plates.join(' / '))}${row('車種', m.model)}
      ${row('姓名', m.name)}${m.phone ? `<div><span>電話</span><b><a href="tel:${esc(m.phone)}">${esc(m.phone)}</a></b></div>` : ''}
      <div><span>集點</span><b>${m.points} / ${m.goal}${m.points >= m.goal ? ' 🎉可兌換' : ''}</b></div>
      ${row('最後換機油', m.lastAdd)}${row('預約', bk)}
    </div>${rp}</div>`;
}

let KB = [];
async function renderKb(){
  const d = await api('ai_admin_kb');
  KB = d.list;
  drawKb('');

function drawKb(q){
  const kw = q.trim().toLowerCase();
  const list = KB.filter(x => !kw || (x.cat + x.q + x.a).toLowerCase().includes(kw));
  const cats = [...new Set(list.map(x => x.cat || '一般'))];
  $('#main').innerHTML = `
    <div style="display:flex;gap:8px;align-items:center">
      <input class="search" placeholder="🔍 搜尋知識庫" value="${esc(q)}" oninput="drawKbKeep(this.value)">
      <button class="btn pri" style="white-space:nowrap;margin-bottom:6px" onclick="editKb(null)">＋ 新增</button>
    </div>
    <div class="hint" style="margin:0 4px 6px">AI 只會根據這裡的資料回答。修改後約 2 分鐘生效。</div>
    <div id="kbEdit"></div>
    ${cats.map(c => `<div class="kb-cat">${esc(c)}</div>` + list.filter(x => (x.cat || '一般') === c).map(x => `
      <div class="card kb ${x.off ? 'off' : ''}" onclick="editKb(${x.row})">
        <div class="t">${esc(x.q || '(無標題)')} ${x.off ? '<span class="chip">停用</span>' : ''}</div>
        <div class="a">${esc(x.a)}</div></div>`).join('')).join('') || '<div class="card empty">找不到資料</div>'}`;
}
let kbT;
function drawKbKeep(v){ clearTimeout(kbT); kbT = setTimeout(() => { drawKb(v); const s = $('.search'); s.focus(); s.setSelectionRange(v.length, v.length); }, 250); }
function editKb(row){
  const x = row ? KB.find(k => k.row === row) : { row: null, cat: '', q: '', a: '', off: false };
  const cats = [...new Set(KB.map(k => k.cat).filter(Boolean))];
  $('#kbEdit').innerHTML = `<div class="card" style="margin:10px 0;outline:2px solid var(--green)">
    <b>${row ? '編輯' : '新增'}資料</b>
    <label class="field"><span>分類</span><input id="kCat" list="kCats" value="${esc(x.cat)}" placeholder="例如：輪胎、大保養、店家">
      <datalist id="kCats">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist></label>
    <label class="field"><span>問題／主題</span><input id="kQ" value="${esc(x.q)}" placeholder="例如：14 吋輪胎價格"></label>
    <label class="field"><span>答案（AI 會照這個回答）</span><textarea id="kA" style="min-height:130px">${esc(x.a)}</textarea></label>
    <label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="kOff" ${x.off ? 'checked' : ''}> 先停用（AI 暫時不看這筆）</label>
    <div class="row-acts">
      ${row ? `<button class="btn sm danger" onclick="delKb(${row})">刪除</button>` : ''}
      <button class="btn sm" onclick="$('#kbEdit').innerHTML=''">取消</button>
      <button class="btn sm pri" onclick="saveKb(${row || 'null'})">儲存</button>
    </div></div>`;
  $('#kbEdit').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
async function saveKb(row){
  try {
    await api('ai_admin_kb_save', { row, cat: $('#kCat').value, q: $('#kQ').value, a: $('#kA').value, off: $('#kOff').checked });

}
