<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>韋德後台工具</title>
<style>
  :root {
    --bg: #0d0d10; --card: #1b1b20; --card-hi: #25252c; --line: #2e2e36;
    --text: #f4f4f6; --sub: #9a9aa6; --accent: #ffaa00; --purple: #a95cff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    padding: 20px 16px calc(32px + env(safe-area-inset-bottom));
  }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  header .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--purple); box-shadow: 0 0 14px var(--purple); }
  header h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: 1px; }
  header small { color: var(--sub); font-size: 13px; margin-left: auto; }
  h2 { font-size: 14px; color: var(--accent); margin: 22px 4px 10px; letter-spacing: 2px; font-weight: 700; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  a.tool {
    display: flex; flex-direction: column; gap: 6px; min-height: 92px;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px; color: var(--text); text-decoration: none; position: relative;
  }
  a.tool:active { background: var(--card-hi); transform: scale(.98); }
  a.tool .icon { font-size: 24px; line-height: 1; }
  a.tool .name { font-size: 15px; font-weight: 700; line-height: 1.3; }
  a.tool .note { font-size: 12px; color: var(--sub); }
  a.tool.wide { grid-column: span 2; flex-direction: row; align-items: center; min-height: 64px; }
  a.tool.wide .text { display: flex; flex-direction: column; gap: 2px; }

  /* PIN 鎖 */
  #lock { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 22px; padding: 16px; z-index: 10; }
  #lock h2 { margin: 0; color: var(--text); font-size: 20px; letter-spacing: 1px; }
  #dots { display: flex; gap: 16px; }
  #dots span { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--sub); }
  #dots span.on { background: var(--accent); border-color: var(--accent); }
  #dots.err span { border-color: #ff4d4f; animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px; }
  #pad button { height: 76px; border-radius: 50%; border: 1px solid var(--line); background: var(--card);
                color: var(--text); font-size: 26px; font-weight: 600; font-family: inherit; }
  #pad button:active { background: var(--card-hi); }
  #pad button.blank { visibility: hidden; }
  #pad button.del { font-size: 18px; }
  .locked main, .locked header { display: none; }
  #logout { display: block; margin: 34px auto 0; background: none; border: 1px solid var(--line);
            color: var(--sub); border-radius: 10px; padding: 8px 18px; font-family: inherit; font-size: 13px; }
</style>
</head>
<body class="locked">
<div id="lock">
  <h2>🔒 輸入 PIN 碼</h2>
  <div id="dots"><span></span><span></span><span></span><span></span></div>
  <div id="pad"></div>
</div>
<header>
  <span class="dot"></span>
  <h1>後台工具</h1>
  <small>韋德機車精品</small>
</header>

<main id="app"></main>

<script>
/* ===============================================
   要新增／修改連結，只改這裡就好
   { icon: '圖示', name: '名稱', note: '小字說明', url: '網址', wide: true(可省略，整行寬) }
   =============================================== */
const SECTIONS = [
  {
    title: '常用工具',
    items: [
      { icon: '⏰', name: '打卡系統', url: 'https://liff.line.me/2010744078-0Da20QZ1' },
      { icon: '🧾', name: '機車估價單', note: '產生器', url: 'https://domino0124-dotcom.github.io/maintenance-report/機車估價單產生器.html' },
      { icon: '📦', name: '訂購訂單', note: '產生器', url: 'https://domino0124-dotcom.github.io/maintenance-report/訂購訂單產生器.html' },
      { icon: '🔧', name: '大保養回報', note: '老闆用', url: 'https://domino0124-dotcom.github.io/maintenance-report/' },
      { icon: '📝', name: '大保養預約單', note: '客人填', url: 'https://domino0124-dotcom.github.io/maintenance-report/大保養確認單.html', wide: true },
    ],
  },
  {
    title: '線上預約',
    items: [
      { icon: '📅', name: '預約後台', note: '查看・管理預約', url: 'https://domino0124-dotcom.github.io/maintenance-report/booking-admin.html' },
      { icon: '🙋', name: '客人預約頁', note: '測試用', url: 'https://liff.line.me/2010744078-CKxuCGOl' },
    ],
  },
  {
    title: 'LINE 官方帳號',
    items: [
      { icon: '💬', name: '聊天回覆', note: 'chat.line.biz', url: 'https://chat.line.biz/' },
      { icon: '⚙️', name: '官方帳號後台', note: 'manager.line.biz', url: 'https://manager.line.biz/' },
    ],
  },
];

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
app.innerHTML = SECTIONS.map(sec => `
  <h2>${esc(sec.title)}</h2>
  <div class="grid">
    ${sec.items.map(it => `
      <a class="tool${it.wide ? ' wide' : ''}" href="${esc(it.url)}">
        <span class="icon">${esc(it.icon)}</span>
        ${it.wide
          ? `<span class="text"><span class="name">${esc(it.name)}</span>${it.note ? `<span class="note">${esc(it.note)}</span>` : ''}</span>`
          : `<span class="name">${esc(it.name)}</span>${it.note ? `<span class="note">${esc(it.note)}</span>` : ''}`}
      </a>`).join('')}
  </div>`).join('') + '<button id="logout">登出（這支手機需重新輸入 PIN）</button>';

/* ===============================================
   PIN 碼鎖：輸入一次後這支手機會記住
   要換 PIN：把新 PIN 的 SHA-256 填到 PIN_HASH
   =============================================== */
const USE_PIN = false;   // 要開啟 PIN 鎖改成 true
const PIN_HASH = 'a655d31f8fc6fec80d8aa921a9fc803a5f5e84d80ce46ec58c6d12c6ebc2c5a9';
const KEY = 'wade_admin_ok';
const store = {
  get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} },
  del() { try { localStorage.removeItem(KEY); } catch (e) {} },
};
async function sha256(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function unlock() { document.body.classList.remove('locked'); document.getElementById('lock').remove(); }

if (!USE_PIN || store.get() === PIN_HASH) {
  unlock();
} else {
  let input = '';
  const dots = document.getElementById('dots');
  const pad = document.getElementById('pad');
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  pad.innerHTML = keys.map(k => `<button class="${k === '' ? 'blank' : k === '⌫' ? 'del' : ''}" data-k="${k}">${k}</button>`).join('');
  const render = () => [...dots.children].forEach((s, i) => s.classList.toggle('on', i < input.length));
  pad.addEventListener('click', async e => {
    const k = e.target.dataset && e.target.dataset.k;
    if (k === undefined || k === '') return;
    if (k === '⌫') { input = input.slice(0, -1); render(); return; }
    if (input.length >= 4) return;
    input += k; render();
    if (input.length === 4) {
      if (await sha256(input) === PIN_HASH) { store.set(PIN_HASH); unlock(); }
      else {
        dots.classList.add('err');
        setTimeout(() => { dots.classList.remove('err'); input = ''; render(); }, 400);
      }
    }
  });
}
if (USE_PIN) document.getElementById('logout').addEventListener('click', () => { store.del(); location.reload(); });
else document.getElementById('logout').remove();
</script>
</body>
</html>
