<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#1f2937;--mute:#6b7280;--line:#e5e7eb;--acc:#ea580c;--acc2:#fff7ed;--ok:#15803d;--bad:#dc2626;--warn:#b45309;--blue:#2563eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.45}
header{background:#111827;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:20}

.more{text-align:center;margin:10px 0}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
</style>
</head>
<body>
<header><h1>蝦皮利潤表</h1><span class="ver">v3</span></header>
<nav id="tabs">
  <button data-t="profit">利潤</button>
  <button data-t="cross">跨賣場</button>
  <button data-t="match">配對</button>
  <button data-t="import">匯入</button>
  <button data-t="set">設定</button>
</nav>
<div id="shopbar"></div>
<main id="main"></main>

<div id="sheet"><div class="panel" id="panel"></div></div>
<div id="toast"></div>

<script>
/* ============================================================
 *  蝦皮利潤表 v3 — 韋德機車精品
 *  v3：大容量儲存（IndexedDB）＋ 兩層配對（標題→系統品名，規格→系統規格）
 *  資料只存在這台裝置的瀏覽器
 * ============================================================ */
const VERSION = 'v3';
const SHOPS = [
  ['WD','韋德機車精品'],['EQ','EQ摩托物流'],['MK','MK_精品'],['CO','COCO機車精品'],
  ['天使','ANGEL MOTO'],['老鷹','老鷹機車精品'],['迷霧','迷霧的世界'],['Memorable','Memorable店鋪']
];
// 標題裡的賣場名稱（比對時拿掉，8 個賣場才能共用配對）
const SHOP_WORDS = ['韋德機車精品','韋德','EQ摩托物流','EQ摩托','MK_精品','MK精品','COCO機車精品','ANGEL MOTO','EAGLE BOUTIQUE','老鷹機車精品','迷霧的世界','Memorable店鋪','Memorable'];
const DEF_SET = {
  gasUrl: 'https://script.google.com/macros/s/AKfycbzd7nyjqzMbGH1WUxBBNqbCrVibCmZEPAMzaGPtkuF0n8TR_Zsovu-7aYM02SGTmPV4UQ/exec',
  key: '', cat: 8, ship: 6.5, pay: 2.5, promo: 4, pre2: 2, pre3: 3, warn: 10
};

/* ---------- 小設定：localStorage ---------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
/* ---------- 大資料：IndexedDB ---------- */
const IDB = {
  db: null,
  open(){ return new Promise((res, rej) => { const r = indexedDB.open('shopee-profit', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  get(k){ return new Promise(res => { if(!this.db) return res(undefined); const q = this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); },
  set(k, v){ return new Promise(res => { if(!this.db) return res(false); const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(true); tx.onerror = tx.onabort = () => { toast('儲存失敗'); res(false); }; }); },
  del(k){ return new Promise(res => { if(!this.db) return res(); const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = () => res(); tx.onerror = () => res(); }); }
};

let S = Object.assign({}, DEF_SET, LS.get('sp_set', {}));
let CAT = LS.get('sp_cat', {});
let MAP = {};
let SYS = {at: '', rows: []};
let cur = LS.get('sp_cur', 'WD');
let tab = LS.get('sp_tab', 'import');
const DATA = {};
const SESSION = {};
const RC = new Map();   // 配對結果快取
let limit = 100, ready = false;

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (n == null || isNaN(n)) ? '—' : (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');
const pct = n => (n == null || isNaN(n)) ? '—' : (Math.round(n * 1000) / 10) + '%';
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', 2600); }
function shopName(c){ const s = SHOPS.find(x => x[0] === c); return s ? s[0] + ' ' + s[1] : c; }
function norm(s){ return String(s || '').normalize('NFKC').toLowerCase().replace(/[\s\-_.\/()（）【】\[\]「」『』,，、:：+＋*~～|｜!！#＃]+/g, ''); }
function strip(t){ let s = String(t || '').normalize('NFKC'); SHOP_WORDS.forEach(w => { s = s.split(w.normalize('NFKC')).join(' '); }); return s.replace(/\s+/g, ' ').trim(); }
function titleKey(it){ return norm(strip(it.n)); }
function nameKey(it){ return titleKey(it) + '|' + norm(it.m); }
function shopData(c){ return DATA[c || cur] || null; }
function shopItems(c){ const d = shopData(c); return d ? d.items : []; }
function saveMap(){ RC.clear(); IDB.set('sp_map', MAP); }

/* ---------- 店務系統資料 + 索引 ---------- */
let sysById = new Map(), sysInv = new Map(), sysBySku = new Map(), FAM = new Map(), famInv = new Map();
function sysId(r){ return r[2] ? 'c:' + r[2] : 'n:' + r[0] + '|' + r[1]; }
function toks(s){
  s = String(s || '').normalize('NFKC').toLowerCase();
  const out = new Set();
  const re = /[a-z0-9]+(?:[.\-\/][a-z0-9]+)*|[㐀-鿿]+/g; let m;
  while((m = re.exec(s))){
    const w = m[0];
    if(/[㐀-鿿]/.test(w)){ for(let i = 0; i < w.length - 1; i++) out.add(w.substr(i, 2)); }
    else{
      if(w.length >= 2 || /\d/.test(w)) out.add(w);
      if(/[.\-\/]/.test(w)) w.split(/[.\-\/]/).forEach(p => { if(p.length >= 2) out.add(p); });
    }
  }
  return out;
}
const TKM = new Map();
function tkm(s){ let v = TKM.get(s); if(!v){ v = toks(s); v.w = wsum(v); if(TKM.size > 50000) TKM.clear(); TKM.set(s, v); } return v; }
const tw = t => /\d/.test(t) ? 3 : /[a-z]/.test(t) ? 2 : 1;
function wsum(set){ let s = 0; set.forEach(t => s += tw(t)); return s; }
function buildSys(){
  sysById = new Map(); sysInv = new Map(); sysBySku = new Map(); FAM = new Map(); famInv = new Map(); RC.clear();
  (SYS.rows || []).forEach(r => {
    const id = sysId(r);
    if(sysById.has(id)) return;
    const t = toks(r[0] + ' ' + r[1] + ' ' + r[2] + ' ' + r[3]);
    sysById.set(id, {r, w: wsum(t) || 1});
    if(r[2]) sysBySku.set(norm(r[2]), id);
    t.forEach(x => { let a = sysInv.get(x); if(!a){ a = []; sysInv.set(x, a); } a.push(id); });
    const fn = String(r[0] || '').trim(); if(!fn) return;
    let f = FAM.get(fn);
    if(!f){ const ft = toks(fn); f = {name: fn, ids: [], w: wsum(ft) || 1}; FAM.set(fn, f); ft.forEach(x => { let a = famInv.get(x); if(!a){ a = []; famInv.set(x, a); } a.push(fn); }); }
    f.ids.push(id);
  });
}
// 單一規格比對（舊方法，手動搜尋用）
function candidates(text, n){
  const q = toks(text), qw = wsum(q) || 1, acc = new Map();
  q.forEach(t => { const ids = sysInv.get(t); if(!ids || ids.length > 400) return; const w = tw(t); ids.forEach(id => acc.set(id, (acc.get(id) || 0) + w)); });
  const res = [];
  acc.forEach((v, id) => { const o = sysById.get(id); res.push([id, 0.6 * Math.min(1, v / o.w) + 0.4 * Math.min(1, v / qw)]); });
  res.sort((a, b) => b[1] - a[1]);
  return res.slice(0, n || 6);
}
// 系列（系統品名）比對
// 排名 = 品名相似 60% ＋ 規格能自動對上的比例 40%
function famCands(title, n, items){
  const q = toks(strip(title)), qw = wsum(q) || 1, acc = new Map();
  q.forEach(t => { const fs = famInv.get(t); if(!fs || fs.length > 300) return; const w = tw(t); fs.forEach(f => acc.set(f, (acc.get(f) || 0) + w)); });
  let res = [];
  acc.forEach((v, fn) => { const f = FAM.get(fn); res.push([fn, 0.75 * Math.min(1, v / f.w) + 0.25 * Math.min(1, v / qw)]); });
  res.sort((a, b) => b[1] - a[1]);
  if(items && items.length){
    res = res.slice(0, 12).map(([fn, ns]) => { let h = 0; items.forEach(it => { if(famPick(it, fn)) h++; }); return [fn, 0.6 * ns + 0.4 * h / items.length, h]; });
    res.sort((a, b) => b[1] - a[1]);
  }
  return res.slice(0, n || 3);
}
function kwSearch(kw, max){
  const kws = kw.toLowerCase().split(/\s+/).filter(Boolean), out = [];
  for(const [id, o] of sysById){
    const r = o.r, hay = (r[0] + ' ' + r[1] + ' ' + r[2] + ' ' + r[3]).toLowerCase();
    if(kws.every(k => hay.includes(k))){ out.push([id, null]); if(out.length >= (max || 40)) break; }
  }
  return out;
}
function famSearch(kw, max){
  const kws = kw.toLowerCase().split(/\s+/).filter(Boolean), out = [];
  for(const [fn, f] of FAM){
    const hay = (fn + ' ' + f.ids.map(id => sysById.get(id).r[1]).join(' ')).toLowerCase();
    if(kws.every(k => hay.includes(k))){ out.push([fn, null]); if(out.length >= (max || 30)) break; }
  }
  return out;
}
// 蝦皮規格名稱 vs 系統規格
function specScore(a, b){
  const na = norm(a), nb = norm(b);
  if(!na || !nb) return 0;
  if(na === nb) return 1;
  if(na.length >= 2 && nb.length >= 2 && (na.includes(nb) || nb.includes(na))) return 0.9;
  const ta = tkm(a), tb = tkm(b); let inter = 0;
  tb.forEach(t => { if(ta.has(t)) inter += tw(t); });
  return 0.85 * inter / (tb.w || 1);
}
function famPick(it, fn){
  const f = FAM.get(fn); if(!f) return null;
  if(f.ids.length === 1){
    const sp = sysById.get(f.ids[0]).r[1];
    if(!sp || !it.mid) return f.ids[0];
  }
  const target = it.m || strip(it.n);
  let best = null, bs = 0, second = 0;
  f.ids.forEach(id => { const s = specScore(target, sysById.get(id).r[1]); if(s > bs){ second = bs; bs = s; best = id; } else if(s > second) second = s; });
  return (bs >= 0.6 && bs - second >= 0.05) ? best : null;
}

/* ---------- 配對與利潤計算 ---------- */
function resolve(shop, it){
  const ck = shop + '|' + it.k;
  if(RC.has(ck)) return RC.get(ck);
  let m = MAP['id:' + shop + ':' + it.k] || null;
  if(!m){ const s1 = it.sku && sysBySku.get(norm(it.sku)); if(s1) m = {id: s1, q: 1, auto: 'sku'}; }
  if(!m){ const s2 = !it.mid && it.ps && sysBySku.get(norm(it.ps)); if(s2) m = {id: s2, q: 1, auto: 'sku'}; }
  if(!m){ const n = MAP['nm:' + nameKey(it)]; if(n) m = Object.assign({auto: 'name'}, n); }
  if(!m){ const fn = MAP['fam:' + titleKey(it)]; if(fn){ const id = famPick(it, fn); if(id) m = {id, q: 1, auto: 'fam'}; } }
  RC.set(ck, m);
  return m;
}
function catRate(cat){ return (cat && CAT[cat] !== undefined && CAT[cat] !== '') ? +CAT[cat] : +S.cat; }
function calc(shop, it){
  const m = resolve(shop, it);
  let cost = null, sys = null;
  if(m){
    if(m.mc != null) cost = +m.mc;
    else { const o = sysById.get(m.id); if(o){ sys = o.r; cost = (+sys[4] || 0) * (+m.q || 1); } }
  }
  const d = parseInt(it.dts, 10) || 0;
  const pre = d >= 3 ? +S.pre3 : (d === 2 ? +S.pre2 : 0);
  const cr = catRate(it.cat);
  const rate = cr + (+S.ship) + (+S.pay) + pre;
  const fee = Math.round(it.p * rate / 100);
  const pfee = Math.round(it.p * (rate + (+S.promo)) / 100);
  const profit = cost == null ? null : it.p - fee - cost;
  const pprofit = cost == null ? null : it.p - pfee - cost;
  return {m, sys, cost, cr, pre, rate, fee, profit, pprofit, margin: profit == null ? null : profit / it.p, sid: (m && m.mc == null && sys) ? m.id : null};
}
function cls(c){ if(c.profit == null) return ''; if(c.profit < 0) return 'neg'; if(c.margin * 100 < +S.warn) return 'low'; return 'pos'; }
function listings(c){
  const g = new Map();
  shopItems(c).forEach(it => { let l = g.get(it.id); if(!l){ l = {id: it.id, n: it.n, items: []}; g.set(it.id, l); } l.items.push(it); });
  return [...g.values()];
}

/* ---------- 匯入蝦皮檔 ---------- */
const FIELDS = {
  itemId:   [/product_id/i, /^商品\s*id$/i, /^商品編號$/],
  name:     [/product_name/i, /^商品名稱$/],
  modelId:  [/variation_id/i, /選項\s*id|規格\s*id/i],
  modelName:[/variation_name/i, /選項名稱|規格名稱/],
  psku:     [/parent_sku/i, /主商品貨號/, /^商品貨號$/],
  sku:      [/variation_sku/i, /選項貨號/],
  price:    [/variation_price/i, /price/i, /價格|售價/],
  stock:    [/stock/i, /庫存/],
  cat:      [/category/i, /類別|分類/],
  dts:      [/days_to_ship|天數/i, /dts|pre_order|備貨/i]
};
function mapCols(row){
  const h = (row || []).map(c => String(c == null ? '' : c).trim()), col = {};
  for(const f in FIELDS){
    col[f] = -1;
    for(const re of FIELDS[f]){ const i = h.findIndex(x => x && re.test(x)); if(i >= 0){ col[f] = i; break; } }
  }
  return col;
}
function parseSheet(aoa){
  let best = -1, bestN = 0, bestCol = null;
  for(let i = 0; i < Math.min(15, aoa.length); i++){
    const col = mapCols(aoa[i]);
    const n = Object.values(col).filter(v => v >= 0).length;
    if(col.itemId >= 0 && n > bestN){ best = i; bestN = n; bestCol = col; }
  }
  if(best < 0 || bestN < 2) return null;
  const rows = [];
  for(let i = best + 1; i < aoa.length; i++){
    const v = String((aoa[i] || [])[bestCol.itemId] || '').trim();
    if(/^\d{4,}$/.test(v)) rows.push({r: aoa[i], idx: i});
  }
  return {col: bestCol, rows};
}
async function doImport(){
  const files = [...($('#file').files || [])];
  if(!files.length) return toast('請先選擇檔案');
  const btn = $('#impbtn'); btn.disabled = true; btn.textContent = '匯入中…（商品多會比較久）';
  await new Promise(r => setTimeout(r, 30));
  const prev = shopData(cur), info = {}, items = new Map(), sess = [], log = [];
  if(prev) prev.items.forEach(it => { const o = info[it.id] || (info[it.id] = {}); if(it.cat) o.cat = it.cat; if(it.dts !== '' && it.dts != null) o.dts = it.dts; });
  const parts = [];
  for(const f of files){
    const buf = await f.arrayBuffer();
    if(/\.zip$/i.test(f.name)){
      if(typeof JSZip === 'undefined'){ log.push('❌ ' + f.name + '：解壓元件沒載入，請重新整理'); continue; }
      try{
        const zip = await JSZip.loadAsync(buf);
        const names = Object.keys(zip.files).filter(n => !zip.files[n].dir && !/__MACOSX|\/\./.test(n) && /\.(xlsx|xls|csv)$/i.test(n)).sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));
        if(!names.length) log.push('❌ ' + f.name + '：壓縮檔裡沒有 Excel');
        for(const n of names) parts.push({name: f.name.replace(/\.zip$/i, '') + '_' + n.split('/').pop(), buf: await zip.files[n].async('arraybuffer')});
      }catch(e){ log.push('❌ ' + f.name + '：解壓失敗'); }
    }else parts.push({name: f.name, buf});
  }
  for(const f of parts){
    let wb;
    try{ wb = XLSX.read(f.buf, {type: 'array'}); }catch(e){ log.push('❌ ' + f.name + '：讀不到檔案'); continue; }
    let used = 0;
    wb.SheetNames.forEach(sn => {
      const ws = wb.Sheets[sn]; if(!ws || !ws['!ref']) return;
      const rg = XLSX.utils.decode_range(ws['!ref']);
      const aoa = XLSX.utils.sheet_to_json(ws, {header: 1, raw: false, defval: '', blankrows: true});
      const p = parseSheet(aoa); if(!p || !p.rows.length) return;
      used++;
      const c = p.col, rowOf = {}; let priced = 0;
      p.rows.forEach(({r, idx}) => {
        const g = k => c[k] >= 0 ? String(r[c[k]] == null ? '' : r[c[k]]).trim() : '';
        const id = g('itemId'), mid = g('modelId'), k = id + '_' + (mid || '0');
        const o = info[id] || (info[id] = {});
        const cat = g('cat'); if(cat) o.cat = cat;
        const d = g('dts'); if(d !== '') o.dts = d;
        const nm = g('name'); if(nm) o.n = nm;
        const price = parseFloat(g('price').replace(/[,$\s]/g, ''));
        if(c.price >= 0 && price > 0){
          const it = items.get(k) || {k, id, mid};
          it.n = nm || it.n || ''; it.m = g('modelName'); it.ps = g('psku'); it.sku = g('sku'); it.p = price; it.st = g('stock');
          items.set(k, it); priced++;
        }
        rowOf[k] = idx;
      });
      if(c.price >= 0 && (c.sku >= 0 || c.psku >= 0)) sess.push({wb, fname: f.name, sn, cSku: c.sku, cPsku: c.psku, rowOf, r0: rg.s.r, c0: rg.s.c});
      const got = [];
      if(priced) got.push('售價 ' + priced + ' 筆');
      if(c.cat >= 0) got.push('分類');
      if(c.dts >= 0) got.push('備貨天數');
      if(c.sku >= 0 || c.psku >= 0) got.push('貨號');
      log.push('✅ ' + f.name + '：' + (got.join('、') || p.rows.length + ' 列'));
    });
    if(!used) log.push('❌ ' + f.name + '：找不到蝦皮商品欄位（商品ID）');
  }
  const list = items.size ? [...items.values()] : (prev ? prev.items : []);
  list.forEach(it => { const o = info[it.id]; if(o){ if(o.cat) it.cat = o.cat; if(o.dts !== undefined) it.dts = o.dts; if(!it.n && o.n) it.n = o.n; } });
  if(!list.length){
    log.push('⚠️ 沒有讀到任何售價。請一起選「價格及庫存」(sales_info) 那份檔案。');
  }else{
    const d = {at: new Date().toLocaleString('zh-TW', {hour12: false}), files: files.map(f => f.name), items: list};
    if(await IDB.set('sp_shop_' + cur, d)){ DATA[cur] = d; RC.clear(); }
    if(sess.length) SESSION[cur] = sess;
    log.push('👉 ' + shopName(cur) + ' 共 ' + list.length + ' 個規格（' + new Set(list.map(x => x.id)).size + ' 個商品頁）' + (items.size ? '' : '（只更新分類／備貨天數）'));
  }
  LS.set('sp_implog_' + cur, log);
  render();
  toast(list.length ? '匯入完成' : '匯入失敗，看下方說明');
}
function exportSku(){
  const sess = SESSION[cur]; if(!sess) return;
  const items = shopItems(); let total = 0;
  sess.forEach(s => {
    const ws = s.wb.Sheets[s.sn]; let n = 0;
    items.forEach(it => {
      const ri = s.rowOf[it.k]; if(ri == null) return;
      const m = resolve(cur, it); if(!m || m.mc != null || (+m.q || 1) !== 1) return;
      const o = sysById.get(m.id); if(!o || !o.r[2]) return;
      const c = it.mid ? s.cSku : (s.cPsku >= 0 ? s.cPsku : s.cSku); if(c < 0) return;
      const addr = XLSX.utils.encode_cell({r: ri + s.r0, c: c + s.c0});
      if(ws[addr] && String(ws[addr].v).trim() === o.r[2]) return;
      ws[addr] = {t: 's', v: o.r[2]}; n++;
    });
    if(n){ XLSX.writeFile(s.wb, s.fname.replace(/\.(xlsx|xls|csv)$/i, '') + '_貨號更新.xlsx'); total += n; }
  });
  toast(total ? '已下載，共更新 ' + total + ' 個貨號' : '沒有需要更新的貨號');
}

/* ---------- 向 GAS 拿成本 ---------- */
async function syncSys(){
  if(!S.key) return toast('請先輸入網頁密碼');
  const b = $('#syncbtn'); if(b){ b.disabled = true; b.textContent = '更新中…'; }
  try{
    const res = await fetch(S.gasUrl, {method: 'POST', body: JSON.stringify({type: 'product_sync', action: 'list', key: S.key})});
    const txt = await res.text(); let j;
    try{ j = JSON.parse(txt); }catch(e){ throw new Error('GAS 回應格式不對（可能還沒重新部署）'); }
    if(!j.ok) throw new Error(j.error || '未知錯誤');
    SYS = {at: j.at || '', rows: j.rows || [], got: new Date().toLocaleString('zh-TW', {hour12: false})};
    await IDB.set('sp_sys', SYS); buildSys();
    toast('成本已更新：' + SYS.rows.length + ' 筆');
  }catch(e){ toast('更新失敗：' + e.message); }
  render();
}

}

  const nz = v => v == null ? Infinity : v;

  </div>

      <option value="all">全部</option><option value="ok">已配對</option><option value="loss">虧錢</option><option value="low">低利</option>
      <option value="un">未配對</option><option value="pre">有預購費</option>
    </select>
    <select id="ps">
      <option value="m_asc">利潤率 低→高</option><option value="m_desc">利潤率 高→低</option>
      <option value="p_asc">利潤 低→高</option><option value="price">售價 高→低</option><option value="name">品名</option>
    </select>
    <button class="btn sec" onclick="dlCsv()">下載表格</button>
  </div>
  <div class="muted" style="margin-bottom:8px">共 ${list.length} 筆，點商品可改配對</div>
  ${list.slice(0, limit).map(cardProfit).join('') || '<div class="empty">沒有符合的商品</div>'}
  ${list.length > limit ? `<div class="more"><button class="btn sec" onclick="limit+=100;render()">再顯示 100 筆</button></div>` : ''}`;
  $('#pf').value = f.f; $('#ps').value = f.s;

  $('#pq').onchange = save; $('#pf').onchange = save; $('#ps').onchange = save;

function tags(c){

function rCross(){

    <div class="ctrl">${curFam ? `<button class="btn sec" onclick="clearFam('${esc(lid)}')">取消品名</button>` : ''}<button class="btn sec" style="flex:1" onclick="closeEdit()">關閉</button></div>`;
  const draw = () => {
    const kw = $('#f-kw').value.trim();
    const res = kw ? famSearch(kw, 30) : famCands(l.n, 8, l.items);
    $('#f-res').innerHTML = res.map(([fn, sc]) => { const f = FAM.get(fn); return `<button class="cand ${fn === curFam ? 'sel' : ''}" onclick="setFam('${esc(lid)}','${encodeURIComponent(fn)}')">${sc != null ? `<span class="sc">${Math.round(sc * 100)}%</span>` : ''}${esc(fn)}<br><span class="muted">系統 ${f.ids.length} 個規格｜可自動對上 ${famPreview(l, fn)}/${l.items.length}</span></button>`; }).join('') || '<div class="muted">找不到，少打一個關鍵字試試</div>';
  };
  $('#f-kw').oninput = () => { clearTimeout(openFam._t); openFam._t = setTimeout(draw, 250); };
  draw();
  $('#sheet').classList.add('show');
}
function bulkFam(){
  toast('計算中，請稍等…');
  setTimeout(bulkFam2, 50);
}
function bulkFam2(){
  const todo = [];
  listings().forEach(l => {
    const tk = titleKey(l.items[0]);
    if(MAP['fam:' + tk]) return;
    if(l.items.every(it => resolve(cur, it))) return;
    const cs = famCands(l.n, 2, l.items); if(!cs.length) return;
    const [fn, sc, hit] = cs[0];
    if(sc < 0.6) return;
    if(cs.length > 1 && sc - cs[1][1] < 0.08) return;
    if(hit / l.items.length < 0.5) return;
    todo.push([tk, fn]);
  });
  if(!todo.length) return toast('沒有夠高分的，請一個一個點');
  if(!confirm('有 ' + todo.length + ' 個商品頁的第一名分數很高，而且一半以上規格對得上，全部接受？\n（之後可以在「選了但有規格沒對上」裡檢查）')) return;
  todo.forEach(([tk, fn]) => { MAP['fam:' + tk] = fn; });
  saveMap(); render(); toast('已接受 ' + todo.length + ' 個商品頁');
}

/* ---------- 匯入頁、設定頁 ---------- */
function rImport(){
  const d = shopData(cur), log = LS.get('sp_implog_' + cur, []), sess = SESSION[cur];
  $('#main').innerHTML = `
  <div class="box">
    <h3>匯入到：<span style="color:var(--acc)">${esc(shopName(cur))}</span></h3>
    <div class="muted">上面先選賣場，再選檔案。</div>
    <ol class="steps muted">
      <li>用這個賣場的帳號登入蝦皮賣家中心</li>
      <li>我的商品 → 批次工具 → 下載「價格及庫存」和「備貨天數」</li>
      <li>下載到的兩個 .zip（sales_info 和 dts_info）一起選，按匯入。不用解壓縮</li>
    </ol>
    <input type="file" id="file" multiple accept=".zip,.xlsx,.xls,.csv" style="width:100%;margin-bottom:10px">
    <button class="btn full" id="impbtn" onclick="doImport()">匯入</button>
  </div>
  ${log.length ? `<div class="box"><h3>上次匯入結果</h3>${log.map(l => `<div class="muted" style="color:var(--ink)">${esc(l)}</div>`).join('')}${d ? `<div class="muted" style="margin-top:6px">時間 ${esc(d.at)}</div>` : ''}</div>` : ''}
  ${sess ? `<div class="box"><h3>把系統料號寫回蝦皮貨號</h3>
    <div class="muted">配對好之後，按這裡會下載改好貨號的「價格及庫存」檔，到蝦皮批次工具上傳。之後兩邊料號一樣，就會自動配對。<br>⚠️ 第一次請先拿幾個商品測試。組合商品（數量不是 1）和手動成本的不會寫入。<br>這個按鈕只在剛匯入完的這次可以用，重新整理頁面就要重新匯入。</div>
    <button class="btn full" style="margin-top:10px" onclick="exportSku()">下載貨號更新檔</button></div>` : ''}
  ${d ? `<div class="box"><button class="btn sec full" onclick="clearShop()">清除 ${esc(cur)} 的商品資料</button></div>` : ''}`;
}
async function clearShop(){
  if(!confirm('確定清除 ' + shopName(cur) + ' 的商品資料？（配對紀錄會保留）')) return;
  await IDB.del('sp_shop_' + cur); LS.del('sp_implog_' + cur); delete DATA[cur]; delete SESSION[cur]; RC.clear(); render();
}
function rSet(){
  const cats = new Map();
  SHOPS.forEach(([s]) => shopItems(s).forEach(it => { if(it.cat) cats.set(it.cat, (cats.get(it.cat) || 0) + 1); }));
  const num = (k, label, unit) => `<div class="row"><label>${label}</label><input type="number" step="0.1" inputmode="decimal" data-k="${k}" value="${esc(S[k])}"><span class="muted">${unit || '%'}</span></div>`;
  $('#main').innerHTML = `
  <div class="box">
    <h3>成本資料（店務系統）</h3>
    <div class="muted">${SYS.rows.length ? `共 ${SYS.rows.length} 筆｜電腦同步 ${esc(SYS.at || '?')}｜網頁取得 ${esc(SYS.got || '')}` : '尚未取得'}</div>
    <div class="row" style="margin-top:10px"><label>網頁密碼</label><input type="password" data-k="key" value="${esc(S.key)}" placeholder="GAS 的 PRODUCT_WEB_KEY"></div>
    <button class="btn full" id="syncbtn" onclick="syncSys()">更新成本資料</button>
  </div>
  <div class="box">
    <h3>費率（8 個賣場共用）</h3>
    ${num('cat', '成交手續費（預設）')}
    ${num('ship', '免運方案')}
    ${num('pay', '金流費')}
    ${num('promo', '活動日加收')}
    ${num('pre2', '預購 備貨 2 天')}
    ${num('pre3', '預購 備貨 3 天以上')}
    ${num('warn', '低利潤提醒 低於')}
    <div class="muted">不算 5% 營業稅。改完自動儲存。</div>
  </div>
  <div class="box">
    <h3>各分類成交手續費</h3>
    <div class="muted" style="margin-bottom:8px">空白 = 用預設 ${esc(S.cat)}%。請對照蝦皮公告的分類費率填。</div>
    ${cats.size ? [...cats].sort((a, b) => b[1] - a[1]).map(([c, n]) => `<div class="row"><label style="flex:1;font-size:13px">${esc(c)} <span class="muted">(${n})</span></label><input type="number" step="0.1" inputmode="decimal" style="flex:0 0 80px" data-cat="${esc(c)}" value="${esc(CAT[c] ?? '')}" placeholder="${esc(S.cat)}"><span class="muted">%</span></div>`).join('') : '<div class="muted">匯入「備貨天數」檔之後，這裡會列出所有分類。</div>'}
  </div>
  <div class="box">
    <h3>進階</h3>
    <div class="row"><label>GAS 網址</label><input data-k="gasUrl" value="${esc(S.gasUrl)}"></div>
    <button class="btn sec full" onclick="backup()">備份全部資料（換電腦／手機用）</button>
    <div style="height:8px"></div>
    <label class="btn sec full" style="display:block;text-align:center">還原備份<input type="file" accept=".json" style="display:none" onchange="restore(this.files[0])"></label>
    <div class="muted" style="margin-top:8px">版本 ${VERSION}。資料只存在這台裝置的瀏覽器。</div>
  </div>`;
  document.querySelectorAll('[data-k]').forEach(el => el.onchange = () => { const k = el.dataset.k; S[k] = (k === 'key' || k === 'gasUrl') ? el.value.trim() : (el.value === '' ? DEF_SET[k] : +el.value); LS.set('sp_set', S); toast('已儲存'); });
  document.querySelectorAll('[data-cat]').forEach(el => el.onchange = () => { const c = el.dataset.cat; if(el.value === '') delete CAT[c]; else CAT[c] = +el.value; LS.set('sp_cat', CAT); toast('已儲存'); });
}
function backup(){
  const o = {v: VERSION, set: Object.assign({}, S, {key: ''}), cat: CAT, map: MAP, shops: {}};
  SHOPS.forEach(([s]) => { const d = shopData(s); if(d) o.shops[s] = d; });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(o)], {type: 'application/json'}));
  a.download = '蝦皮利潤表備份_' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
}
async function restore(f){
  if(!f) return;
  try{
    const o = JSON.parse(await f.text());
    if(!confirm('還原會覆蓋目前的設定、配對和商品資料，確定？')) return;
    const key = S.key;
    S = Object.assign({}, DEF_SET, o.set || {}, {key}); CAT = o.cat || {}; MAP = o.map || {};
    LS.set('sp_set', S); LS.set('sp_cat', CAT); await IDB.set('sp_map', MAP);
    for(const [s] of SHOPS){ await IDB.del('sp_shop_' + s); delete DATA[s]; }
    for(const [s, d] of Object.entries(o.shops || {})){ await IDB.set('sp_shop_' + s, d); DATA[s] = d; }
    RC.clear(); toast('還原完成'); render();
  }catch(e){ toast('還原失敗：檔案格式不對'); }
}
function dlCsv(){
  const head = ['賣場','商品ID','選項ID','商品名稱','選項','分類','售價','成本','費率%','費用','利潤','利潤率%','活動日利潤','系統料號','系統品名','系統規格'];
  const lines = [head];
  rows().forEach(({it, c}) => lines.push([cur, it.id, it.mid, it.n, it.m, it.cat || '', it.p, c.cost ?? '', Math.round(c.rate * 10) / 10, c.fee, c.profit ?? '', c.margin == null ? '' : Math.round(c.margin * 1000) / 10, c.pprofit ?? '', c.sys ? c.sys[2] : '', c.sys ? c.sys[0] : '', c.sys ? c.sys[1] : '']));
  const csv = '﻿' + lines.map(r => r.map(v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
  a.download = '蝦皮利潤_' + cur + '_' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
}

/* ---------- 修改單一規格配對（下方彈出） ---------- */
let editK = null, editSel = null;
function openEdit(k){
  const it = shopItems().find(x => x.k === k); if(!it) return;
  editK = k;
  const m = resolve(cur, it);
  editSel = m && m.mc == null ? m.id : null;
  $('#panel').innerHTML = `
    <div class="nm">${esc(it.n)}</div>
    <div class="sub">${esc([it.m, '售價 ' + money(it.p), it.sku ? '貨號 ' + it.sku : ''].filter(Boolean).join('｜'))}</div>
    <div class="row" style="margin-top:12px"><label>搜尋系統商品</label><input id="e-kw" placeholder="例：93 110（跟 LINE 查價一樣）"></div>
    <div id="e-res" class="cands" style="margin-bottom:12px"></div>
    <div class="row"><label>數量（組合用）</label><input id="e-q" type="number" step="1" min="1" inputmode="numeric" value="${m && m.q ? m.q : 1}"></div>
    <div class="row"><label>或手動成本</label><input id="e-mc" type="number" inputmode="decimal" placeholder="系統沒有的商品才填" value="${m && m.mc != null ? m.mc : ''}"></div>
    <div class="ctrl" style="margin-top:12px">
      <button class="btn" style="flex:1" onclick="saveEdit()">儲存</button>
      <button class="btn sec" onclick="clearEdit()">取消配對</button>
      <button class="btn sec" onclick="closeEdit()">關閉</button>
    </div>`;
  $('#e-kw').oninput = () => { clearTimeout(openEdit._t); openEdit._t = setTimeout(editRes, 250); };
  editRes();
  $('#sheet').classList.add('show');
}
function editRes(){
  const it = shopItems().find(x => x.k === editK); if(!it) return;
  const kw = $('#e-kw').value.trim();
  let ids = kw ? kwSearch(kw, 40) : candidates(strip(it.n) + ' ' + it.m, 8);
  if(editSel && !ids.some(x => x[0] === editSel) && sysById.has(editSel)) ids.unshift([editSel, null]);
  $('#e-res').innerHTML = ids.map(([id, sc]) => { const r = sysById.get(id).r; return `<button class="cand ${id === editSel ? 'sel' : ''}" data-id="${encodeURIComponent(id)}">${sc != null ? `<span class="sc">${Math.round(sc * 100)}%</span>` : ''}${id === editSel ? '✅ ' : ''}${esc(r[0])}<br><span class="muted">${esc([r[1], r[2] ? '料號 ' + r[2] : '', '成本 ' + money(r[4]), '末端 ' + money(r[5])].filter(Boolean).join('｜'))}</span></button>`; }).join('') || '<div class="muted">找不到，少打一個關鍵字試試</div>';
  document.querySelectorAll('#e-res .cand').forEach(b => b.onclick = () => { editSel = decodeURIComponent(b.dataset.id); $('#e-mc').value = ''; editRes(); });
}
function saveEdit(){
  const it = shopItems().find(x => x.k === editK); if(!it) return;
  const q = parseFloat($('#e-q').value) || 1, mc = $('#e-mc').value.trim();
  let rec = null;
  if(mc !== '') rec = {mc: parseFloat(mc), q: 1};
  else if(editSel) rec = {id: editSel, q};
  if(!rec) return toast('請點選一個商品，或輸入手動成本');
  MAP['id:' + cur + ':' + it.k] = rec;
  if(rec.id) MAP['nm:' + nameKey(it)] = rec;
  saveMap(); closeEdit(); render(); toast('已儲存');
}
function clearEdit(){
  const it = shopItems().find(x => x.k === editK); if(!it) return;
  delete MAP['id:' + cur + ':' + it.k]; delete MAP['nm:' + nameKey(it)];
  saveMap(); closeEdit(); render(); toast('已取消配對');
}
function closeEdit(){ $('#sheet').classList.remove('show'); editK = null; }
$('#sheet').onclick = e => { if(e.target.id === 'sheet') closeEdit(); };

/* ---------- 啟動 ---------- */
function go(t){ tab = t; LS.set('sp_tab', t); limit = 100; render(); window.scrollTo(0, 0); }
$('#tabs').onclick = e => { const b = e.target.closest('button'); if(b) go(b.dataset.t); };
$('#shopbar').onclick = e => { const b = e.target.closest('button'); if(!b) return; cur = b.dataset.s; LS.set('sp_cur', cur); limit = 100; render(); };
async function boot(){
  render();
  try{ await IDB.open(); }catch(e){ toast('無法開啟儲存空間'); }
  // v1/v2 舊資料搬到大容量儲存
  const old = ['sp_sys', 'sp_map'].concat(SHOPS.map(([s]) => 'sp_shop_' + s));
  for(const k of old){ const v = LS.get(k, null); if(v != null){ if(await IDB.set(k, v)) LS.del(k); } }
  SYS = (await IDB.get('sp_sys')) || {at: '', rows: []};
  MAP = (await IDB.get('sp_map')) || {};
  for(const [s] of SHOPS){ const d = await IDB.get('sp_shop_' + s); if(d) DATA[s] = d; }
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  buildSys();
  ready = true;
  if(typeof XLSX === 'undefined') toast('Excel 讀取元件沒載入，請確認網路後重新整理');
  render();
}
boot();
</script>
