<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>訂貨單產生器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F1EA;
    --card: #FFFFFF;
    --ink: #241F1B;
    --sub: #8A8078;
    --line: #E7E0D6;
    --accent: #E0631F;
    --accent-dark: #B84C15;
    --accent-soft: #FBE6D6;
    --ok: #2F7A4D;
    --ok-soft: #E3F0E6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    background-image: radial-gradient(circle at 1px 1px, rgba(36,31,27,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
    padding:20px 14px 60px;
  }
  .wrap{max-width:620px;margin:0 auto;}
  header{margin-bottom:20px;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;letter-spacing:0.12em;color:var(--accent-dark);
    text-transform:uppercase;display:flex;align-items:center;gap:8px;
  }
  .eyebrow::before{content:"";width:18px;height:2px;background:var(--accent);display:inline-block;}
  h1{font-size:26px;font-weight:900;margin:8px 0 4px;letter-spacing:0.01em;}
  .desc{color:var(--sub);font-size:14px;line-height:1.5;}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px;margin-bottom:14px;box-shadow: 0 1px 2px rgba(36,31,27,0.04);
  }
  .card h2{
    font-size:13px;font-weight:700;color:var(--accent-dark);text-transform:uppercase;
    letter-spacing:0.08em;margin:0 0 14px;display:flex;align-items:center;gap:6px;
  }
  .row{display:flex;gap:10px;margin-bottom:10px;}
  .field{flex:1;display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12px;color:var(--sub);font-weight:500;}
  .field input, .field select{
    border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;
    font-size:15px;font-family:inherit;color:var(--ink);background:#FCFAF6;width:100%;
    max-width:100%;
  }
  .field input[type="datetime-local"]{
    font-size:14px;
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--accent);}

  .item-row{
    border:1.5px dashed var(--line);border-radius:12px;padding:12px;
    margin-bottom:10px;background:#FCFAF6;
  }
  .item-row .row{margin-bottom:8px;}
  .item-row .row:last-child{margin-bottom:0;}
  .item-row .field label{font-size:11px;}
  .remove-btn{
    flex-shrink:0;width:36px;height:36px;border-radius:8px;border:1.5px solid var(--line);
    background:#fff;color:var(--sub);font-size:14px;cursor:pointer;
  }
  .remove-btn:hover{border-color:#C0392B;color:#C0392B;}
  .add-btn{
    width:100%;background:#fff;border:1.5px dashed var(--accent);color:var(--accent-dark);
    border-radius:10px;padding:12px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
  }
  .add-btn:hover{background:var(--accent-soft);}

  .generate-btn{
    width:100%;background:var(--ink);color:#fff;border:none;border-radius:12px;padding:16px;
    font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;
    transition: transform .1s, background .15s;
  }
  .generate-btn:active{transform:scale(0.98);}
  .generate-btn:hover{background:var(--accent-dark);}

  .output-wrap{display:none;}
  .output-wrap.show{display:block;}
  textarea{
    width:100%;min-height:220px;border:1.5px solid var(--line);border-radius:12px;padding:14px;
    font-family:'JetBrains Mono', monospace;font-size:13.5px;line-height:1.7;color:var(--ink);
    background:#FCFAF6;resize:vertical;
  }
  .total-box{
    display:flex;align-items:center;justify-content:space-between;background:var(--ok-soft);
    border:1.5px solid var(--ok);border-radius:12px;padding:12px 16px;margin-top:14px;
  }
  .total-box .label{font-size:13px;color:var(--sub);}
  .total-box .amount{font-size:20px;font-weight:900;color:var(--ok);font-family:'JetBrains Mono', monospace;}
  .copy-btn{
    width:100%;background:var(--ok);color:#fff;border:none;border-radius:12px;padding:14px;
    font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:10px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .copy-btn.copied{background:var(--ink);}
  .pdf-btn{
    width:100%;background:#fff;border:1.5px solid var(--ink);color:var(--ink);border-radius:12px;
    padding:14px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:10px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .pdf-btn:hover{background:var(--accent-soft);border-color:var(--accent);}
  .pdf-btn.working{opacity:0.6;pointer-events:none;}
  .hint{font-size:12px;color:var(--sub);text-align:center;margin-top:8px;}

  /* ---- 訂貨單樣式，產生後直接顯示在畫面上，方便截圖 ---- */
  #receiptContent{
    display:none;
    background:#ffffff;color:#1a1a1a;font-family:'Noto Sans TC', sans-serif;
    border-radius:16px;padding:20px 16px;margin-top:14px;
    border:1px solid var(--line);
  }
  #receiptContent.show{ display:block; }
  .doc-shopname{text-align:center;font-size:18px;font-weight:900;letter-spacing:0.05em;}
  .doc-titlebar{ text-align:center; margin:4px 0 16px; }
  .doc-titlebar .title{font-size:20px;font-weight:900;letter-spacing:0.15em;}
  .doc-titlebar .tel{font-size:12px;color:#666;margin-top:2px;}
  .doc-meta{ font-size:12.5px; margin-bottom:6px; line-height:1.9; }
  .doc-meta div{ display:flex; justify-content:space-between; border-bottom:1px dotted #e5e5e5; padding:2px 0; }
  .doc-meta div span:first-child{ color:#8A8078; }
  .doc-meta div span:last-child{ font-weight:500; }
  .doc-table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin-top:12px; }
  table.doc-table{width:100%;min-width:480px;border-collapse:collapse;font-size:12px;}
  table.doc-table th{
    border-top:2px solid #1a1a1a;border-bottom:1.5px solid #1a1a1a;
    padding:7px 5px;font-weight:700;text-align:left;background:#fafafa;white-space:nowrap;
  }
  table.doc-table td{padding:6px 5px;border-bottom:1px solid #e5e5e5;}
  table.doc-table th:nth-child(1), table.doc-table td:nth-child(1){width:26px;text-align:center;}
  table.doc-table th:nth-child(4), table.doc-table td:nth-child(4){width:44px;text-align:center;}
  table.doc-table th:nth-child(5), table.doc-table td:nth-child(5){width:66px;text-align:right;}
  table.doc-table th:nth-child(6), table.doc-table td:nth-child(6){width:66px;text-align:right;}
  table.doc-table .deposit-row td{color:#B84C15;font-weight:700;}
  .doc-total{
    text-align:right;font-size:17px;font-weight:900;margin-top:14px;padding-top:10px;
    border-top:2px solid #1a1a1a;
  }
  .doc-notes{margin-top:20px;font-size:11px;line-height:1.9;}
  .doc-notes .notes-title{font-weight:700;letter-spacing:0.2em;font-size:12px;margin-bottom:6px;}
</style>
<style>
  #screenshotHint{
    text-align:center;font-size:12px;color:var(--sub);margin-top:10px;
  }
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">韋德機車精品 · 訂貨單</div>
    <h1>訂貨單產生器</h1>
    <div class="desc">填客戶與商品資料，產生正式訂貨單 PDF，同時可複製文字訊息傳給客人。</div>
  </header>

  <div class="card">
    <h2>單據資訊</h2>
    <div class="row">
      <div class="field">
        <label>日期時間</label>
        <input type="datetime-local" id="orderTime">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>付款方式</label>
        <select id="payMethod">
          <option value="現金">現金</option>
          <option value="轉帳">轉帳</option>
          <option value="行動支付">行動支付</option>
          <option value="其他">其他（自行輸入）</option>
        </select>
      </div>
      <div class="field" id="payOtherWrap" style="display:none;">
        <label>付款方式（自訂）</label>
        <input type="text" id="payOther" placeholder="例如：貨到付款">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>客戶資料</h2>
    <div class="row">
      <div class="field">
        <label>客戶姓名</label>
        <input type="text" id="customerName" placeholder="不知道可留空">
      </div>
      <div class="field">
        <label>車號</label>
        <input type="text" id="plateNo" placeholder="例如：PKG-0123">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>電話</label>
        <input type="text" id="phone" placeholder="例如：0912345678">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>商品明細</h2>
    <div id="itemsList"></div>
    <button class="add-btn" id="addItemBtn" type="button">＋ 新增商品</button>
  </div>

  <div class="card">
    <h2>訂金</h2>
    <div class="row">
      <div class="field">
        <label>預付訂金</label>
        <input type="text" inputmode="numeric" id="deposit" placeholder="0">
      </div>
    </div>
  </div>

  <button class="generate-btn" id="generateBtn">產生訂貨單</button>

  <div class="output-wrap card" id="outputWrap" style="margin-top:14px;">
    <h2>傳給客人的文字訊息</h2>
    <textarea id="outputText"></textarea>
    <div class="total-box">
      <div class="label">應收款</div>
      <div class="amount" id="totalAmount">$0</div>
    </div>
    <button class="copy-btn" id="copyBtn">複製文字訊息</button>
    <button class="pdf-btn" id="pdfBtn">顯示訂貨單（可截圖）</button>
    <div class="hint">文字訊息貼到 LINE；訂貨單截圖後傳給客人或自己留底</div>
  </div>

  <div id="receiptContent">
    <div class="doc-shopname">韋德機車精品</div>
    <div class="doc-titlebar">
      <div class="title">訂　貨　單</div>
      <div class="tel">TEL: 02-2998-7231</div>
    </div>
    <div class="doc-meta">
      <div><span>客戶</span><span id="dCustomer"></span></div>
      <div><span>車號</span><span id="dPlate"></span></div>
      <div><span>電話</span><span id="dPhone"></span></div>
      <div><span>日期</span><span id="dDate"></span></div>
      <div><span>付款方式</span><span id="dPay"></span></div>
    </div>
    <div class="doc-table-wrap">
    <table class="doc-table">
    <thead>
      <tr><th>No</th><th>品名</th><th>規格</th><th>數量</th><th>售價</th><th>小計</th><th>備註</th></tr>
    </thead>
    <tbody id="dItemsBody"></tbody>
    </table>
    </div>
    <div class="doc-total">應收款：<span id="dTotal"></span> 元</div>
    <div class="doc-notes">
      <div class="notes-title">備　　註</div>
      <div>(一)款項未結清之前，產品仍屬於本公司所有。</div>
      <div>(二)取貨時請帶本貨單。</div>
      <div>(三)若商品已跟工廠下訂，若客戶要退訂，原因無法已等太久、不想要、出車禍、沒生活費等理由，訂金一律不退回。</div>
    </div>
  </div>
</div>

<script>
let orderItems = [];

function addItem(){
  orderItems.push({ name:'', spec:'', qty:'1', price:'', note:'' });
  renderItems();
}
function removeItem(idx){
  orderItems.splice(idx,1);
  renderItems();
}
function renderItems(){
  const wrap = document.getElementById('itemsList');
  wrap.innerHTML = '';
  orderItems.forEach((row, idx) => {
    const div = document.createElement('div');
    div.className = 'item-row';
    div.innerHTML = `
      <div class="row">
        <div class="field" style="flex:2;">
          <label>品名 ${idx+1}</label>
          <input type="text" data-idx="${idx}" data-field="name" placeholder="例如：BREMBO 基本對四卡鉗" value="${row.name}">
        </div>
        <div class="field" style="flex:1.5;">
          <label>規格</label>
          <input type="text" data-idx="${idx}" data-field="spec" placeholder="例如：黑底紅字" value="${row.spec}">
        </div>
      </div>
      <div class="row">
        <div class="field" style="flex:0.6;">
          <label>數量</label>
          <input type="text" inputmode="numeric" data-idx="${idx}" data-field="qty" placeholder="1" value="${row.qty}">
        </div>
        <div class="field" style="flex:1;">
          <label>售價</label>
          <input type="text" inputmode="numeric" data-idx="${idx}" data-field="price" placeholder="0" value="${row.price}">
        </div>
        <div class="field" style="flex:1.6;">
          <label>備註</label>
          <input type="text" data-idx="${idx}" data-field="note" placeholder="選填" value="${row.note}">
        </div>
        <button class="remove-btn" data-remove="${idx}" type="button">✕</button>
      </div>
    `;
    wrap.appendChild(div);
  });
  wrap.querySelectorAll('input[data-idx]').forEach(el => {
    el.addEventListener('input', () => {
      const idx = parseInt(el.getAttribute('data-idx'),10);
      const field = el.getAttribute('data-field');
      orderItems[idx][field] = el.value;
    });
  });
  wrap.querySelectorAll('[data-remove]').forEach(el => {
    el.addEventListener('click', () => {
      removeItem(parseInt(el.getAttribute('data-remove'),10));
    });
  });
}
renderItems();
document.getElementById('addItemBtn').addEventListener('click', addItem);
addItem();

// pay method other toggle
const payMethod = document.getElementById('payMethod');
const payOtherWrap = document.getElementById('payOtherWrap');
payMethod.addEventListener('change', () => {
  payOtherWrap.style.display = payMethod.value === '其他' ? 'flex' : 'none';
});

// defaults: order time = now, order no auto-generated
const orderTimeInput = document.getElementById('orderTime');
function pad(n){ return n.toString().padStart(2,'0'); }
const now = new Date();
orderTimeInput.value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;

function formatOrderTime(str){
  if(!str) return '';
  const [datePart, timePart] = str.split('T');
  const [y,m,d] = datePart.split('-');
  return `${y}/${m}/${d} ${timePart}`;
}

function computeOrderData(){
  const name = document.getElementById('customerName').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const plate = document.getElementById('plateNo').value.trim();
  const time = formatOrderTime(orderTimeInput.value);
  const pay = payMethod.value === '其他' ? (document.getElementById('payOther').value.trim() || '其他') : payMethod.value;

  let items = [];
  let itemsSubtotal = 0;

  orderItems.forEach(row => {
    if(!row.name && !row.price) return;
    const qty = parseInt(row.qty,10) || 1;
    const price = parseInt(row.price,10) || 0;
    const subtotal = qty * price;
    itemsSubtotal += subtotal;
    items.push({ name: row.name || '未命名商品', spec: row.spec, qty, price, subtotal, note: row.note });
  });

  const deposit = parseInt(document.getElementById('deposit').value, 10) || 0;
  const balance = itemsSubtotal - deposit;

  return { name, phone, plate, time, pay, items, itemsSubtotal, deposit, balance };
}

document.getElementById('generateBtn').addEventListener('click', () => {
  const data = computeOrderData();
  const { name, phone, plate, time, items, itemsSubtotal, deposit, balance } = data;

  const lines = items.map(it => `📦${it.name}${it.spec ? '('+it.spec+')' : ''} x${it.qty} - ${it.subtotal.toLocaleString('en-US')}`);
  const balanceFormatted = balance.toLocaleString('en-US');
  const depositFormatted = deposit.toLocaleString('en-US');

  const msg =
`您好${name ? ' ' + name + ' ' : '，'}這是您這次的訂購明細

📞電話:${phone}
🏍️車號:${plate}
🕐訂購時間:${time}

${lines.join('\n')}

💰已收訂金: ${depositFormatted}
📌應收款: *${balanceFormatted}*

詳細訂貨單已另外附上，取貨時請攜帶，謝謝您的訂購🙏`;

  document.getElementById('outputText').value = msg;
  document.getElementById('totalAmount').textContent = '$' + balanceFormatted;
  document.getElementById('outputWrap').classList.add('show');
  document.getElementById('outputWrap').scrollIntoView({behavior:'smooth', block:'start'});
});

document.getElementById('copyBtn').addEventListener('click', function(){
  const btn = this;
  const text = document.getElementById('outputText').value;
  navigator.clipboard.writeText(text).then(() => {
    const original = btn.textContent;
    btn.textContent = '已複製 ✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1800);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '已複製 ✓';
    setTimeout(() => { btn.textContent = '複製文字訊息'; }, 1800);
  });
});

document.getElementById('pdfBtn').addEventListener('click', function(){
  const data = computeOrderData();
  if(data.items.length === 0){
    alert('請先至少填一項商品');
    return;
  }

  document.getElementById('dCustomer').textContent = data.name || '—';
  document.getElementById('dPlate').textContent = data.plate || '—';
  document.getElementById('dPhone').textContent = data.phone || '—';
  document.getElementById('dDate').textContent = data.time || '—';
  document.getElementById('dPay').textContent = data.pay || '—';

  const body = document.getElementById('dItemsBody');
  body.innerHTML = '';
  data.items.forEach((it, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i+1}</td><td>${it.name}</td><td>${it.spec || ''}</td><td>${it.qty}</td><td>${it.price.toLocaleString('en-US')}</td><td>${it.subtotal.toLocaleString('en-US')}</td><td>${it.note || ''}</td>`;
    body.appendChild(tr);
  });
  if(data.deposit > 0){
    const tr = document.createElement('tr');
    tr.className = 'deposit-row';
    tr.innerHTML = `<td>${data.items.length+1}</td><td>預付訂金</td><td></td><td>1</td><td>-${data.deposit.toLocaleString('en-US')}</td><td>-${data.deposit.toLocaleString('en-US')}</td><td></td>`;
    body.appendChild(tr);
  }

  document.getElementById('dTotal').textContent = data.balance.toLocaleString('en-US');

  const receipt = document.getElementById('receiptContent');
  receipt.classList.add('show');
  receipt.scrollIntoView({behavior:'smooth', block:'start'});
});
</script>
</body>
</html>
