<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>訂購訂單產生器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F1EA;
    --card: #FFFFFF;
    --ink: #241F1B;
    --sub: #8A8078;
    --line: #E7E0D6;
    --accent: #E0631F;
    --accent-dark: #B84C15;
    --accent-soft: #FBE6D6;
    --ok: #2F7A4D;
    --ok-soft: #E3F0E6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(36,31,27,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
    padding:20px 14px 60px;
  }
  .wrap{max-width:560px;margin:0 auto;}

  header{margin-bottom:20px;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.12em;
    color:var(--accent-dark);
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{
    content:"";
    width:18px;height:2px;background:var(--accent);display:inline-block;
  }
  h1{
    font-size:26px;
    font-weight:900;
    margin:8px 0 4px;
    letter-spacing:0.01em;
  }
  .desc{color:var(--sub);font-size:14px;line-height:1.5;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px;
    margin-bottom:14px;
    box-shadow: 0 1px 2px rgba(36,31,27,0.04);
  }
  .card h2{
    font-size:13px;
    font-weight:700;
    color:var(--accent-dark);
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin:0 0 14px;
    display:flex;
    align-items:center;
    gap:6px;
  }

  .row{display:flex;gap:10px;margin-bottom:10px;}
  .field{flex:1;display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12px;color:var(--sub);font-weight:500;}
  .field input{
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
    background:#FCFAF6;
    width:100%;
  }
  .field input:focus{outline:none;border-color:var(--accent);}

  .item-row{
    border:1.5px dashed var(--line);
    border-radius:12px;
    padding:12px;
    margin-bottom:10px;
    background:#FCFAF6;
  }
  .item-row .row{margin-bottom:8px;}
  .item-row .row:last-child{margin-bottom:0;}
  .item-row .field label{font-size:11px;}
  .remove-btn{
    flex-shrink:0;
    width:36px;height:36px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--sub);
    font-size:14px;
    cursor:pointer;
  }
  .remove-btn:hover{border-color:#C0392B;color:#C0392B;}

  .add-btn{
    width:100%;
    background:#fff;
    border:1.5px dashed var(--accent);
    color:var(--accent-dark);
    border-radius:10px;
    padding:12px;
    font-size:14px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
  }
  .add-btn:hover{background:var(--accent-soft);}

  .generate-btn{
    width:100%;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:16px;
    font-size:16px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:4px;
    transition: transform .1s, background .15s;
  }
  .generate-btn:active{transform:scale(0.98);}
  .generate-btn:hover{background:var(--accent-dark);}

  .output-wrap{display:none;}
  .output-wrap.show{display:block;}
  textarea{
    width:100%;
    min-height:240px;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:14px;
    font-family:'JetBrains Mono', monospace;
    font-size:13.5px;
    line-height:1.7;
    color:var(--ink);
    background:#FCFAF6;
    resize:vertical;
  }
  .total-box{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--ok-soft);
    border:1.5px solid var(--ok);
    border-radius:12px;
    padding:12px 16px;
    margin-top:14px;
  }
  .total-box .label{font-size:13px;color:var(--sub);}
  .total-box .amount{font-size:20px;font-weight:900;color:var(--ok);font-family:'JetBrains Mono', monospace;}
  .copy-btn{
    width:100%;
    background:var(--ok);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:14px;
    font-size:15px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    margin-top:10px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .copy-btn.copied{background:var(--ink);}
  .hint{
    font-size:12px;
    color:var(--sub);
    text-align:center;
    margin-top:8px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">韋德機車精品 · 訂購訂單</div>
    <h1>訂購訂單產生器</h1>
    <div class="desc">填客人資料＋商品明細，自動算總金額，複製貼到 LINE 傳給客人確認。</div>
  </header>

  <div class="card">
    <h2>客人資料</h2>
    <div class="row">
      <div class="field">
        <label>姓名 / 稱呼</label>
        <input type="text" id="customerName" placeholder="不知道可留空">
      </div>
      <div class="field">
        <label>電話</label>
        <input type="text" id="phone" placeholder="例如：0912345678">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>車號</label>
        <input type="text" id="plateNo" placeholder="例如：ABC-1234">
      </div>
      <div class="field">
        <label>訂購時間</label>
        <input type="datetime-local" id="orderTime">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>訂購商品</h2>
    <div id="itemsList"></div>
    <button class="add-btn" id="addItemBtn" type="button">＋ 新增商品</button>
  </div>

  <div class="card">
    <h2>訂金</h2>
    <div class="row">
      <div class="field">
        <label>預收訂金</label>
        <input type="text" inputmode="numeric" id="deposit" placeholder="0">
      </div>
    </div>
  </div>

  <button class="generate-btn" id="generateBtn">
    產生訂單訊息
  </button>

  <div class="output-wrap card" id="outputWrap" style="margin-top:14px;">
    <h2>訂單訊息</h2>
    <textarea id="outputText"></textarea>
    <div class="total-box">
      <div class="label">訂單總金額</div>
      <div class="amount" id="totalAmount">$0</div>
    </div>
    <button class="copy-btn" id="copyBtn">複製訊息</button>
    <div class="hint">複製後貼到 LINE 聊天視窗發送給客人</div>
  </div>
</div>

<script>
let orderItems = [];

function addItem(){
  orderItems.push({ name:'', qty:'', amount:'' });
  renderItems();
}
function removeItem(idx){
  orderItems.splice(idx,1);
  renderItems();
}
function renderItems(){
  const wrap = document.getElementById('itemsList');
  wrap.innerHTML = '';
  orderItems.forEach((row, idx) => {
    const div = document.createElement('div');
    div.className = 'item-row';
    div.innerHTML = `
      <div class="row">
        <div class="field">
          <label>品名 ${idx+1}</label>
          <input type="text" data-idx="${idx}" data-field="name" placeholder="例如：KOSO 快速油封" value="${row.name}">
        </div>
      </div>
      <div class="row">
        <div class="field" style="flex:0.6;">
          <label>數量</label>
          <input type="text" inputmode="numeric" data-idx="${idx}" data-field="qty" placeholder="1" value="${row.qty}">
        </div>
        <div class="field" style="flex:1;">
          <label>金額</label>
          <input type="text" inputmode="numeric" data-idx="${idx}" data-field="amount" placeholder="0" value="${row.amount}">
        </div>
        <button class="remove-btn" data-remove="${idx}" type="button">✕</button>
      </div>
    `;
    wrap.appendChild(div);
  });
  wrap.querySelectorAll('input[data-idx]').forEach(el => {
    el.addEventListener('input', () => {
      const idx = parseInt(el.getAttribute('data-idx'),10);
      const field = el.getAttribute('data-field');
      orderItems[idx][field] = el.value;
    });
  });
  wrap.querySelectorAll('[data-remove]').forEach(el => {
    el.addEventListener('click', () => {
      removeItem(parseInt(el.getAttribute('data-remove'),10));
    });
  });
}

renderItems();
document.getElementById('addItemBtn').addEventListener('click', addItem);
addItem(); // start with one empty row

// default order time = now
const orderTimeInput = document.getElementById('orderTime');
function pad(n){ return n.toString().padStart(2,'0'); }
const now = new Date();
orderTimeInput.value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;

function formatOrderTime(str){
  if(!str) return '';
  const [datePart, timePart] = str.split('T');
  const [y,m,d] = datePart.split('-');
  return `${y}/${m}/${d} ${timePart}`;
}

document.getElementById('generateBtn').addEventListener('click', () => {
  const name = document.getElementById('customerName').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const plate = document.getElementById('plateNo').value.trim();
  const time = formatOrderTime(orderTimeInput.value);

  let lines = [];
  let total = 0;
  let sumParts = [];

  orderItems.forEach(row => {
    if(!row.name && !row.amount) return;
    const qty = parseInt(row.qty,10) || 1;
    const amt = parseInt(row.amount,10) || 0;
    total += amt;
    sumParts.push(amt);
    lines.push(`📦${row.name || '未命名商品'} x${qty} - ${amt}`);
  });

  const totalFormatted = total.toLocaleString('en-US');
  const sumFormula = sumParts.join('+');

  const deposit = parseInt(document.getElementById('deposit').value, 10) || 0;
  const balance = total - deposit;
  const depositFormatted = deposit.toLocaleString('en-US');
  const balanceFormatted = balance.toLocaleString('en-US');

  const msg =
`您好${name ? ' ' + name + ' ' : '，'}這是您訂購的商品明細

📞電話:${phone}
🏍️車號:${plate}
🕐訂購時間:${time}

${lines.join('\n')}

💵總金額: *${totalFormatted}*
💰已收訂金: ${depositFormatted}
📌待付餘款: *${balanceFormatted}*

以上為訂購紀錄，商品到貨會再通知您唷🙏`;

  document.getElementById('outputText').value = msg;
  document.getElementById('totalAmount').textContent = '$' + totalFormatted;
  document.getElementById('outputWrap').classList.add('show');
  document.getElementById('outputWrap').scrollIntoView({behavior:'smooth', block:'start'});
});

document.getElementById('copyBtn').addEventListener('click', function(){
  const btn = this;
  const text = document.getElementById('outputText').value;
  navigator.clipboard.writeText(text).then(() => {
    const original = btn.textContent;
    btn.textContent = '已複製 ✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1800);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '已複製 ✓';
    setTimeout(() => { btn.textContent = '複製訊息'; }, 1800);
  });
});
</script>
</body>
</html>
