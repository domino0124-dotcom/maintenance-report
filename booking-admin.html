<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script data-ver="booking-admin-8">
/* 自動更新：LINE 和 GitHub 會暫存舊頁面，打開時偷偷檢查有沒有新版，有就自動換成新版 */
(function () {
  var me = document.currentScript.getAttribute('data-ver');
  if (/[?&](code|liffClientId|liffRedirectUri)=/.test(location.search)) return;   // LINE 登入中，不要打斷
  try { var last = +sessionStorage.getItem('verChk') || 0; if (Date.now() - last < 20000) return; sessionStorage.setItem('verChk', Date.now()); } catch (e) {}
  fetch(location.pathname + '?nocache=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
    var m = t.match(/data-ver="([^"]+)"/);
    if (!m || m[1] === me) return;
    var q = new URLSearchParams(location.search); q.set('v', m[1]);
    location.replace(location.pathname + '?' + q.toString() + location.hash);
  }).catch(function () {});
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>預約後台｜韋德機車精品</title>
<style>
  :root{--bg:#f5f5f4;--card:#fff;--ink:#1c1917;--muted:#78716c;--line:#e7e5e4;--accent:#ea580c;--soft:#fff1e8;--ok:#16a34a;--okSoft:#dcfce7;--warn:#b45309;--warnSoft:#fef3c7;--danger:#dc2626;--dangerSoft:#fee2e2}
  *{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  button{font-family:inherit;cursor:pointer}
  .top{background:#1c1917;color:#fff;padding:16px 16px 10px;display:flex;justify-content:space-between;align-items:center}
  .brand{font-weight:700;font-size:18px}
  .sub{font-size:12px;opacity:.6;margin-top:2px}
  .topbtns{display:flex;gap:6px}
  .ghost{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:999px;padding:7px 12px;font-size:13px}
  .tabs{display:flex;background:#1c1917;padding:0 12px;position:sticky;top:0;z-index:5}
  .tab{flex:1;background:none;border:0;color:#a8a29e;font-size:15px;padding:12px 0;border-bottom:3px solid transparent}
  .tab.on{color:#fff;border-color:var(--accent);font-weight:600}
  main{padding:12px;max-width:600px;margin:0 auto}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  h2{font-size:15px;margin:0 0 10px}
  .hint{font-size:13px;color:var(--muted);line-height:1.6;margin:6px 0 0}
  .banner{background:var(--dangerSoft);color:var(--danger);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px;font-weight:600}
  /* 日期 */
  .dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
  .date{flex:0 0 auto;min-width:68px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 8px;text-align:center;color:var(--ink);position:relative}
  .date span{display:block;font-size:12px;color:var(--muted)}
  .date b{display:block;font-size:15px;margin-top:2px}
  .date.on{border-color:var(--accent);background:var(--soft)}
  .date.on span,.date.on b{color:var(--accent)}
  .badge{position:absolute;top:-6px;right:-6px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;line-height:20px;border-radius:999px;padding:0 5px}
  .summary{display:flex;gap:8px;margin-bottom:10px}
  .sbox{flex:1;background:#fff;border-radius:12px;padding:10px;text-align:center}
  .sbox b{display:block;font-size:20px}
  .sbox span{font-size:12px;color:var(--muted)}
  /* 預約卡 */
  .bk-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .time{font-size:18px;font-weight:700}
  .time.drop{font-size:15px;color:var(--accent)}
  .svc{font-size:16px;font-weight:600;margin-top:4px}
  .who{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.6}
  .who a{color:var(--accent);font-weight:600;text-decoration:none}
  .note{font-size:13px;background:var(--bg);border-radius:8px;padding:6px 10px;margin-top:8px;color:var(--ink)}
  .tag{font-size:12px;border-radius:999px;padding:3px 10px;white-space:nowrap;font-weight:600}
  .t-已預約{background:var(--soft);color:var(--accent)}
  .t-已完成{background:var(--okSoft);color:var(--ok)}
  .t-未到{background:var(--warnSoft);color:var(--warn)}
  .card.dim{opacity:.6}
  .actions{display:flex;gap:8px;margin-top:12px}
  .btn{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 6px;font-size:14px;color:var(--ink)}
  .btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
  .btn.warn{color:var(--warn);border-color:#fde68a}
  .btn.danger{color:var(--danger);border-color:#fecaca}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;padding:13px;font-size:16px}
  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:15px}
  /* 開關 */
  .switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .switch{position:relative;width:52px;height:30px;flex:0 0 auto}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:#d6d3d1;border-radius:999px;transition:.2s}
  .slider:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch input:checked + .slider{background:var(--ok)}
  .switch input:checked + .slider:before{transform:translateX(22px)}
  /* 表單 */
  .seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:12px}
  .seg button{flex:1;border:0;background:none;border-radius:8px;padding:9px 0;font-size:14px;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
  input,select{display:block;width:100%;margin-top:4px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;font-family:inherit;color:var(--ink);background:#fff;min-height:44px}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  .check{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);margin-bottom:12px}
  .check input{width:20px;height:20px;min-height:0;margin:0}
  .two{display:flex;gap:10px}
  .two label{flex:1}
  .cl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .cl:first-child{border-top:0}
  .cl b{font-size:15px}
  .cl small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
  .del{border:1.5px solid #fecaca;background:#fff;color:var(--danger);border-radius:8px;padding:6px 12px;font-size:13px;flex:0 0 auto}
  /* 登入 */
  .login{max-width:360px;margin:60px auto 0;padding:0 16px}
  .login .card{padding:24px 20px}
  .login h1{font-size:20px;margin:0 0 4px;text-align:center}
  .login p{text-align:center;color:var(--muted);font-size:13px;margin:0 0 20px}
  .lock{width:56px;height:56px;border-radius:50%;background:var(--soft);color:var(--accent);font-size:26px;line-height:56px;text-align:center;margin:0 auto 14px}
  /* 其他 */
  .loading{position:fixed;inset:0;background:rgba(245,245,244,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:20;font-size:14px;color:var(--muted)}
  .spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#1c1917;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:85%;text-align:center}
  .toast.show{opacity:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted)}
  .chip.on{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:600}
  textarea{display:block;width:100%;margin-top:4px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;font-family:inherit;color:var(--ink);background:#fff;resize:none}
  textarea:focus{outline:none;border-color:var(--accent)}
  .newbtn{width:100%;margin-bottom:10px}
  .back{background:none;border:0;color:var(--accent);font-size:15px;padding:4px 0 12px}
  .hidden{display:none!important}
</style>
</head>
<body>

<!-- 登入 -->
<div id="loginView" class="login hidden">
  <div class="card">
    <div class="lock">🔒</div>
    <h1>預約後台</h1>
    <p>韋德機車精品・店家專用</p>
    <label>密碼<input id="pw" type="password" autocomplete="current-password" enterkeyhint="go"></label>
    <button id="loginBtn" class="btn primary" style="width:100%">登入</button>
  </div>
</div>

<!-- 後台 -->
<div id="appView" class="hidden">
  <header class="top">
    <div>
      <div class="brand">預約後台</div>
      <div class="sub" id="updated">韋德機車精品</div>
    </div>
    <div class="topbtns">
      <button class="ghost" id="alertBtn">🔕 提醒關</button>
      <button class="ghost hidden" id="soundBtn">🔇 無聲</button>
      <button class="ghost" id="refreshBtn">↻ 重新整理</button>
      <button class="ghost" id="logoutBtn">登出</button>
    </div>
  </header>
  <nav class="tabs">
    <button class="tab on" id="tabList">預約清單</button>
    <button class="tab" id="tabSched">我的行程</button>
    <button class="tab" id="tabClose">關閉時間</button>
  </nav>

  <main>
    <!-- 預約清單 -->
    <section id="viewList">
      <div id="pausedBanner" class="banner hidden">⏸ 線上預約目前已暫停，客人看不到可預約時段</div>
      <button id="newBtn" class="btn primary newbtn">＋ 代客預約</button>
      <div id="dates" class="dates"></div>
      <div class="summary">
        <div class="sbox"><b id="cntTimed">0</b><span>時段預約</span></div>
        <div class="sbox"><b id="cntDrop">0</b><span>留車</span></div>
        <div class="sbox"><b id="cntDone">0</b><span>已完成</span></div>
      </div>
      <div id="list"></div>
    </section>

    <!-- 代客預約 -->
    <section id="viewNew" class="hidden">
      <button class="back" id="newBack">‹ 返回預約清單</button>
      <div class="card">
        <h2>代客預約</h2>
        <p class="hint" style="margin:-4px 0 12px">不限日期、不受每格上限限制。客人不會收到 LINE 通知，也無法自己改期，請直接告知客人。</p>
        <div class="seg" id="nKindSeg">
          <button data-k="時段" class="on">時段</button>
          <button data-k="留車">大保養（留車）</button>
        </div>
        <label id="nSvcWrap">項目<input id="nService" maxlength="100" placeholder="例：換機油、商品安裝（手機架）"></label>
        <div class="chips" id="nQuick"></div>
        <div class="two">
          <label>日期<input id="nDate" type="date"></label>
          <label id="nTimeWrap">時間<input id="nTime" type="time" step="1800" value="14:00"></label>
        </div>
        <p class="hint" id="nDayHint" style="margin:-4px 0 10px"></p>
        <label>客人姓名（選填）<input id="nName" maxlength="20"></label>
        <label>電話（選填）<input id="nPhone" type="tel" inputmode="numeric" maxlength="12" placeholder="0912345678"></label>
        <div class="two">
          <label>車種（選填）<input id="nModel" maxlength="20" placeholder="JET SL"></label>
          <label>車號（選填）<input id="nPlate" maxlength="12" autocapitalize="characters" placeholder="ABC-1234"></label>
        </div>
        <label>備註（選填）<textarea id="nNote" rows="2" maxlength="200"></textarea></label>
        <button id="nSubmit" class="btn primary" style="width:100%">建立預約</button>
      </div>
    </section>

    <!-- 我的行程 -->
    <section id="viewSched" class="hidden">
      <div class="card">
        <h2>新增行程</h2>
        <p class="hint" style="margin:-4px 0 12px">存到你的私人行事曆，早上 8 點會一起推播。</p>
        <div class="chips" id="sQuick" style="margin:0 0 12px"></div>
        <label id="sItemWrap" class="hidden">項目名稱<input id="sItem" maxlength="30" placeholder="例：水費已繳費、保險費"></label>
        <div class="two hidden" id="sPayWrap">
          <label><span id="sPlaceLabel">哪裡的</span><input id="sPlace" maxlength="30"></label>
          <label>金額<input id="sAmount" inputmode="numeric" maxlength="10" placeholder="例：1250"></label>
        </div>
        <label>內容<input id="sTitle" maxlength="100" placeholder="點上面常用，或自己輸入"></label>
        <label>日期<input id="sDate" type="date"></label>
        <p class="hint" id="sDayHint" style="margin:-4px 0 10px"></p>
        <div class="check"><input type="checkbox" id="sAllDay"><span>整天</span></div>
        <div class="two" id="sTimeWrap">
          <label>開始<input id="sStart" type="time" step="900" value="14:00"></label>
          <label>結束<input id="sEnd" type="time" step="900" value="15:00"></label>
        </div>
        <label>備註（選填）<textarea id="sNote" rows="2" maxlength="500"></textarea></label>
        <button id="sAdd" class="btn primary" style="width:100%">加入行事曆</button>
      </div>
      <div class="card">
        <h2>接下來的行程</h2>
        <div id="sList"><p class="hint">讀取中…</p></div>
      </div>
    </section>

    <!-- 關閉時間 -->
    <section id="viewClose" class="hidden">
      <div class="card">
        <div class="switch-row">
          <div>
            <h2 style="margin:0">開放線上預約</h2>
            <p class="hint" id="openHint"></p>
          </div>
          <label class="switch" style="margin:0"><input type="checkbox" id="openSwitch"><span class="slider"></span></label>
        </div>
      </div>

      <div class="card">
        <h2>新增關閉時間</h2>
        <div class="seg" id="kindSeg">
          <button data-k="date" class="on">指定日期</button>
          <button data-k="week">每週</button>
          <button data-k="daily">每天</button>
        </div>
        <label id="dateWrap">日期<input id="cDate" type="date"></label>
        <label id="wdWrap" class="hidden">星期
          <select id="cWd">
            <option value="1">週一</option><option value="2">週二</option><option value="3">週三</option>
            <option value="4">週四</option><option value="5">週五</option><option value="6">週六</option><option value="0">週日</option>
          </select>
        </label>
        <div class="check" id="fullWrap"><input type="checkbox" id="cFull"><span>整天關閉</span></div>
        <div class="two" id="timeWrap">
          <label>開始<input id="cFrom" type="time" step="1800" value="18:00"></label>
          <label>結束<input id="cTo" type="time" step="1800" value="19:00"></label>
        </div>
        <label>備註（選填）<input id="cNote" maxlength="50" placeholder="例：外出送件、吃飯"></label>
        <button id="addClose" class="btn primary" style="width:100%">新增關閉</button>
      </div>

      <div class="card">
        <h2>目前的關閉時間</h2>
        <div id="closedList"></div>
      </div>
    </section>
  </main>
</div>

<div id="loading" class="loading hidden"><div class="spin"></div><div id="loadingText">載入中…</div></div>
<div id="toast" class="toast"></div>

<div id="verTag" style="text-align:center;font-size:11px;color:#9aa0ab;opacity:.7;padding:8px 0 calc(90px + env(safe-area-inset-bottom))">booking-admin v8</div>
<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzd7nyjqzMbGH1WUxBBNqbCrVibCmZEPAMzaGPtkuF0n8TR_Zsovu-7aYM02SGTmPV4UQ/exec';
const WD = ['日','一','二','三','四','五','六'];
const $ = id => document.getElementById(id);
let token = '', data = null, selDate = '', kind = 'date';

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function loading(on, text){ $('loading').classList.toggle('hidden', !on); if (text) $('loadingText').textContent = text; }
let tt; function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600); }
function wdOf(d){ const [y,m,dd] = d.split('-').map(Number); return new Date(Date.UTC(y,m-1,dd)).getUTCDay(); }
function md(d){ const [, m, dd] = d.split('-').map(Number); return `${m}/${dd}`; }
function addDays(d, n){ const [y,m,dd] = d.split('-').map(Number); return new Date(Date.UTC(y,m-1,dd+n)).toISOString().slice(0,10); }
function getTok(){ try { return localStorage.getItem('wade_admin_token') || ''; } catch(e){ return ''; } }
function setTok(t){ try { t ? localStorage.setItem('wade_admin_token', t) : localStorage.removeItem('wade_admin_token'); } catch(e){} }

async function api(type, payload = {}, retried){
  const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ type, token, ...payload }) });
  const j = await res.json();
  if (!j.ok){
    if (j.error === 'LOGIN_REQUIRED'){
      // 提醒模式（電腦一直開著）：登入過期就用這台電腦記住的密碼自動重新登入
      const pw = alertPw();
      if (!retried && pw && type !== 'booking_admin_login'){
        try {
          const r = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ type: 'booking_admin_login', password: pw }) }).then(x => x.json());
          if (r.ok){ token = r.token; setTok(token); return api(type, payload, true); }
        } catch (e){}
      }
      showLogin('登入已過期，請重新登入'); throw new Error('LOGIN_REQUIRED');
    }
    throw new Error(j.error || '發生錯誤');
  }
  return j;
}

/* ---------- 登入 ---------- */
function showLogin(msg){
  token = ''; setTok('');
  $('appView').classList.add('hidden');
  $('loginView').classList.remove('hidden');
  if (msg) toast(msg);
  setTimeout(() => $('pw').focus(), 100);
}
async function doLogin(){
  const pw = $('pw').value;
  if (!pw) return toast('請輸入密碼');
  loading(true, '登入中…');
  try {
    const r = await api('booking_admin_login', { password: pw });
    token = r.token; setTok(token); $('pw').value = '';
    $('loginView').classList.add('hidden');
    $('appView').classList.remove('hidden');
    await load();
    startTab();
  } catch (e){ if (e.message !== 'LOGIN_REQUIRED') toast(e.message); }
  finally { loading(false); }
}
// 網址帶 ?tab=sched（LINE 功能選單「新增行程」）→ 直接打開我的行程
function startTab(){
  const t = new URLSearchParams(location.search).get('tab');
  if (t === 'sched'){ showTab('sched'); openSched(); setTimeout(() => $('sTitle').focus(), 300); }
  else if (t === 'close') showTab('close');
}
$('loginBtn').onclick = doLogin;
$('pw').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
$('logoutBtn').onclick = async () => {
  if (!confirm('確定登出？')) return;
  try { await api('booking_admin_logout'); } catch(e){}
  try { localStorage.removeItem('bk_admin_cache'); } catch(e){}
  showLogin();
};

/* ---------- 讀資料 ---------- */
// 加速：先秀這支手機記住的清單，背景再更新；按鈕先改畫面，背景再存
let bkPend = 0;
function bkSave(){ try { localStorage.setItem('bk_admin_cache', JSON.stringify(data)); } catch(e){} }
async function load(silent){
  if (!silent && !data){
    try { const c = JSON.parse(localStorage.getItem('bk_admin_cache') || 'null'); if (c && c.list){ data = c; if (!selDate) selDate = data.today; renderAll(); silent = true; } } catch(e){}
  }
  if (!silent) loading(true, '讀取中…');
  try {
    const fresh = await api('booking_admin_list');
    if (bkPend) return;                      // 還有按鈕在背景存，等存完再更新
    if (data && selDate === data.today) selDate = fresh.today;   // 跨天了，跟著換到今天
    data = fresh; bkSave();
    if (!selDate) selDate = data.today;
    const now = new Date();
    $('updated').textContent = `更新於 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    renderAll();

/* ---------- 🔔 新預約提醒（電腦開著這頁就會響） ---------- */
// 每 1 分鐘檢查一次（只在營業時間）；有新預約 → 叮咚一聲＋紅色橫幅＋桌面通知（橫幅按「知道了」才收起來）
const ALERT_KEY = 'bk_alert_on', SEEN_KEY = 'bk_seen_ids', PW_KEY = 'bk_alert_pw';
let alertOn = false, audioCtx = null, ringTimer = null, titleTimer = null, pollTimer = null;
function alertPw(){ try { return localStorage.getItem(PW_KEY) || ''; } catch (e){ return ''; } }
function getSeen(){ try { return JSON.parse(localStorage.getItem(SEEN_KEY) || 'null'); } catch (e){ return null; } }
function setSeen(ids){ try { localStorage.setItem(SEEN_KEY, JSON.stringify(ids)); } catch (e){} }

// 柔和的「叮咚」（像門鈴），不是刺耳的嗶嗶聲
// 提醒聲音：無聲／叮咚／鈴鐺／語音播報（語音會直接念出預約內容，放音樂時也聽得出來）
const SOUNDS = [
  { k: 'off',   label: '🔇 無聲' },
  { k: 'dong',  label: '🔔 叮咚' },
  { k: 'bell',  label: '🛎️ 櫃檯鈴' },
  { k: 'voice', label: '🗣️ 語音' }
];
let soundMode = 'off';
try { soundMode = localStorage.getItem('bk_alert_sound2') || 'off'; } catch (e){}
let soundOn = soundMode !== 'off';
function tone(t, f, dur, vol, type){
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, audioCtx.currentTime + t);
  g.gain.exponentialRampToValueAtTime(vol, audioCtx.currentTime + t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + dur + 0.05);
}
function beep(speech){
  if (soundMode === 'off') return;
  if (soundMode === 'voice'){
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(speech || '有新預約');
      u.lang = 'zh-TW'; u.rate = 0.95; u.volume = 1;
      // 先叮一聲再念，比較不會被音樂蓋過
      if (audioCtx){ tone(0, 1175, 0.5, 0.5); tone(0.18, 1568, 0.7, 0.5); }
      setTimeout(() => speechSynthesis.speak(u), 700);
    } catch (e){}
    return;
  }
  if (!audioCtx) return;
  if (soundMode === 'bell'){
    // 櫃檯服務鈴：叮～叮～（兩次，高音、帶泛音）
    [0, 0.6].forEach(t => { tone(t, 2093, 1.2, 0.45); tone(t, 4186, 0.6, 0.12); tone(t, 2637, 0.9, 0.15); });
    return;
  }
  // 叮咚（門鈴），比之前大聲，連響兩次
  [0, 1.4].forEach(t => { tone(t, 988, 1.1, 0.5); tone(t + 0.45, 784, 1.3, 0.5); });
}
function speakText(list){
  // 「有新預約，明天下午一點，換機油」
  const b = list[0]; if (!b) return '有新預約';
  const today = data && data.today;
  const day = b.date === today ? '今天' : (b.date === addDays(today, 1) ? '明天' : `${+b.date.slice(5,7)}月${+b.date.slice(8)}號`);
  let when = '留車';
  if (b.kind !== '留車' && b.time){
    const [h, m] = b.time.split(':').map(Number);
    when = (h < 12 ? '上午' : h < 18 ? '下午' : '晚上') + ((h % 12) || 12) + '點' + (m ? (m === 30 ? '半' : m + '分') : '');
  }
  return `有新預約，${day}${when}，${b.service}` + (list.length > 1 ? `，還有另外${list.length - 1}筆` : '');
}
function ring(title, lines, speech){
  // 紅色橫幅
  let bar = $('alertBar');
  if (!bar){
    bar = document.createElement('div'); bar.id = 'alertBar';
    bar.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:50;background:#dc2626;color:#fff;padding:14px 16px;box-shadow:0 6px 20px rgba(0,0,0,.25)';
    document.body.appendChild(bar);
  }
  bar.innerHTML = `<div style="max-width:600px;margin:0 auto"><div style="font-size:18px;font-weight:800">🔔 ${esc(title)}</div>
    <div style="font-size:15px;line-height:1.6;margin-top:6px;white-space:pre-line">${esc(lines.join('\n'))}</div>
    <button id="ackBtn" style="margin-top:10px;width:100%;border:0;border-radius:10px;padding:12px;font-size:16px;font-weight:700;background:#fff;color:#dc2626">知道了</button></div>`;
  $('ackBtn').onclick = stopRing;
  // 響一次就好（不會一直響）；紅色橫幅和通知會留著，等你按「知道了」
  clearInterval(ringTimer); beep(speech);
  // 分頁標題閃
  clearInterval(titleTimer); let f = false;
  titleTimer = setInterval(() => { document.title = (f = !f) ? '🔔 ' + title + '！' : '預約後台｜韋德機車精品'; }, 1000);
  // 桌面通知（電腦右下角）
  try { if (window.Notification && Notification.permission === 'granted') new Notification('🔔 ' + title, { body: lines.join('\n'), requireInteraction: true, silent: !soundOn }); } catch (e){}
}
function stopRing(){
  clearInterval(ringTimer); clearInterval(titleTimer);
  document.title = '預約後台｜韋德機車精品';
  const bar = $('alertBar'); if (bar) bar.remove();
}
function bkLine(b){ return `${md(b.date)}（${WD[wdOf(b.date)]}）${b.kind === '留車' ? '留車' : b.time}　${b.service}｜${[b.name, b.phone].filter(Boolean).join(' ')}`; }
function checkNew(){
  if (!alertOn || !data || !data.list) return;
  // 記住每筆預約的「日期 時間」：新出現 → 新預約；日期時間變了 → 客人改期
  const now = {}; data.list.forEach(b => { now[b.id] = b.date + ' ' + (b.time || ''); });
  let seen = getSeen();
  if (!seen || Array.isArray(seen)){ setSeen(now); return; }   // 第一次：現有的都當作看過了
  const added = data.list.filter(b => !(b.id in seen));
  const moved = data.list.filter(b => (b.id in seen) && seen[b.id] !== now[b.id]);
  setSeen(now);
  const lines = [...added.map(b => '🆕 ' + bkLine(b)), ...moved.map(b => '🔄 改期：' + bkLine(b))];
  if (lines.length) ring(added.length ? `新預約 ${added.length} 筆` + (moved.length ? `、改期 ${moved.length} 筆` : '') : `客人改期 ${moved.length} 筆`, lines,
    added.length ? speakText(added) : speakText(moved).replace('有新預約', '有客人改期'));
}
function setAlert(on){
  alertOn = on;
  try { localStorage.setItem(ALERT_KEY, on ? '1' : ''); } catch (e){}
  $('alertBtn').textContent = on ? '🔔 提醒開' : '🔕 提醒關';
  $('soundBtn').classList.toggle('hidden', !on);
  $('soundBtn').textContent = SOUNDS.find(x => x.k === soundMode).label;
  $('alertBtn').style.background = on ? '#16a34a' : '';
  clearInterval(pollTimer);
  if (on){
    // 1 分鐘檢查一次，只在營業時間（12:00～22:30）檢查；晚上客人預約的，隔天開店第一次檢查就會跳出來
    pollTimer = setInterval(() => {
      const h = new Date().getHours() + new Date().getMinutes() / 60;
      if (token && h >= 12 && h <= 22.5) load(true).then(checkNew);
    }, 60000);
    if (data) checkNew();
  }
}
// 聲音預設關（電腦在放音樂）；只要畫面提醒＋右下角通知。想要聲音再按這顆打開
$('soundBtn').onclick = () => {
  // 按一下換下一種聲音，並試播一次
  const idx = SOUNDS.findIndex(x => x.k === soundMode);
  soundMode = SOUNDS[(idx + 1) % SOUNDS.length].k; soundOn = soundMode !== 'off';
  try { localStorage.setItem('bk_alert_sound2', soundMode); } catch (e){}
  $('soundBtn').textContent = SOUNDS.find(x => x.k === soundMode).label;
  if (soundOn){ try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e){} beep('這是測試聲音，有新預約的時候會像這樣提醒你'); }
  toast(soundOn ? '試播中：' + SOUNDS.find(x => x.k === soundMode).label + '（再按一下換下一種）' : '已改成無聲，只有畫面和通知');
};
$('alertBtn').onclick = async () => {
  if (alertOn){ setAlert(false); stopRing(); toast('已關閉新預約提醒'); return; }
  // 需要按一下才能開聲音和桌面通知（瀏覽器規定）
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); await audioCtx.resume(); } catch (e){}
  try { if (window.Notification && Notification.permission === 'default') await Notification.requestPermission(); } catch (e){}
  if (!alertPw() && confirm('這台電腦要一直開著提醒的話，要記住後台密碼嗎？\n（登入過期時會自動重新登入，不會中斷提醒）')){
    const pw = prompt('請輸入預約後台密碼');
    if (pw) try { localStorage.setItem(PW_KEY, pw); } catch (e){}
  }
  setSeen(null); try { localStorage.removeItem(SEEN_KEY); } catch (e){}
  setAlert(true);
  toast('🔔 已開啟：有新預約會跳紅色橫幅＋右下角通知（預設無聲）。這個分頁不要關');
};
// 重新整理頁面後，提醒維持開著（聲音要再點一下畫面才會恢復，瀏覽器規定）
document.addEventListener('click', () => {
  if (alertOn && !audioCtx){ try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e){} }
}, { once: false });

/* ---------- 啟動 ---------- */
(function init(){
  const t = new Date();
  $('cDate').value = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
  token = getTok();
  if (!token) return showLogin();
  $('appView').classList.remove('hidden');
  load().then(() => { try { if (localStorage.getItem(ALERT_KEY)) { setAlert(true); toast(soundOn ? '🔔 提醒開著，點一下畫面讓聲音生效' : '🔔 提醒開著'); } } catch (e){} });
  startTab();
})();

// 回到畫面時自動更新
document.addEventListener('visibilitychange', () => { if (!document.hidden && token && data) load(true); });
</script>
</body>
</html>
