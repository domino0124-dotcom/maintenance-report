<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>韋德價目查詢 v5</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#121212);--ink:light-dark(#151515,#f1f1f1);--sub:light-dark(#666,#aaa);--line:light-dark(#e6e6e6,#2a2a2a);--red:#d7131f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC",system-ui,sans-serif}
#lock{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
form{width:100%;max-width:340px;text-align:center}
h1{font-size:24px;font-weight:900;margin:0 0 4px}
p{color:var(--sub);font-size:14px;margin:0 0 18px}
input[type=password]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);text-align:center;letter-spacing:.1em}
input:focus{outline:none;border-color:var(--red)}
label{display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px;margin:12px 0;color:var(--sub)}
button{width:100%;font:inherit;font-weight:700;font-size:17px;border:0;border-radius:12px;padding:12px;background:var(--red);color:#fff;min-height:48px}
#err{color:var(--red);font-size:14px;min-height:1.5em;margin-top:8px}
#app{display:none;flex-direction:column;height:100%}
nav{display:flex;border-bottom:1px solid var(--line);flex:none}
nav button{flex:1;padding:0 2px;font-size:14px;border-radius:0;background:transparent;color:var(--sub);font-size:16px;border-bottom:3px solid transparent;min-height:46px}
nav button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--red)}
nav .out{flex:none;width:auto;padding:0 8px;font-size:12px;font-weight:400}
nav{overflow-x:auto}
iframe{flex:1;border:0;width:100%;display:none}
iframe.on{display:block}
</style>
</head>
<body>
<div id="lock">
  <form id="f">
    <h1>韋德價目查詢</h1>
    <p>aRacer・輪胎・前叉・鯊魚工廠　請輸入密碼</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="密碼" required>
    <label><input id="rem" type="checkbox" checked>這台手機記住密碼</label>
    <button type="submit" id="go">打開</button>
    <div id="err"></div>
  </form>
</div>
<div id="app">
  <nav id="tabs">
    <button type="button" data-t="aracer" aria-pressed="true">aRacer</button>
    <button type="button" data-t="pirelli" aria-pressed="false">倍耐力</button>
    <button type="button" data-t="dunlop" aria-pressed="false">登路普</button>
    <button type="button" data-t="fork" aria-pressed="false">前叉</button>
    <button type="button" data-t="shock" aria-pressed="false">鯊魚</button>
    <button type="button" class="out" id="out">登出</button>
  </nav>
  <iframe id="aracer" class="on" title="aRacer"></iframe>
  <iframe id="pirelli" title="倍耐力輪胎"></iframe>
  <iframe id="dunlop" title="登路普輪胎"></iframe>
  <iframe id="fork" title="前叉內管"></iframe>
  <iframe id="shock" title="鯊魚工廠"></iframe>
</div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const K='wade_price_pw';
async function open(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(B.s),iterations:B.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(B.i)},key,b64(B.d));
  return JSON.parse(new TextDecoder().decode(pt));
}
function show(d){
  document.getElementById('aracer').srcdoc=d.aracer;
  document.getElementById('pirelli').srcdoc=d.pirelli;
  document.getElementById('dunlop').srcdoc=d.dunlop;
  document.getElementById('fork').srcdoc=d.fork;
  document.getElementById('shock').srcdoc=d.shock;
  document.getElementById('lock').style.display='none';
  document.getElementById('app').style.display='flex';
  let t='aracer';try{t=localStorage.getItem('wade_price_tab')||t}catch(e){}
  tab(t);
}
function tab(t){
  for(const b of document.querySelectorAll('#tabs [data-t]'))b.setAttribute('aria-pressed',b.dataset.t===t);
  for(const f of document.querySelectorAll('iframe'))f.classList.toggle('on',f.id===t);
  try{localStorage.setItem('wade_price_tab',t)}catch(e){}
}
const err=document.getElementById('err'),go=document.getElementById('go');
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();err.textContent='';go.disabled=true;go.textContent='解鎖中…';
  const pw=document.getElementById('pw').value;
  try{const d=await open(pw);
    try{if(document.getElementById('rem').checked)localStorage.setItem(K,pw);else localStorage.removeItem(K)}catch(e){}
    show(d);
  }catch(e){err.textContent='密碼錯誤';}
  go.disabled=false;go.textContent='打開';
});
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)tab(b.dataset.t)});
document.getElementById('out').addEventListener('click',()=>{try{localStorage.removeItem(K)}catch(e){}location.reload()});
(async()=>{let pw=null;try{pw=localStorage.getItem(K)}catch(e){}
  if(pw){try{show(await open(pw))}catch(e){try{localStorage.removeItem(K)}catch(e){}}}})();
}
</script>
