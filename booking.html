<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>線上預約｜韋德機車精品</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{--bg:#f5f5f4;--card:#fff;--ink:#1c1917;--muted:#78716c;--line:#e7e5e4;--accent:#ea580c;--soft:#fff1e8;--ok:#16a34a;--danger:#dc2626}
  *{-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(92px + env(safe-area-inset-bottom))}
  button{font-family:inherit;cursor:pointer}
  .top{background:#1c1917;color:#fff;padding:18px 16px 12px}
  .brand{font-weight:700;font-size:18px;letter-spacing:.5px}
  .sub{font-size:13px;opacity:.65;margin-top:2px}
  .tabs{display:flex;background:#1c1917;padding:0 12px;position:sticky;top:0;z-index:5}
  .tab{flex:1;background:none;border:0;color:#a8a29e;font-size:15px;padding:12px 0;border-bottom:3px solid transparent}
  .tab.on{color:#fff;border-color:var(--accent);font-weight:600}
  main{padding:12px;max-width:560px;margin:0 auto}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  h2{font-size:15px;margin:0 0 10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font-size:15px;color:var(--ink)}
  .chip.on{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:600}
  .chip.sm{padding:6px 12px;font-size:14px;color:var(--muted)}
  .dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .date{flex:0 0 auto;min-width:62px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 6px;text-align:center;color:var(--ink)}
  .date span{display:block;font-size:12px;color:var(--muted)}
  .date b{display:block;font-size:16px;margin-top:2px}
  .date.on{border-color:var(--accent);background:var(--soft)}
  .date.on span,.date.on b{color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .slot{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 0;font-size:15px;color:var(--ink)}
  .slot.on{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600}
  .slot:disabled{color:#d6d3d1;background:#fafaf9;text-decoration:line-through}
  .hint{font-size:13px;color:var(--muted);margin:8px 0 0;line-height:1.6}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
  input,textarea{display:block;width:100%;box-sizing:border-box;margin-top:4px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;font-family:inherit;color:var(--ink);background:#fff;resize:none}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .primary{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:var(--accent);color:#fff;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;box-shadow:0 4px 14px rgba(234,88,12,.35)}
  .primary:disabled{background:#d6d3d1;box-shadow:none}
  .editbar{background:#fef3c7;color:#92400e;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .link{background:none;border:0;color:var(--accent);font-size:14px;padding:0;white-space:nowrap}
  .bk-top{display:flex;justify-content:space-between;align-items:center}
  .bk-top b{font-size:16px}
  .tag{font-size:12px;background:var(--soft);color:var(--accent);border-radius:999px;padding:3px 10px}
  .bk-when{font-size:15px;margin-top:6px;font-weight:600}
  .actions{display:flex;gap:8px;margin-top:12px}
  .btn{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px;font-size:15px;color:var(--ink)}
  .btn.danger{color:var(--danger);border-color:#fecaca}
  .empty{text-align:center;color:var(--muted);padding:48px 0;font-size:15px}
  .done{text-align:center;padding:24px 4px}
  .done .icon{width:64px;height:64px;border-radius:50%;background:#dcfce7;color:var(--ok);font-size:34px;line-height:64px;margin:0 auto 12px}
  .done h2{font-size:20px}
  .summary{text-align:left;background:#fff;border-radius:14px;padding:14px;margin:16px 0;font-size:15px;line-height:1.8;white-space:pre-line}
  .loading{position:fixed;inset:0;background:rgba(245,245,244,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:20;font-size:14px;color:var(--muted)}
  .spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1c1917;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:85%;text-align:center}
  .toast.show{opacity:1}
  .hidden{display:none!important}
</style>
</head>
<body>

<header class="top">
  <div class="brand">韋德機車精品</div>
  <div class="sub">線上預約</div>
</header>
<nav class="tabs">
  <button id="tabNew" class="tab on">新預約</button>
  <button id="tabMine" class="tab">我的預約</button>
</nav>

<main id="main">
  <!-- 新預約 -->
  <section id="viewNew">
    <div id="editBar" class="editbar hidden">
      <span>正在改期：<span id="editLabel"></span></span>
      <button id="editCancel" class="link">放棄改期</button>
    </div>

    <div class="card">
      <h2>1. 選擇項目 <span style="font-weight:400;font-size:12px;color:var(--muted)">可複選</span></h2>
      <div id="services" class="chips"></div>
      <div id="otherBox" class="hidden" style="margin-top:14px">
        <label>要檢查的問題<input id="fOther" maxlength="60" placeholder="例：煞車異音、怠速不穩"></label>
      </div>
    </div>

    <div class="card">
      <h2>2. 選擇日期</h2>
      <div id="dates" class="dates"></div>
    </div>

    <div class="card" id="slotCard">
      <h2>3. 選擇時段</h2>
      <div id="slots" class="grid"></div>
      <p id="slotHint" class="hint">請先選擇日期</p>
    </div>

    <div class="card hidden" id="dropCard">
      <h2>3. 留車說明</h2>
      <p id="dropHint" class="hint"></p>
    </div>

    <div class="card">
      <h2>4. 聯絡資料</h2>
      <label>姓名<input id="fName" maxlength="20" autocomplete="name"></label>
      <label>電話<input id="fPhone" type="tel" inputmode="numeric" maxlength="12" placeholder="0912345678"></label>
      <label>車型／車牌<input id="fCar" maxlength="30" placeholder="例：JET SL／ABC-1234"></label>
      <label>備註<textarea id="fNote" rows="2" maxlength="200" placeholder="例：指定機油品牌、輪胎尺寸"></textarea></label>
    </div>

    <button id="submit" class="primary" disabled>送出預約</button>
  </section>

  <!-- 我的預約 -->
  <section id="viewMine" class="hidden">
    <div id="mineList"></div>
  </section>

  <!-- 完成 -->
  <section id="viewDone" class="hidden">
    <div class="done">
      <div class="icon">✓</div>
      <h2 id="doneTitle">預約成功</h2>
      <p class="hint">如有需要調整，我們會用電話或 LINE 跟你聯絡</p>
      <div id="doneSummary" class="summary"></div>
      <div class="actions">
        <button class="btn" id="doneMine">查看我的預約</button>
        <button class="btn" id="doneClose">關閉</button>
      </div>
    </div>
  </section>
</main>

<div id="loading" class="loading"><div class="spin"></div><div id="loadingText">載入中…</div></div>
<div id="toast" class="toast"></div>

<script>
/* ====== 設定：換成你的 LIFF ID ====== */
const LIFF_ID = '2010744078-CKxuCGOl';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzd7nyjqzMbGH1WUxBBNqbCrVibCmZEPAMzaGPtkuF0n8TR_Zsovu-7aYM02SGTmPV4UQ/exec';
/* =================================== */

const WD = ['日','一','二','三','四','五','六'];
const $ = id => document.getElementById(id);
let cfg = null, idToken = '', editing = null, slotCache = {};
let st = { mode: '', service: '', picks: [], date: '', time: '' };

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function loading(on, text){ $('loading').classList.toggle('hidden', !on); if (text) $('loadingText').textContent = text; }
let toastTimer;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800); }
function fmtDate(d){ const [y,m,dd] = d.split('-').map(Number); return `${m}/${dd}（${WD[new Date(Date.UTC(y,m-1,dd)).getUTCDay()]}）`; }
function isDrop(){ return st.mode === 'dropoff'; }
function isOther(s){ return s.includes('其他'); }
function needOther(){ return st.mode === 'timed' && st.picks.some(isOther); }
function serviceText(){
  const o = $('fOther').value.trim();
  return st.picks.map(p => isOther(p) && o ? `${p}（${o}）` : p).join('、');
}
function whenText(b){ return b.kind === '留車' ? '留車（營業時間內送車）' : b.time; }
function summary(b){
  return `項目：${b.service}\n日期：${fmtDate(b.date)}\n時段：${whenText(b)}\n姓名：${b.name}\n電話：${b.phone}`
    + (b.car ? `\n車型：${b.car}` : '') + (b.note ? `\n備註：${b.note}` : '');
}

async function api(type, data = {}){
  const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ type, idToken, ...data }) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || '發生錯誤，請稍後再試');
  return j;
}

/* ---------- 畫面切換 ---------- */
function show(view){
  ['New','Mine','Done'].forEach(v => $('view'+v).classList.toggle('hidden', v.toLowerCase() !== view));
  $('tabNew').classList.toggle('on', view === 'new');
  $('tabMine').classList.toggle('on', view === 'mine');
  window.scrollTo(0, 0);
}

/* ---------- 項目（時段項目可複選，留車項目單選） ---------- */
function renderServices(){
  const items = [
    ...cfg.timed.filter(s => !isOther(s)).map(s => ({ m: 'timed', s, label: s })),
    ...cfg.dropoff.map(s => ({ m: 'dropoff', s, label: s + '（留車）' })),
    ...cfg.timed.filter(isOther).map(s => ({ m: 'timed', s, label: s }))
  ];
  const isOn = x => x.m === st.mode && (x.m === 'timed' ? st.picks.includes(x.s) : x.s === st.service);
  $('services').innerHTML = items.map((x, i) =>
    `<button class="chip${isOn(x) ? ' on' : ''}" data-i="${i}">${esc(x.label)}</button>`).join('');
  $('services').querySelectorAll('.chip').forEach(b => b.onclick = () => {
    const x = items[b.dataset.i];
    if (x.m === 'dropoff'){
      st.mode = 'dropoff'; st.service = x.s; st.picks = [];
    } else {
      if (st.mode !== 'timed'){ st.mode = 'timed'; st.service = ''; st.picks = []; }
      st.picks = st.picks.includes(x.s) ? st.picks.filter(p => p !== x.s) : [...st.picks, x.s];
      if (!st.picks.length) st.mode = '';
    }
    renderServices(); refreshTime();
  });
  $('otherBox').classList.toggle('hidden', !needOther());
}

/* ---------- 日期 ---------- */
function renderDates(){
  if (!cfg.dates.length){ $('dates').innerHTML = '<p class="hint">目前沒有可預約的日期</p>'; return; }
  $('dates').innerHTML = cfg.dates.map(d => {
    const [, m, dd] = d.date.split('-').map(Number);
    return `<button class="date${st.date === d.date ? ' on' : ''}" data-d="${d.date}"><span>週${WD[d.wd]}</span><b>${m}/${dd}</b></button>`;
  }).join('');
  $('dates').querySelectorAll('.date').forEach(b => b.onclick = () => {
    st.date = b.dataset.d; renderDates(); refreshTime();
  });
}

/* ---------- 時段 / 留車 ---------- */
async function refreshTime(){
  const drop = isDrop(st.service);
  $('slotCard').classList.toggle('hidden', drop);
  $('dropCard').classList.toggle('hidden', !drop);

  if (drop){
    st.time = '';
    const d = cfg.dates.find(x => x.date === st.date);
    $('dropHint').textContent = d
      ? `${fmtDate(d.date)} 營業時間 ${d.open}–${d.close}，這段時間內把車送來即可，完成後會通知你取車。`
      : '請先選擇日期。';
    updateSubmit(); return;
  }
  if (!st.date){ $('slots').innerHTML = ''; $('slotHint').textContent = '請先選擇日期'; updateSubmit(); return; }

  if (slotCache[st.date]){ renderSlots(slotCache[st.date]); return; }
  $('slots').innerHTML = ''; $('slotHint').textContent = '讀取時段中…'; updateSubmit();
  const reqDate = st.date;
  try {
    const r = await api('booking_slots', { date: reqDate, excludeId: editing ? editing.id : '' });
    slotCache[reqDate] = r.slots;
    if (reqDate === st.date && !isDrop(st.service)) renderSlots(r.slots);
  } catch (e){ $('slotHint').textContent = e.message; }
}

function renderSlots(slots){
  if (!slots.length){
    st.time = ''; $('slots').innerHTML = '';
    $('slotHint').textContent = '這天已沒有可預約的時段，請選其他日期';
    updateSubmit(); return;
  }
  if (st.time && !slots.some(s => s.time === st.time && s.available)) st.time = '';
  $('slots').innerHTML = slots.map(s =>
    `<button class="slot${st.time === s.time ? ' on' : ''}" data-t="${s.time}" ${s.available ? '' : 'disabled'}>${s.time}</button>`).join('');
  $('slotHint').textContent = `每格 ${cfg.slotMin} 分鐘，請在預約時間到店`;
  $('slots').querySelectorAll('.slot').forEach(b => b.onclick = () => { st.time = b.dataset.t; renderSlots(slots); });
  updateSubmit();
}

function updateSubmit(){
  const otherOk = !needOther() || $('fOther').value.trim();
  $('submit').disabled = !(st.mode && st.date && (isDrop() || (st.time && st.picks.length && otherOk)));
  $('submit').textContent = editing ? '確認改期' : '送出預約';
}

/* ---------- 送出 ---------- */
$('submit').onclick = async () => {
  const f = {
    name: $('fName').value.trim(),
    phone: $('fPhone').value.replace(/[\s-]/g, ''),
    car: $('fCar').value.trim(),
    note: $('fNote').value.trim()
  };
  if (!f.name) return toast('請填寫姓名');
  if (!/^0\d{8,9}$/.test(f.phone)) return toast('請填寫正確的電話');
  if (!isDrop() && !st.picks.length) return toast('請選擇項目');
  if (needOther() && !$('fOther').value.trim()) return toast('請簡單描述要檢查的問題');

  const payload = { ...f, mode: st.mode, service: isDrop() ? st.service : serviceText(),
                    date: st.date, time: isDrop() ? '' : st.time };
  const isEdit = !!editing;
  loading(true, isEdit ? '改期中…' : '送出中…');
  try {
    const r = isEdit
      ? await api('booking_update', { ...payload, id: editing.id })
      : await api('booking_create', payload);
    saveLocal(f);
    const title = isEdit ? '改期完成' : '預約成功';
    await sendChat(`【${title}】\n${summary(r.booking)}`);
    resetForm();
    $('doneTitle').textContent = title;
    $('doneSummary').textContent = summary(r.booking);
    show('done');
  } catch (e){
    toast(e.message);
    slotCache = {};
    refreshTime();
  } finally {
    loading(false);
  }
};

async function sendChat(text){
  try {
    if (liff.isInClient() && liff.getContext() && liff.getContext().type !== 'none'){
      await liff.sendMessages([{ type: 'text', text }]);
    }
  } catch (e){ /* 傳不出去也不影響預約 */ }
}

/* ---------- 我的預約 ---------- */
async function loadMine(){
  $('mineList').innerHTML = '<div class="empty">讀取中…</div>';
  try {
    const r = await api('booking_mine');
    if (!r.list.length){ $('mineList').innerHTML = '<div class="empty">目前沒有預約</div>'; return; }
    $('mineList').innerHTML = r.list.map((b, i) => `
      <div class="card">
        <div class="bk-top"><b>${esc(b.service)}</b><span class="tag">${b.kind === '留車' ? '留車' : '時段'}</span></div>
        <div class="bk-when">${fmtDate(b.date)} ${esc(whenText(b))}</div>
        <p class="hint">${esc(b.name)}｜${esc(b.phone)}${b.car ? '｜' + esc(b.car) : ''}${b.note ? '<br>備註：' + esc(b.note) : ''}</p>
        <div class="actions">
          <button class="btn" data-i="${i}" data-a="edit">改期</button>
          <button class="btn danger" data-i="${i}" data-a="cancel">取消預約</button>
        </div>
      </div>`).join('');
    $('mineList').querySelectorAll('.btn').forEach(btn => btn.onclick = () => {
      const b = r.list[btn.dataset.i];
      btn.dataset.a === 'edit' ? startEdit(b) : cancelBooking(b);
    });
  } catch (e){
    $('mineList').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

async function cancelBooking(b){
  if (!confirm(`確定取消這筆預約？\n${b.service}｜${fmtDate(b.date)} ${whenText(b)}`)) return;
  loading(true, '取消中…');
  try {
    await api('booking_cancel', { id: b.id });
    await sendChat(`【取消預約】\n${summary(b)}`);
    toast('已取消預約');
    slotCache = {};
    loadMine();
  } catch (e){ toast(e.message); }
  finally { loading(false); }
}

function startEdit(b){
  editing = b;
  slotCache = {};
  const drop = b.kind === '留車';
  const picks = [];
  let other = '';
  if (!drop){
    const otherItem = cfg.timed.find(isOther);
    String(b.service || '').split('、').forEach(part => {
      const m = part.match(/^(.+?)（(.*)）$/);
      const base = m ? m[1] : part;
      if (cfg.timed.includes(base)){ if (!picks.includes(base)) picks.push(base); if (m) other = m[2]; }
      else if (part.trim() && otherItem){ if (!picks.includes(otherItem)) picks.push(otherItem); other = other ? other + '、' + part : part; }
    });
  }
  st = { mode: drop ? 'dropoff' : (picks.length ? 'timed' : ''), service: drop ? b.service : '', picks,
         date: cfg.dates.some(d => d.date === b.date) ? b.date : '', time: b.time || '' };
  $('fOther').value = other;
  $('fName').value = b.name; $('fPhone').value = b.phone; $('fCar').value = b.car || ''; $('fNote').value = b.note || '';
  $('editLabel').textContent = `${b.service} ${fmtDate(b.date)} ${b.kind === '留車' ? '留車' : b.time}`;
  $('editBar').classList.remove('hidden');
  show('new'); renderServices(); renderDates(); refreshTime();
}

function resetForm(){
  editing = null; slotCache = {};
  st = { mode: '', service: '', picks: [], date: '', time: '' };
  $('editBar').classList.add('hidden');
  $('fNote').value = '';
  $('fOther').value = '';
  loadSaved(true);
  renderServices(); renderDates();
  $('slotCard').classList.remove('hidden'); $('dropCard').classList.add('hidden');
  $('slots').innerHTML = ''; $('slotHint').textContent = '請先選擇日期';
  updateSubmit();
}

/* ---------- 記住上次填的資料 ---------- */
function saveLocal(f){ try { localStorage.setItem('wade_booking', JSON.stringify({ name: f.name, phone: f.phone, car: f.car })); } catch (e){} }
function loadSaved(force){
  try {
    const d = JSON.parse(localStorage.getItem('wade_booking') || '{}');
    if (force || !$('fName').value)  $('fName').value  = d.name  || '';
    if (force || !$('fPhone').value) $('fPhone').value = d.phone || '';
    if (force || !$('fCar').value)   $('fCar').value   = d.car   || '';
  } catch (e){}
}

/* ---------- 按鈕 ---------- */
$('tabNew').onclick = () => show('new');
$('tabMine').onclick = () => { show('mine'); loadMine(); };
$('editCancel').onclick = () => resetForm();
$('fOther').oninput = updateSubmit;
$('doneMine').onclick = () => { show('mine'); loadMine(); };
$('doneClose').onclick = () => { if (liff.isInClient()) liff.closeWindow(); else show('new'); };

/* ---------- 啟動 ---------- */
(async function main(){
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()){ liff.login({ redirectUri: location.href }); return; }
    idToken = liff.getIDToken();
    if (!idToken) throw new Error('LIFF 尚未開啟 openid 權限');
    loadSaved();
    cfg = await api('booking_config');
    renderServices(); renderDates(); updateSubmit();
    loading(false);
  } catch (e){
    loading(false);
    $('main').innerHTML = `<div class="empty">無法載入預約系統<br><small>${esc(e.message)}</small></div>`;
  }
})();
</script>
</body>
</html>
