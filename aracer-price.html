<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>aRacer 價目表 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/*
VOICE: 店內查價工具，快、清楚、一眼找到價格
IDEA: 原廠價目表的黃底標頭，變成可搜尋的口袋價目卡
PICTURE: 工具本身就是主體：搜尋框 + 價格欄切換 + 分類 + 清單
COLOUR and TYPE: 白底、價目表黃 #ffe94d、aRacer 紅 #d7131f、簽約欄粉紅；Noto Sans TC
LAYOUT: 置頂搜尋與篩選，下方單欄清單，價格四格對齊
*/
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121212);--ink:light-dark(#151515,#f1f1f1);--sub:light-dark(#666,#aaa);--line:light-dark(#e6e6e6,#2a2a2a);--yel:#ffe94d;--red:#d7131f;--pink:light-dark(#fde3f3,#3a1b30);--card:light-dark(#fafafa,#1b1b1b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip}
header{background:var(--yel);color:#151515;padding:16px max(4vw,14px) 12px}
h1{margin:0;font-size:24px;font-weight:900;line-height:1.15}
h1 b{color:var(--red)}
.meta{font-size:13px;margin-top:4px;color:#3a3a3a}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px max(4vw,14px) 6px}
.search{display:flex;gap:8px}
input{flex:1;font:inherit;font-size:16px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input:focus{outline:none;border-color:var(--red)}
#clr{font:inherit;font-size:14px;border:0;border-radius:12px;padding:0 14px;background:var(--line);color:var(--ink);min-height:44px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:7px 0 1px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:14px;font-weight:500;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;min-height:36px}
.chip[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
#cols .chip[aria-pressed=true]{background:#151515;border-color:#151515}
:root[data-theme=dark] #cols .chip[aria-pressed=true]{background:#f1f1f1;color:#151515}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) #cols .chip[aria-pressed=true]{background:#f1f1f1;color:#151515}}
.lbl{font-size:12px;color:var(--sub);flex:none;align-self:center;margin-right:2px}
main{padding:4px max(4vw,14px) 24px;max-width:820px;margin:0 auto}
section{margin-top:18px}
h2{font-size:19px;font-weight:900;margin:0 0 4px;padding:6px 10px;background:var(--yel);color:#151515;border-radius:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-size:12px;font-weight:500;color:#555;flex:none}
.gd{font-size:13px;color:var(--sub);margin:0 2px 4px}
.row{padding:9px 2px;border-bottom:1px solid var(--line)}
.n{font-size:15px;font-weight:500}
.n .d{display:block;font-size:13px;font-weight:400;color:var(--sub);margin-top:1px}
.ps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:6px}
.c{background:var(--card);border-radius:8px;padding:3px 6px;text-align:right}
.c.k{background:var(--pink)}
.c i{display:block;font-style:normal;font-size:11px;color:var(--sub);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.one{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.one .p{font-weight:700;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.na{color:var(--sub);font-weight:400}
.warn{font-size:12px;color:var(--red);margin-top:3px}
mark{background:var(--yel);color:#151515;border-radius:3px;padding:0 1px}
.new{font-size:11px;font-weight:700;color:#fff;background:var(--red);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:2px}
.empty{color:var(--sub);text-align:center;padding:40px 0}
.notes{font-size:13px;color:var(--sub);border-top:2px solid var(--line);margin-top:28px;padding-top:12px}
.notes p{margin:4px 0}
</style>
</head>

const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const hl=(s,q)=>{const t=esc(s);if(!q)return t;const r=new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');return t.replace(r,m=>'<mark>'+m+'</mark>')};

let cat='全部',view='四欄全看';

const mk=(el,arr,cur,lbl)=>{el.innerHTML=`<span class="lbl">${lbl}</span>`+arr.map(c=>`<button class="chip" type="button" aria-pressed="${c===cur}">${esc(c)}</button>`).join('')};
mk(cols,VIEWS,view,'價格');mk(chips,CATS,cat,'分類');
const priceHTML=p=>{
  if(view==='四欄全看')return `<div class="ps">${p.map((v,i)=>`<div class="c${i===2?' k':''}"><i>${COLS[i]}</i><b>${fmt(v)}</b></div>`).join('')}</div>`;
  return '';
};
const render=()=>{
  const q=qi.value.trim(),ql=q.toLowerCase(),ci=COLS.indexOf(view);
  let out='';
  for(const d of DATA){
    if(cat!=='全部'&&d.c!==cat)continue;
    const gHit=ql&&(d.g+' '+(d.d||'')).toLowerCase().includes(ql);
    const rows=d.i.filter(([a,b])=>!ql||gHit||(a+' '+b).toLowerCase().includes(ql));
    if(!rows.length)continue;
    out+=`<section><h2>${hl(d.g,q)}<small>${esc(d.c)}${ci>=0?'・'+esc(view):''}</small></h2>`+(d.d?`<div class="gd">${hl(d.d,q)}</div>`:'')+
      rows.map(([a,b,p,nw,w])=>{
        const name=`<div class="n">${hl(a,q)}${nw?'<span class="new">新</span>':''}${b?`<span class="d">${hl(b,q)}</span>`:''}</div>`;
        const warn=w?`<div class="warn">${esc(w)}</div>`:'';
        return ci>=0?`<div class="row"><div class="one">${name}<div class="p">${fmt(p[ci])}</div></div>${warn}</div>`
                    :`<div class="row">${name}${priceHTML(p)}${warn}</div>`;
      }).join('')+'</section>';
  }
  list.innerHTML=out||'<div class="empty">找不到符合的品項</div>';
};
chips.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.textContent;for(const c of chips.querySelectorAll('.chip'))c.setAttribute('aria-pressed',c===b);render();window.scrollTo({top:0})});
cols.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;view=b.textContent;for(const c of cols.querySelectorAll('.chip'))c.setAttribute('aria-pressed',c===b);try{localStorage.setItem('aracer_view',view)}catch(e){}render()});
qi.addEventListener('input',render);
document.getElementById('clr').addEventListener('click',()=>{qi.value='';render();qi.focus()});
render();
}

</html>
